            {given || "Javob berilmagan"}
          </div>
        </div>
      );
    }

    function ResultSectionReview({ title, icon, questions }) {
      if (!questions || !questions.length) return null;
      return (
        <div className="space-y-3">
          <div className="flex items-center gap-2">
            <Icon name={icon} size={16} style={{ color: C.teal }} />
            <h3 className="f-display text-[16px] font-semibold" style={{ color: C.ink }}>{title}</h3>
          </div>
          <div className="space-y-2.5">
            {questions.map((q) => <ResultQuestionRow key={q.id} q={q} />)}
          </div>
        </div>
      );
    }

    /* Bitta yozma (writing) task uchun — band, mezonlar (agar baholangan bo'lsa)
       va o'quvchining original matni. Faqat o'qish uchun (tahrirlab bo'lmaydi). */
    function ResultWritingTaskCard({ title, text, band, criteria }) {
      return (
        <div className="rounded-xl p-4 space-y-3" style={{ border: `1px solid ${C.borderSoft}` }}>
          <div className="flex items-center justify-between">
            <div className="font-bold text-[13px] uppercase tracking-wide" style={{ color: C.tealDeep }}>{title}</div>
            {band != null && <Badge tone="gold">Band {band}</Badge>}
          </div>
          <div className="rounded-lg p-3 max-h-64 overflow-y-auto text-[13.5px] leading-relaxed whitespace-pre-wrap" style={{ backgroundColor: C.paperDim, color: C.text }}>
            {text || "(Bo'sh — javob yozilmagan)"}
          </div>
          {criteria && (
            <div className="grid grid-cols-2 gap-2 text-[12.5px]">
              {WRITING_CRITERIA.map((c) => (
                <div key={c.key} className="flex justify-between rounded-lg px-2.5 py-1.5" style={{ backgroundColor: C.paperDim }}>
                  <span style={{ color: C.muted }}>{c.label}</span>
                  <span className="font-semibold" style={{ color: C.ink }}>{criteria[c.key] ?? "—"}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    /* Bitta mockning to'liq natija sahifasi — o'quvchi "Natijalar" bo'limidagi
       card ustiga bosganda ochiladi. Barcha savollar mock vaqtidagi holatda
       (avtomatik to'g'irlanmagan holda) ko'rsatiladi. */
    function ResultDetail({ result: r, exam, onBack }) {
      const wt = r.writingText && typeof r.writingText === "object" ? r.writingText : { task1: "", task2: r.writingText || "" };
      const hasWriting = r.writingStatus && r.writingStatus !== "n/a";
      const stats = r.stats || null;
      return (
        <div className="space-y-6 max-w-4xl mx-auto">
          <button onClick={onBack} className="flex items-center gap-1.5 text-[13px] font-semibold" style={{ color: C.muted }}>
            <Icon name="arrow-left" size={15} /> Natijalarga qaytish
          </button>

          <Card>
            <div className="flex flex-col sm:flex-row sm:items-center gap-5">
              <BandDial value={r.overallBand} size={110} label="Overall Band" />
              <div className="flex-1 min-w-0">
                <div className="font-semibold text-[19px] f-display" style={{ color: C.ink }}>{r.examTitle || exam?.title || "Mock exam"}</div>
                <div className="text-[13px] mb-3" style={{ color: C.mutedSoft }}>{fmtDate(r.submittedAt)}</div>
                <div className="flex gap-2 flex-wrap text-[12.5px]">
                  {r.sectionScores?.listening != null && (
                    <Badge tone="teal">
                      Listening: {r.sectionRaw?.listening ? `${r.sectionRaw.listening.correct}/${r.sectionRaw.listening.total}` : `${r.sectionScores.listening}%`}
                      {r.sectionBands?.listening != null ? ` — Band ${r.sectionBands.listening}` : ""}
                    </Badge>
                  )}
                  {r.sectionScores?.reading != null && (
                    <Badge tone="teal">
                      Reading: {r.sectionRaw?.reading ? `${r.sectionRaw.reading.correct}/${r.sectionRaw.reading.total}` : `${r.sectionScores.reading}%`}
                      {r.sectionBands?.reading != null ? ` — Band ${r.sectionBands.reading}` : ""}
                    </Badge>
                  )}
                  {r.sectionScores?.vocabulary != null && <Badge tone="teal">Vocabulary: {r.sectionScores.vocabulary}%</Badge>}
                  {hasWriting && r.writingStatus === "pending_review" && <Badge tone="gold">Writing: ko'rib chiqilmoqda</Badge>}
                  {hasWriting && r.writingStatus === "graded" && <Badge tone="success">Writing — Band {r.writingBand}</Badge>}
                </div>
              </div>
            </div>
          </Card>

          {stats && (
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <StatCard icon="circle-check" tone="teal" label="To'g'ri javoblar" value={stats.correctCount} />
              <StatCard icon="circle-xmark" tone="gold" label="Noto'g'ri javoblar" value={stats.wrongCount} />
              <StatCard icon="circle-question" tone="ink" label="Javob berilmagan" value={stats.unansweredCount} />
              <StatCard icon="percent" tone="teal" label="Umumiy aniqlik" value={stats.accuracy != null ? `${stats.accuracy}%` : "—"} />
            </div>
          )}

          {r.review && (r.review.listening?.length || r.review.reading?.length || r.review.vocabulary?.length) ? (
            <Card className="space-y-6">
              <div>
                <h2 className="f-display text-[18px] font-semibold mb-1" style={{ color: C.ink }}>Savollar review</h2>
                <p className="text-[12.5px]" style={{ color: C.muted }}>Bu — mock vaqtida aynan qanday javob berganingiz. Javoblar avtomatik to'g'irlanmagan.</p>
              </div>
              <ResultSectionReview title="Listening" icon="headphones" questions={r.review.listening} />
              <ResultSectionReview title="Reading" icon="book-open" questions={r.review.reading} />
              <ResultSectionReview title="Vocabulary" icon="layer-group" questions={r.review.vocabulary} />
            </Card>
          ) : null}

          {hasWriting && (
            <Card className="space-y-4">
              <div className="flex items-center justify-between">
                <h2 className="f-display text-[18px] font-semibold" style={{ color: C.ink }}>Writing</h2>
                {r.writingStatus === "graded" && r.writingBand != null && (
                  <Badge tone="success">Overall Writing Band: {r.writingBand}</Badge>
                )}
              </div>
              {r.writingStatus === "pending_review" && (
                <div className="text-[13px] rounded-lg p-3" style={{ backgroundColor: C.goldSoft, color: C.goldDeep }}>
                  Writing javoblaringiz hali o'qituvchi tomonidan ko'rib chiqilmoqda.
                </div>
              )}
              <ResultWritingTaskCard title="Task 1" text={wt.task1} band={r.task1Band} criteria={r.task1Criteria} />
              <ResultWritingTaskCard title="Task 2" text={wt.task2} band={r.task2Band} criteria={r.task2Criteria} />
            </Card>
          )}
        </div>
      );
    }

    // Student's own profile: personal info + photo only — no login/password
    // editing (that stays admin-managed) — plus a logout action.
    function StudentProfile({ student, group, actions, onLogout }) {
      const setAvatar = async (dataUrl) => {
        await actions.updateStudent(student.id, { avatar: dataUrl });
      };
      return (
        <div className="max-w-3xl mx-auto space-y-5">
          <Card>
            <ProfileSectionHeader label="Shaxsiy ma'lumotlar" />
            <div className="flex items-center gap-4 mb-5">
              <AvatarUpload name={student.name} avatar={student.avatar} onChange={setAvatar} />
              <div className="min-w-0">
                <div className="font-semibold text-[18px] f-display truncate" style={{ color: C.ink }}>{student.name}</div>
                <div className="text-[13px] truncate" style={{ color: C.mutedSoft }}>@{student.username}</div>
              </div>
            </div>
            <div className="space-y-3 text-[13.5px]">
              <div className="flex justify-between py-2" style={{ borderBottom: `1px solid ${C.borderSoft}` }}>
                <span style={{ color: C.muted }}>Guruh</span><span className="font-semibold" style={{ color: C.text }}>{group?.name || "—"}</span>
              </div>
              <div className="flex justify-between py-2" style={{ borderBottom: `1px solid ${C.borderSoft}` }}>
                <span style={{ color: C.muted }}>Daraja</span><span className="font-semibold" style={{ color: C.text }}>{group?.level || "—"}</span>
              </div>
              <div className="flex justify-between py-2">
                <span style={{ color: C.muted }}>A'zo bo'lgan sana</span><span className="font-semibold" style={{ color: C.text }}>{fmtDate(student.createdAt)}</span>
              </div>
            </div>
          </Card>

          <Card>
            <ProfileSectionHeader label="Tizimdan chiqish" tone="danger" />
            <div className="text-[13px] mb-4" style={{ color: C.muted }}>Tizimdan chiqsangiz, qayta kirishda username va parol so'raladi.</div>
            <Button variant="danger" icon="right-from-bracket" onClick={onLogout}>Chiqish</Button>
          </Card>
        </div>
      );
    }

    function StudentApp({ session, data, actions, onLogout, toast, organizations, unreadMsg }) {
      /* "organizations" ro'yxati endi faqat Support uchun to'liq keladi — bu
         yerda (o'quvchi ilovasida) o'z tashkiloti haqidagi ma'lumot esa
         to'g'ridan-to'g'ri profildan (session.user.organizationDetail). */
      const myOrg = session.user?.organizationDetail || (organizations || []).find((o) => o.id === session.orgId) || null;
      const [tab, setTab] = useState("overview");
      const [collapsedState, setCollapsedState] = useState(!!session.user?.sidebarCollapsed);
      const setCollapsed = (next) => {
        setCollapsedState((c) => {
          const value = typeof next === "function" ? next(c) : next;
          actions.setSidebarCollapsed(value);
          return value;
        });
      };
      const collapsed = collapsedState;
      /* "Texnik xizmat" — footer tugmasi orqali ochiladigan modal. */
      const [showSupport, setShowSupport] = useState(false);
      const [supportSending, setSupportSending] = useState(false);
      const submitSupportTicket = async (message) => {
        setSupportSending(true);
        const ok = await actions.submitSupportTicket(message);
        setSupportSending(false);
        if (ok !== false) {
          setShowSupport(false);
          toast("success", "Murojaatingiz texnik xizmatga yuborildi");
        }
      };
      const [activeExam, setActiveExam] = useState(null);
      const [viewAssignment, setViewAssignment] = useState(null);
      const [justFinishedResultId, setJustFinishedResultId] = useState(null);
      const student = session.user;
      const group = data.groups.find((g) => g.id === student.groupId);

      /* "Resume exam": agar o'quvchi mockni tugatmasdan chiqib ketgan/sahifani
         yopib qo'ygan bo'lsa (backend'da tugallanmagan ExamAttempt bo'lsa),
         dashboard ochilishi bilan o'sha examga avtomatik qaytariladi — javoblari
         va taymeri saqlanib qolgan holda (ExamRunner o'zi examApi.start orqali
         tiklaydi). O'ziga tegishli, hozir "on" va guruhiga biriktirilgan har
         bir examdan birortasida tugallanmagan urinish bormi — shuni tekshiramiz. */
      useEffect(() => {
        let cancelled = false;
        (async () => {
          const candidates = data.exams.filter((e) => e.status === "on" && e.assignedGroupIds.includes(student.groupId));
          for (const ex of candidates) {
            try {
              const progress = await examApi.getProgress(ex.id);
              if (cancelled) return;
              if (progress) {
                setActiveExam(ex);
                toast("success", "Tugallanmagan mock exam davom ettirilmoqda — javoblaringiz saqlangan.");
                return;
              }
            } catch (e) { /* davom etayotgan urinish yo'q — jim o'tkazamiz */ }
          }
        })();
        return () => { cancelled = true; };
      }, []); // eslint-disable-line

      const myAssignments = data.assignments.filter((a) => assignmentTargetsStudent(a, student));
      const unseenAssignments = myAssignments.filter((a) => !a.viewedBy.includes(student.id));
      const myExamsForNotif = data.exams.filter((e) => e.status === "on" && e.assignedGroupIds.includes(student.groupId));
      const unseenExams = myExamsForNotif.filter((e) => !(e.notifSeenBy || []).includes(student.id));
      const unseenCount = unseenAssignments.length + unseenExams.length;
      const notifications = [
        ...unseenAssignments.map((a) => ({ kind: "assignment", id: a.id, icon: "clipboard-list", title: a.title, subtitle: fmtDate(a.createdAt), sortAt: a.createdAt })),
        ...unseenExams.map((e) => ({ kind: "exam", id: e.id, icon: "book-open", title: `Yangi mock exam: ${e.title}`, subtitle: fmtDate(e.reopenedAt || e.createdAt), sortAt: e.reopenedAt || e.createdAt })),
      ].sort((a, b) => b.sortAt - a.sortAt);

      const openAssignmentFromNotif = async (n) => {
        if (n.kind === "exam") {
          const e = myExamsForNotif.find((x) => x.id === n.id);
          if (!e) return;
          setTab("exams");
          if (!(e.notifSeenBy || []).includes(student.id)) await actions.markExamNotifSeen(e.id, student.id);
          return;
        }
        const a = myAssignments.find((x) => x.id === n.id);
        if (!a) return;
        setTab("assignments");
        setViewAssignment(a);
        if (!a.viewedBy.includes(student.id)) await actions.markAssignmentViewed(a.id, student.id);
      };

      useEffect(() => {
        if (tab !== "exams" || !unseenExams.length) return;
        unseenExams.forEach((e) => { actions.markExamNotifSeen(e.id, student.id); });
      }, [tab]); // eslint-disable-line

      const tabs = [
        { key: "overview", label: "Bosh sahifa", icon: "table-cells-large" },
        { key: "exams", label: "Mock exams", icon: "book-open" },
        { key: "assignments", label: "Vazifalarim", icon: "clipboard-list" },
        { key: "results", label: "Natijalar", icon: "award" },
        { key: "profile", label: "Profile", icon: "user" },
      ];
      const titles = { overview: "Bosh sahifa", exams: "Mock Exams", assignments: "Vazifalarim", results: "Natijalarim", profile: "Profile" };

      if (activeExam) {
        return (
          <ExamRunner
            exam={activeExam} student={student} toast={toast}
            onExit={() => setActiveExam(null)}
            onSubmit={async (result) => {
              await actions.addResult(result);
              /* Mock tugagach, natija avtomatik ravishda "Natijalar" bo'limida ochilsin. */
              setJustFinishedResultId(result.id);
              setTab("results");
              /* Writing bo'limi bo'lsa — bot orqali CEO'ga Telegram xabari yuboriladi. */
              if (result.writingStatus === "pending_review") {
                sendWritingToCeo({ org: myOrg, student, exam: activeExam, result });
              }
            }}
          />
        );
      }

      return (
        <div className="flex min-h-screen" style={{ backgroundColor: C.paper }}>
          {FONTS}
          <Sidebar role="student" name={student.name} tabs={tabs} active={tab} onChange={setTab} onLogout={onLogout} notifCount={unseenCount} notifTabKey="assignments" collapsed={collapsed} setCollapsed={setCollapsed} onSupportClick={() => setShowSupport(true)} />
          <div className="flex-1 min-w-0">
            <TopBar
              title={titles[tab]}
              notifCount={unseenCount}
              notifications={notifications}
              onNotifClick={openAssignmentFromNotif}
              name={student.name}
              avatar={student.avatar}
              onGoProfile={() => setTab("profile")}
              onLogout={onLogout}
            />
            <div className="p-5 md:p-8 pb-24 md:pb-8 max-w-5xl mx-auto">
              {tab === "overview" && (
                <StudentOverview student={student} group={group} exams={data.exams} assignments={data.assignments} results={data.results}
                  onGoExams={() => setTab("exams")} onGoAssignments={() => setTab("assignments")} />
              )}
              {tab === "exams" && <StudentExams student={student} exams={data.exams} results={data.results} onStart={setActiveExam} />}
              {tab === "assignments" && (
                <StudentAssignments student={student} assignments={data.assignments}
                  onView={async (a) => { setViewAssignment(a); if (!a.viewedBy.includes(student.id)) await actions.markAssignmentViewed(a.id, student.id); }} />
              )}
              {tab === "results" && (
                <StudentResults
                  student={student} results={data.results} exams={data.exams}
                  openResultId={justFinishedResultId}
                  onOpened={() => setJustFinishedResultId(null)}
                />
              )}
              {tab === "profile" && <StudentProfile student={student} group={group} actions={actions} onLogout={onLogout} />}
            </div>
          </div>
          <BottomNav tabs={tabs} active={tab} onChange={setTab} notifTabKey="assignments" notifCount={unseenCount} onSupportClick={() => setShowSupport(true)} />
          {viewAssignment && <AssignmentViewModal a={viewAssignment} onClose={() => setViewAssignment(null)} />}
          {showSupport && (
            <TechSupportModal
              onClose={() => setShowSupport(false)}
              onSubmit={submitSupportTicket}
              loading={supportSending}
            />
          )}
          {/* CEO'dan kelgan hali javob berilmagan xabar bo'lsa, Dashboard
              ochilishi bilan avtomatik ko'rsatiladi. */}
          {unreadMsg && (
            <UnreadMessageModal
              msg={unreadMsg}
              onRead={(id) => actions.respondToMessage(id, "read")}
              onIgnore={(id) => actions.respondToMessage(id, "ignored")}
            />
          )}
        </div>
      );
    }

    /* ============================================================
       ROOT APP
       ============================================================ */
    // If window.IELTS_FIXED_ROLE is set (per-file build), the app skips the
    // role-selection landing page entirely and boots straight into that
    // role's login screen — used for the 3 separate CEO/Support/Student links.
    // Role is chosen via URL query string: ?role=ceo / ?role=support / anything
    // else (or missing) defaults to student. No role-selection screen is shown —
    // the link itself determines which login the visitor lands on.
    /* ============================================================
       SUPPORT — Tashkilotlar (CEO'lar) boshqaruvi
       SUPPORT roli faqat shu bo'limni ko'radi: "barcha CEO'larni ko'radi,
       CEO yaratadi/boshqaradi" — operatsion ma'lumotlarga (guruh/o'quvchi/
       mock/natija) umuman kirmaydi, chunki bular orgId bo'yicha CEO'larga
       tegishli va Support'ning o'zi hech qaysi orgId'ga ega emas.
       ============================================================ */
    function SupportOrgFormModal({ initial, existingUsernames, onClose, onSave, toast }) {
      const [orgName, setOrgName] = useState(initial?.orgName || "");
      const [ceoName, setCeoName] = useState(initial?.ceoName || "");
      const [phone, setPhone] = useState(initial?.phone || "");
      const [email, setEmail] = useState(initial?.email || "");
      const [username, setUsername] = useState(initial?.username || "");
      const [password, setPassword] = useState(initial?.password || (initial ? "" : randomPassword6()));
      const [telegramChatId, setTelegramChatId] = useState(initial?.telegramChatId || "");
      const [status, setStatus] = useState(initial?.status || "active");
      const [saving, setSaving] = useState(false);

      const submit = async () => {
        if (!orgName.trim()) { toast("error", "Tashkilot nomini kiriting"); return; }
        if (!ceoName.trim()) { toast("error", "CEO ismini kiriting"); return; }
        const uname = username.trim().toLowerCase();
        if (!uname) { toast("error", "Username kiriting"); return; }
        const taken = existingUsernames.some((u) => u.value === uname && u.id !== initial?.id);
        if (taken) { toast("error", "Bu username band — boshqasini tanlang"); return; }
        if (!password) { toast("error", "Parol kiriting"); return; }
        setSaving(true);
        await onSave({
          id: initial?.id || genId("org"),
          orgName: orgName.trim(),
          ceoName: ceoName.trim(),
          phone: phone.trim(),
          email: email.trim(),
          username: uname,
          password,
          telegramChatId: telegramChatId.trim(),
          status,
          createdAt: initial?.createdAt || Date.now(),
        });
        setSaving(false);
      };

      return (
        <Modal title={initial ? "CEO / tashkilotni tahrirlash" : "Yangi CEO yaratish"} onClose={onClose}>
          <div className="space-y-4">
            <Input label="Tashkilot / o'quv markazi nomi" value={orgName} onChange={setOrgName} placeholder="Masalan: Compass Learning Center" icon="building" required />
            <Input label="CEO ismi" value={ceoName} onChange={setCeoName} placeholder="To'liq ism" icon="user" required />
            <div className="grid sm:grid-cols-2 gap-4">
              <Input label="Telefon" value={phone} onChange={setPhone} placeholder="+998 90 000 00 00" icon="phone" />
              <Input label="Email" value={email} onChange={setEmail} placeholder="ceo@markaz.uz" icon="envelope" />
            </div>
            <div className="grid sm:grid-cols-2 gap-4">
              <Input label="Username" value={username} onChange={setUsername} placeholder="username" icon="at" required />
              <Input label="Parol" value={password} onChange={setPassword} placeholder="Parol" icon="key" required />
            </div>
            <Input label="Telegram Chat ID" value={telegramChatId} onChange={setTelegramChatId} placeholder="Masalan: 123456789" icon="paper-plane" hint="Shu CEO'ga tegishli bildirishnomalar aynan shu Chat ID'ga yuboriladi." />
            <Select label="Status" value={status} onChange={setStatus} options={[{ value: "active", label: "Faol" }, { value: "inactive", label: "Faol emas" }]} />
            <div className="flex justify-end gap-2 pt-2">
              <Button variant="ghost" onClick={onClose}>Bekor qilish</Button>
              <Button onClick={submit} loading={saving} icon="check">{initial ? "Saqlash" : "Yaratish"}</Button>
            </div>
          </div>
        </Modal>
      );
    }

    /* Support -> CEO: "Xabar yuborish" modali. Har bir tashkilot kartasidagi
       tugma orqali ochiladi (shu org "single" rejimda oldindan tanlangan
       holda), lekin ichida "Barcha CEO'larga" ham yuborish mumkin. */
    function SupportMessageModal({ org, organizations, onClose, onSubmit, toast }) {
      const [mode, setMode] = useState("single"); // 'single' | 'all'
      const [targetOrgId, setTargetOrgId] = useState(org?.id || (organizations[0]?.id || ""));
      const [message, setMessage] = useState("");
      const [sending, setSending] = useState(false);
      const trimmed = message.trim();
      const canSubmit = trimmed.length >= 2 && !sending && (mode === "all" || targetOrgId);

      const submit = async () => {
        if (!canSubmit) return;
        setSending(true);
        const ok = mode === "all"
          ? await onSubmit({ mode: "all", message: trimmed })
          : await onSubmit({ mode: "single", orgId: targetOrgId, message: trimmed });
        setSending(false);
        if (ok !== false) {
          onClose();
          toast("success", mode === "all" ? "Xabar barcha CEO'larga yuborildi" : "Xabar yuborildi");
        }
      };

      return (
        <Modal title="CEO'ga xabar yuborish" onClose={onClose} width="560px">
          <div className="space-y-4">
            <div className="flex gap-2">
              <button
                type="button" onClick={() => setMode("single")}
                className="flex-1 rounded-lg px-3 py-2.5 text-[13px] font-semibold text-left transition-colors"
                style={{ border: `1.5px solid ${mode === "single" ? C.teal : C.border}`, backgroundColor: mode === "single" ? C.tealSoft : "transparent", color: mode === "single" ? C.tealDeep : C.muted }}
              >
                <Icon name="user" size={13} className="mr-1.5" /> Aynan bitta CEO
              </button>
              <button
                type="button" onClick={() => setMode("all")}
                className="flex-1 rounded-lg px-3 py-2.5 text-[13px] font-semibold text-left transition-colors"
                style={{ border: `1.5px solid ${mode === "all" ? C.teal : C.border}`, backgroundColor: mode === "all" ? C.tealSoft : "transparent", color: mode === "all" ? C.tealDeep : C.muted }}
              >
                <Icon name="users" size={13} className="mr-1.5" /> Barcha CEO'larga
              </button>
            </div>
            {mode === "single" && (
              <Select
                label="CEO tanlang"
                value={targetOrgId}
                onChange={setTargetOrgId}
                options={organizations.map((o) => ({ value: o.id, label: `${o.orgName} (${o.ceoName})` }))}
              />
            )}
            <TextArea label="Xabar matni" value={message} onChange={setMessage} rows={6} placeholder="Xabaringizni shu yerga yozing..." />
            <div className="flex justify-end gap-2">
              <Button variant="ghost" onClick={onClose} disabled={sending}>Bekor qilish</Button>
              <Button variant="teal" icon="paper-plane" onClick={submit} disabled={!canSubmit} loading={sending}>Yuborish</Button>
            </div>
          </div>
        </Modal>
      );
    }

    /* Support'ning o'zi yuborgan barcha xabarlari va ularning statusi
       (Yuborilgan / O'qilgan / E'tiborsiz qoldirilgan) — "Xabarlar" tabida. */
    function SupportMessages({ messages }) {
      const sent = (messages || []).filter((m) => m.senderRole === "support").slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      return (
        <div className="space-y-2.5">
          {sent.map((m) => (
            <Card key={m.id}>
              <div className="flex items-start justify-between gap-3">
                <div className="min-w-0">
                  <div className="text-[13.5px] font-semibold truncate" style={{ color: C.ink }}>{m.recipientName}</div>
                  <div className="text-[13px] mt-1 whitespace-pre-wrap" style={{ color: C.muted }}>{m.message}</div>
                  <div className="text-[11.5px] mt-1.5" style={{ color: C.mutedSoft }}>{fmtDateTime(m.createdAt)}</div>
                </div>
                <MessageStatusBadge status={m.status} />
              </div>
            </Card>
          ))}
          {!sent.length && <EmptyState icon="envelope" title="Hali xabar yuborilmagan" sub="Tashkilotlar bo'limidan CEO'ga xabar yuborishingiz mumkin" />}
        </div>
      );
    }

    function SupportOrganizations({ organizations, orgStaff, actions, toast }) {
      const [showForm, setShowForm] = useState(null); // null | {} (new) | org (edit)
      const [search, setSearch] = useState("");
      const [viewPwFor, setViewPwFor] = useState(null);
      const [staffOrg, setStaffOrg] = useState(null); // org whose staff modal is open
      const [confirmDelete, setConfirmDelete] = useState(null); // org pending delete confirmation
      const [deleting, setDeleting] = useState(false);

      const existingUsernames = organizations.map((o) => ({ value: o.username, id: o.id }));
      const filtered = organizations.filter((o) => o.orgName.toLowerCase().includes(search.toLowerCase()) || o.ceoName.toLowerCase().includes(search.toLowerCase()));

      const save = async (org) => {
        const isNew = !organizations.some((o) => o.id === org.id);
        const ok = isNew ? await actions.addOrganization(org) : await actions.updateOrganization(org.id, org);
        if (ok !== false) {
          toast("success", isNew ? "Yangi CEO / tashkilot yaratildi" : "Tashkilot yangilandi");
          setShowForm(null);
        }
      };

      return (
        <div className="space-y-4">
          <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
            <div className="relative w-full sm:w-72">
              <Icon name="magnifying-glass" size={15} style={{ color: C.mutedSoft }} className="absolute left-3 top-1/2 -translate-y-1/2" />
              <input
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                placeholder="Qidirish..."
                className="w-full rounded-lg text-[13.5px] outline-none"
                style={{ padding: "9px 12px 9px 32px", border: `1.5px solid ${C.border}`, backgroundColor: C.card }}
              />
            </div>
            <Button icon="building-circle-check" onClick={() => setShowForm({})}>Yangi CEO yaratish</Button>
          </div>

          <div className="grid sm:grid-cols-2 gap-4">
            {filtered.map((o) => (
              <Card key={o.id}>
                <div className="flex items-start justify-between gap-3 mb-3">
                  <button
                    type="button"
                    onClick={() => setStaffOrg(o)}
                    className="min-w-0 text-left hover:underline decoration-1 underline-offset-2"
                    title="Xodimlarni ko'rish"
                  >
                    <div className="f-display font-semibold text-[16px] truncate" style={{ color: C.ink }}>{o.orgName}</div>
                    <div className="text-[12.5px] truncate" style={{ color: C.mutedSoft }}>CEO: {o.ceoName}</div>
                  </button>
                  <div className="flex items-center gap-1.5 shrink-0">
                    <Badge tone={o.status === "active" ? "success" : "danger"}>{o.status === "active" ? "Faol" : "Faol emas"}</Badge>
                    <ActionMenu items={[
                      {
                        icon: "user-tie",
                        label: `Xodimlar${orgStaff.filter((s) => s.orgId === o.id).length ? ` (${orgStaff.filter((s) => s.orgId === o.id).length})` : ""}`,
                        onClick: () => setStaffOrg(o),
                      },
                      { icon: "pen", label: "Tahrirlash", onClick: () => setShowForm(o) },
                      { icon: "eye", label: "Login", onClick: () => setViewPwFor(o) },
                      o.status === "active"
                        ? { icon: "ban", label: "Bloklash", onClick: async () => { await actions.setOrganizationStatus(o.id, "inactive"); toast("success", "Tashkilot bloklandi"); } }
                        : { icon: "circle-check", label: "Faollashtirish", onClick: async () => { await actions.setOrganizationStatus(o.id, "active"); toast("success", "Tashkilot faollashtirildi"); } },
                      { icon: "trash", label: "O'chirish", onClick: () => setConfirmDelete(o), danger: true },
                    ]} />
                  </div>
                </div>
                <div className="space-y-1.5 text-[13px]" style={{ color: C.muted }}>
                  <div className="flex items-center gap-2"><Icon name="at" size={12} /> {o.username}</div>
                  {o.phone && <div className="flex items-center gap-2"><Icon name="phone" size={12} /> {o.phone}</div>}
                  {o.email && <div className="flex items-center gap-2"><Icon name="envelope" size={12} /> {o.email}</div>}
                  {o.telegramChatId && <div className="flex items-center gap-2"><Icon name="paper-plane" size={12} /> {o.telegramChatId}</div>}
                </div>
              </Card>
            ))}
          </div>
          {!filtered.length && <EmptyState icon="building" title="Tashkilotlar topilmadi" sub="Yangi CEO yaratish uchun yuqoridagi tugmani bosing" />}

          {showForm !== null && (
            <SupportOrgFormModal
              initial={showForm.id ? showForm : null}
              existingUsernames={existingUsernames}
              onClose={() => setShowForm(null)}
              onSave={save}
              toast={toast}
            />
          )}

          {viewPwFor && (
            <Modal title="CEO login ma'lumotlari" onClose={() => setViewPwFor(null)} width="440px">
              <div className="space-y-4">
                <div className="rounded-xl p-4 space-y-2.5" style={{ backgroundColor: C.paperDim }}>
                  <CopyField label="Username" value={viewPwFor.username} />
                  {viewPwFor.password ? (
                    <CopyField label="Parol" value={viewPwFor.password} />
                  ) : (
                    <div className="text-[12.5px]" style={{ color: C.mutedSoft }}>
                      Parol xavfsizlik uchun bazada shifrlangan holda saqlanadi va qayta ko'rsatib bo'lmaydi. Yangi parol belgilash uchun "Tahrirlash"ni bosing.
                    </div>
                  )}
                </div>
                <div className="flex justify-end"><Button onClick={() => setViewPwFor(null)} icon="check">Yopish</Button></div>
              </div>
            </Modal>
          )}

          {staffOrg && (
            <SupportOrgStaffModal
              org={staffOrg}
              orgStaff={orgStaff.filter((s) => s.orgId === staffOrg.id)}
              actions={actions}
              toast={toast}
              onClose={() => setStaffOrg(null)}
            />
          )}

          {confirmDelete && (
            <Modal title="Tashkilotni o'chirish" onClose={() => !deleting && setConfirmDelete(null)} width="440px">
              <div className="space-y-4">
                <div className="text-[13.5px]" style={{ color: C.muted }}>
                  <strong style={{ color: C.ink }}>{confirmDelete.orgName}</strong> tashkilotini butunlay o'chirmoqchimisiz? Bu amalni ortga qaytarib bo'lmaydi — CEO shu login bilan endi kira olmaydi.
                </div>
                <div className="flex justify-end gap-2">
                  <Button variant="ghost" onClick={() => setConfirmDelete(null)} disabled={deleting}>Bekor qilish</Button>
                  <Button
                    variant="danger"
                    icon="trash"
                    onClick={async () => {
                      setDeleting(true);
                      const ok = await actions.deleteOrganization(confirmDelete.id);
                      setDeleting(false);
                      if (ok) { toast("success", "Tashkilot o'chirildi"); setConfirmDelete(null); }
                    }}
                  >
                    {deleting ? "O'chirilmoqda..." : "Ha, o'chirish"}
                  </Button>
                </div>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    /* Support tomonidan tanlangan bitta tashkilotning xodimlari (endi FAQAT
       "Admin" — eski Manager/Teacher hisoblari backendda migratsiya orqali
       "admin"ga o'tkazilgan) ro'yxati — ko'rish, YANGI XODIM (Admin)
       YARATISH, tahrirlash, parolni ko'rish/yangilash, bloklash/faollashtirish
       va butunlay o'chirish.
       MUHIM: Support shu yerda FAQAT "Admin" rolida xodim yarata oladi,
       tanlangan tashkilotga bog'lab — "Support" roli bu yerda HECH QACHON
       tanlanmaydi (STAFF_ROLES'da yo'q) va hech kim (Support ham) boshqa
       Support hisobini bu yerdan (yoki umuman hech qayerdan) yaratolmaydi/
       tahrirlay olmaydi/o'chira olmaydi — backendda ham alohida himoyalangan. */
    function SupportOrgStaffModal({ org, orgStaff, actions, toast, onClose }) {
      const [showNew, setShowNew] = useState(false);
      const [name, setName] = useState("");
      const [role, setRole] = useState("admin");
      const [phone, setPhone] = useState("");
      const [saving, setSaving] = useState(false);
      const [created, setCreated] = useState(null);
      const [confirmDel, setConfirmDel] = useState(null);
      const [editTarget, setEditTarget] = useState(null);
      const [editName, setEditName] = useState("");
      const [editPhone, setEditPhone] = useState("");
      const [editRole, setEditRole] = useState("admin");
      const [editSaving, setEditSaving] = useState(false);
      const [viewPwFor, setViewPwFor] = useState(null);

      const creatableRoles = STAFF_ROLES; // faqat "Admin"

      const submit = async () => {
        if (!name.trim()) { toast("error", "Xodim ismini kiriting"); return; }
        setSaving(true);
        const username = usernameFromName(name, orgStaff);
        const password = randomPassword6();
        const newStaff = { id: uid("staff"), name: name.trim(), role, phone: phone.trim(), username, password, status: "active", createdAt: Date.now(), orgId: org.id };
        const ok = await actions.addOrgStaff(newStaff);
        setSaving(false);
        if (ok !== false) { setCreated(newStaff); setName(""); setPhone(""); toast("success", "Xodim yaratildi"); }
      };

      const openEdit = (s) => { setEditTarget(s); setEditName(s.name); setEditPhone(s.phone || ""); setEditRole(s.role); };
      const submitEdit = async () => {
        if (!editName.trim()) { toast("error", "Ismni kiriting"); return; }
        setEditSaving(true);
        await actions.updateOrgStaff(editTarget.id, { name: editName.trim(), phone: editPhone.trim(), role: editRole });
        setEditSaving(false);
        setEditTarget(null);
        toast("success", "Xodim ma'lumotlari yangilandi");
      };

      const roleLabel = (r) => ROLE_LABELS[r] || r;
      const roleTone = (r) => (r === "admin" ? "gold" : "muted");

      return (
        <Modal title={`${org.orgName} — Xodimlar`} onClose={onClose} width="760px">
          <div className="space-y-4">
            <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
              <div className="text-[13px]" style={{ color: C.muted }}>CEO: {org.ceoName} · shu tashkilotning Admin xodimlari.</div>
              <Button icon="user-plus" onClick={() => { setShowNew(true); setCreated(null); setRole(creatableRoles[0]?.value || "admin"); }}>Yangi xodim</Button>
            </div>

            <Card padded={false}>
              <div className="overflow-x-auto">
                <table className="w-full text-[13.5px]">
                  <thead>
                    <tr style={{ borderBottom: `1px solid ${C.borderSoft}` }}>
                      {["Ism", "Rol", "Username", "Telefon", "Holat", ""].map((h) => (
                        <th key={h} className="text-left px-4 py-3 font-semibold text-[12px] uppercase tracking-wide" style={{ color: C.mutedSoft }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {orgStaff.map((s) => (
                      <tr key={s.id} style={{ borderBottom: `1px solid ${C.borderSoft}` }}>
                        <td className="px-4 py-3 font-medium" style={{ color: C.text }}>{s.name}</td>
                        <td className="px-4 py-3"><Badge tone={roleTone(s.role)}>{roleLabel(s.role)}</Badge></td>
                        <td className="px-4 py-3 f-mono" style={{ color: C.muted }}>{s.username}</td>
                        <td className="px-4 py-3" style={{ color: C.mutedSoft }}>{s.phone || "—"}</td>
                        <td className="px-4 py-3">
                          <Badge tone={s.status === "active" ? "success" : "danger"}>{s.status === "active" ? "Faol" : "O'chirilgan"}</Badge>
                        </td>
                        <td className="px-4 py-3 text-right">
                          <div className="flex items-center justify-end">
                            <ActionMenu items={[
                              { icon: "eye", label: "Parolni ko'rish", onClick: () => setViewPwFor(s) },
                              { icon: "pen", label: "Tahrirlash", onClick: () => openEdit(s) },
                              s.status === "active"
                                ? { icon: "ban", label: "O'chirish (bloklash)", onClick: async () => { await actions.updateOrgStaff(s.id, { status: "inactive" }); toast("success", "Xodim bloklandi"); }, danger: true }
                                : { icon: "circle-check", label: "Faollashtirish", onClick: async () => { await actions.updateOrgStaff(s.id, { status: "active" }); toast("success", "Xodim faollashtirildi"); } },
                              { icon: "trash", label: "Butunlay o'chirish", onClick: () => setConfirmDel(s), danger: true },
                            ]} />
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              {!orgStaff.length && <EmptyState icon="user-tie" title="Hozircha xodimlar yo'q" />}
            </Card>

            <div className="flex justify-end pt-1">
              <Button variant="ghost" onClick={onClose}>Yopish</Button>
            </div>
          </div>

          {showNew && (
            <Modal title="Yangi xodim yaratish" onClose={() => setShowNew(false)}>
              {!created ? (
                <div className="space-y-4">
                  <Input label="To'liq ism" value={name} onChange={setName} placeholder="Masalan: Dilnoza Yusupova" required />
                  <Select label="Rol" value={role} onChange={setRole} options={creatableRoles.map((r) => ({ value: r.value, label: r.label }))} />
                  <Input label="Telefon" value={phone} onChange={setPhone} placeholder="+998 90 000 00 00" icon="phone" />
                  <div className="flex justify-end gap-2 pt-2">
                    <Button variant="ghost" onClick={() => setShowNew(false)}>Bekor qilish</Button>
                    <Button onClick={submit} loading={saving} icon="check">Yaratish</Button>
                  </div>
                </div>
              ) : (
                <div className="space-y-4">
                  <div className="flex items-center gap-2 text-[13.5px] rounded-lg px-3 py-2.5" style={{ backgroundColor: C.successSoft, color: C.success }}>
                    <Icon name="circle-check" size={16} /> Xodim muvaffaqiyatli yaratildi
                  </div>
                  <div className="rounded-xl p-4 space-y-2" style={{ backgroundColor: C.paperDim }}>
                    <div className="flex justify-between text-[13.5px]"><span style={{ color: C.muted }}>Ism</span><span className="font-semibold" style={{ color: C.text }}>{created.name}</span></div>
                    <div className="flex justify-between text-[13.5px]"><span style={{ color: C.muted }}>Rol</span><span className="font-semibold" style={{ color: C.text }}>{roleLabel(created.role)}</span></div>
                    <div className="flex justify-between text-[13.5px]"><span style={{ color: C.muted }}>Username</span><span className="f-mono font-semibold" style={{ color: C.ink }}>{created.username}</span></div>
                    <div className="flex justify-between text-[13.5px]"><span style={{ color: C.muted }}>Parol</span><span className="f-mono font-semibold" style={{ color: C.ink }}>{created.password}</span></div>
                  </div>
                  <div className="text-[12px]" style={{ color: C.mutedSoft }}>Bu ma'lumotlarni xodimga yetkazing — u "CEO / Xodim" havolasidan shu login/parol bilan kiradi.</div>
                  <div className="flex justify-end gap-2">
                    <Button variant="ghost" onClick={() => setShowNew(false)}>Yopish</Button>
                    <Button icon="plus" onClick={() => setCreated(null)}>Yana qo'shish</Button>
                  </div>
                </div>
              )}
            </Modal>
          )}

          {editTarget && (
            <Modal title="Xodimni tahrirlash" onClose={() => setEditTarget(null)}>
              <div className="space-y-4">
                <Input label="To'liq ism" value={editName} onChange={setEditName} required />
                <Select label="Rol" value={editRole} onChange={setEditRole} options={STAFF_ROLES.map((r) => ({ value: r.value, label: r.label }))} />
                <Input label="Telefon" value={editPhone} onChange={setEditPhone} icon="phone" />
                <div className="flex justify-end gap-2 pt-2">
                  <Button variant="ghost" onClick={() => setEditTarget(null)}>Bekor qilish</Button>
                  <Button onClick={submitEdit} loading={editSaving} icon="check">Saqlash</Button>
                </div>
              </div>
            </Modal>
          )}

          {viewPwFor && (
            <Modal title="Xodim paroli" onClose={() => setViewPwFor(null)} width="440px">
              <div className="space-y-4">
                <div className="rounded-xl p-4 space-y-2.5" style={{ backgroundColor: C.paperDim }}>
                  <div className="flex justify-between text-[13.5px]"><span style={{ color: C.muted }}>Ism</span><span className="font-semibold" style={{ color: C.text }}>{viewPwFor.name}</span></div>
                  <CopyField label="Username" value={viewPwFor.username} />
                  {viewPwFor.password ? (
                    <CopyField
                      label="Parol"

    /* ============================================================
       SUPPORT — "Texnik xizmat" murojaatlari (CRM ro'yxati)
       ------------------------------------------------------------
       Barcha rollardan (support'dan tashqari) footerdagi "Texnik

    function SupportTickets({ tickets, actions }) {
      const sorted = (tickets || []).slice().sort((a, b) => b.createdAt - a.createdAt);
      if (!sorted.length) {
        return (
          <Card className="text-center py-14">

            <div className="mt-1 text-[12.5px]" style={{ color: C.mutedSoft }}>
              Foydalanuvchilar footerdagi "Texnik xizmat" tugmasi orqali muammo yuborishganda, ular shu yerda ko'rinadi.
            </div>
          </Card>
        );

      return (
        <div className="space-y-3">

                <span className="font-semibold text-[14px]" style={{ color: C.ink }}>{t.userName}</span>

                {t.orgName && <span className="text-[12px]" style={{ color: C.mutedSoft }}><Icon name="building" size={11} /> {t.orgName}</span>}
                <span className="ml-auto text-[12px] shrink-0" style={{ color: C.mutedSoft }}>{fmtDateTime(t.createdAt)}</span>

              <p className="text-[13.5px] f-body whitespace-pre-wrap" style={{ color: C.text }}>{t.message}</p>

    function resolveRoleFromUrl() {
      try {
        const q = new URLSearchParams(window.location.search).get("role");
        // YANGILANDI: endi "ceo" va "admin" QAT'IY ALOHIDA login yo'nalishlari
        // — ?role=ceo faqat CEO hisobini, ?role=admin faqat Admin hisobini
        // qabul qiladi (backend ham shunday tekshiradi: apps/accounts/views.py,
        // LoginView). Boshqa rol bilan kirishga urinish "login yoki parol
        // noto'g'ri" xatosini qaytaradi — hatto parol to'g'ri bo'lsa ham.
        if (q === "ceo" || q === "admin" || q === "support") return q;
        return "student";
      } catch (e) {
        return "student";
      }
    }
    const FIXED_ROLE = typeof window !== "undefined" ? resolveRoleFromUrl() : "student";

    function App() {
      const [view, setView] = useState(FIXED_ROLE ? "login" : "landing"); // landing | login-* | app
      const [loginRole, setLoginRole] = useState(FIXED_ROLE);
      const [session, setSession] = useState(null);
      const [loginLoading, setLoginLoading] = useState(false);
      const [loginError, setLoginError] = useState("");

      const [ready, setReady] = useState(false);
      const [data, setData] = useState({ groups: [], students: [], exams: [], assignments: [], results: [] });
      const [toasts, setToasts] = useState([]);

      /* Backend snake_case (theme/sidebar_collapsed) <-> frontend camelCase.
         Har doim session.user shu shaklda saqlanadi. "organizationDetail" —
         foydalanuvchining o'z tashkiloti haqidagi ochiq ma'lumot (nomi,
         Telegram Chat ID, holati) — CEO uchun ProfileView.get()dagi ichki
         "organization" obyektidan, boshqa xodim/o'quvchi uchun esa
         "organization_detail"dan olinadi (ikkalasi ham backend'dan keladi,
         localStorage yoki alohida "organizations" ro'yxati kerak emas). */
      function normalizeSessionUser(u) {
        const rawOrg = u.organization_detail || (u.organization && typeof u.organization === "object" ? u.organization : null);
        const organizationDetail = rawOrg ? {
          id: rawOrg.id,
          orgName: rawOrg.org_name || rawOrg.name || "",
          email: rawOrg.email || "",
          telegramChatId: rawOrg.telegram_chat_id || "",
          status: rawOrg.status || "active",
        } : null;
        return { ...u, theme: u.theme === "dark" ? "dark" : "light", sidebarCollapsed: !!u.sidebar_collapsed, organizationDetail, groupId: u.group_id != null ? u.group_id : (u.group || null), };
      }

      // Sahifa yangilanganda (F5) tizimdan chiqib ketmaslik uchun:
      // localStorage'da saqlangan access token bo'lsa, backend'dan profilni
      // so'rab, sessiyani tiklaymiz. Token yaroqsiz/eskirgan bo'lsa, oddiy
      // login ekraniga qaytariladi.
      //
      // MUHIM: token qaysi rol bilan olingan bo'lsa, faqat SHU rolga mos
      // sahifada (masalan ?role=support) tiklanadi. Aks holda, support
      // sifatida login qilgan odam ?role=ceo yoki oddiy "/" havolasini
      // ochganda ham avtomatik support sifatida kirib qolar edi.
      function roleMatchesFixed(roleFromData, fixedRole) {
        // YANGILANDI: "ceo" va "admin" endi qat'iy ALOHIDA — token qaysi
        // aniq rol bilan olingan bo'lsa, faqat SHU sahifada tiklanadi.
        if (fixedRole === "ceo") return roleFromData === "ceo";
        if (fixedRole === "admin") return roleFromData === "admin";
        if (fixedRole === "support") return roleFromData === "support";
        return roleFromData === "student";
      }
      useEffect(() => {
        const access = tokenStore.getAccess();
        if (!access) return;
        (async () => {
          try {
            const res = await authApi.profile();
            if (res.success) {
              const roleFromData = res.data.role;
              if (!roleMatchesFixed(roleFromData, FIXED_ROLE)) {
                // Boshqa rol uchun saqlangan token — bu sahifada ishlatilmaydi,
                // shu rolning o'z login ekrani ko'rsatiladi.
                setView(FIXED_ROLE ? "login" : "landing");
                return;
              }
              const user = normalizeSessionUser(res.data);
              setSession({
                role: roleFromData,
                user,
                orgId: roleFromData === "ceo" ? (res.data.organization?.id || null) : (res.data.organization || null),
              });
              setTheme(user.theme);
              setView("app");
            }
          } catch (e) {
            tokenStore.clear();
          }
        })();
      }, []);

      /* ============================================================
         MULTI-TENANT: har bir CEO = alohida "organization" yozuvi.
         "organizations" — Support tomonidan yaratiladi/boshqariladi.
         "orgStaff" — har bir tashkilot ichidagi Admin/Manager/Teacher
         hisoblari (CEO shu ro'yxatda emas — u "organizations"ning o'zida).
         ============================================================ */
      const [organizations, setOrganizations] = useState([]);
      // Tashkilotlar (Organizations) endi localStorage'da emas, real backend'da
      // (Postgres) saqlanadi. Support tizimga kirganda (yoki sahifa F5 bilan
      // yangilanganda profil orqali sessiya tiklanganda) ro'yxatni backend'dan
      // yuklaymiz.
      useEffect(() => {
        if (session?.role !== "support") return;
        (async () => {
          try {
            const list = await orgApi.list();
            setOrganizations(list);
          } catch (e) {
            toast("error", e.message || "Tashkilotlar ro'yxati yuklanmadi");
          }
        })();
      }, [session?.role]);
      const [orgStaff, setOrgStaff] = useState([]);
      /* "Texnik xizmat" — barcha rollardan (support'dan tashqari) yuborilgan
         murojaatlar (tickets). Support CRM panelida bildirishnoma sifatida
         ko'rinadi va shu tashkilotning emas, PLATFORMA darajasidagi yagona
         Support hisobiga tegishli bo'lgani uchun orgId bilan cheklanmaydi. */
      const [supportTickets, setSupportTickets] = useState([]);
      /* Ichki xabar tizimi: joriy foydalanuvchiga tegishli xabarlar tarixi
         (Support<->CEO, CEO->Employee/Student — get_queryset backend'da rolga
         qarab avtomatik cheklaydi) va Dashboard ochilganda avtomatik
         ko'rsatiladigan hali javob berilmagan xabar. */
      const [messages, setMessages] = useState([]);
      const [unreadMsg, setUnreadMsg] = useState(null);

      /* Theme endi foydalanuvchi hisobiga (backend) bog'liq — bu state faqat
         UI'ning joriy ko'rinishini kuzatib boradi; manba (source of truth)
         session.user.theme, o'zgartirilganda ikkalasi ham yangilanadi (pastga
         q.: actions.toggleTheme). */
      const [theme, setTheme] = useState("light");
      useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
      }, [theme]);
      const toggleTheme = useCallback(() => {
        setTheme((t) => {
          const next = t === "dark" ? "light" : "dark";
          setSession((s) => (s ? { ...s, user: { ...s.user, theme: next } } : s));
          preferencesApi.update({ theme: next }).catch(() => { });
          return next;
        });
      }, []);

      const toast = useCallback((type, message) => {
        const id = uid("toast");
        setToasts((t) => [...t, { id, type, message }]);
        setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
      }, []);
      const removeToast = (id) => setToasts((t) => t.filter((x) => x.id !== id));

      /* Operatsion ma'lumotlar (guruhlar, o'quvchilar, mock examlar, topshiriqlar,
         natijalar, xodimlar, murojaatlar) — barchasi backend'ga (Postgres)
         saqlanadi va sessiya o'rnatilgach (login yoki F5'dan keyin profil
         orqali tiklanganda) shu yerdan yuklanadi. Har bir so'rov backend
         tomonida avtomatik ravishda joriy foydalanuvchining tashkiloti bilan
         cheklanadi (get_queryset), shu sabab bu yerda alohida orgId filtri
         shart emas — lekin pastdagi "scopedData" qo'shimcha himoya sifatida
         baribir saqlab qolinadi. */
      /* refreshData(silent): asosiy ma'lumotlarni backend'dan qayta yuklaydi.
         silent=true bo'lsa "ready" holatini o'zgartirmaydi (fon jarayonida,
         foydalanuvchiga sezilmasdan) — buni pastdagi polling effekti
         ishlatadi, shunda yangi xabar/vazifa/mock kelganda foydalanuvchi
         sahifani qo'lda yangilamasa ham bir necha soniya ichida ko'rinadi. */
      const refreshData = async (silent) => {
        if (!silent) setReady(false);
        try {
          const isSupport = session.role === "support";
          const [groups, students, exams, assignments, results, staff, tickets, msgs] = await Promise.all([
            groupApi.list().catch(() => []),
            studentApi.list().catch(() => []),
            examApi.list().catch(() => []),
            assignmentApi.list().catch(() => []),
            resultApi.list().catch(() => []),
            staffApi.list().catch(() => []),
            ticketApi.list().catch(() => []),
            messageApi.list().catch(() => []),
          ]);
          setData({ groups, students, exams, assignments, results });
          setOrgStaff(staff);
          setSupportTickets(tickets);
          setMessages(msgs);
          if (isSupport) {
            try { setOrganizations(await orgApi.list()); } catch (e) { }
          }
        } catch (e) {
          if (!silent) toast("error", e.message || "Ma'lumotlar yuklanmadi");
        } finally {
          if (!silent) setReady(true);
        }
      };

      useEffect(() => {
        if (!session) { setReady(true); return; }
        refreshData(false);
      }, [session?.role, session?.orgId]); // eslint-disable-line

      /* Fon jarayonida davriy yangilanish (polling) — o'qituvchi/CEO/support
         yangi xabar, vazifa yoki mock yuborganda, qabul qiluvchi tomon
         sahifani qo'lda yangilamasa ham bir necha soniya ichida ko'rinishi
         uchun. Hozircha backend'da WebSocket/Channels infratuzilmasi yo'q,
         shu sabab eng oddiy va ishonchli yechim — har 15 soniyada jimgina
         qayta so'rash ("ready"ni o'zgartirmasdan, ekran miltillamasin). */
      useEffect(() => {
        if (!session) return;
        const interval = setInterval(() => {
          refreshData(true);
          messageApi.unread().then(setUnreadMsg).catch(() => {});
        }, 15000);
        return () => clearInterval(interval);
      }, [session?.role, session?.orgId]); // eslint-disable-line

      /* CEO/Admin/Manager/Teacher/Student dashboard ochilganda — hali javob
         berilmagan (status="sent") xabar bo'lsa avtomatik modal ko'rsatish
         uchun alohida so'rov (Support'ning o'zi buni ko'rmaydi — u faqat
         yuboradi, qabul qilmaydi). */
      useEffect(() => {
        if (!session || session.role === "support") { setUnreadMsg(null); return; }
        (async () => {
          try {
            setUnreadMsg(await messageApi.unread());
          } catch (e) { /* jim o'tkazamiz — asosiy funksiyaga xalaqit bermasin */ }
        })();
      }, [session?.role, session?.orgId]); // eslint-disable-line

      /* ============================================================
         MULTI-TENANT ISOLATION (app-layer)
         ------------------------------------------------------------
         Bu yerda "backend" yo'q (localStorage-only ilova — pastdagi
         eslatmaga q.), shuning uchun bu tekshiruvlar KRIPTOGRAFIK jihatdan
         xavfsiz emas: DevTools orqali localStorage'ni to'g'ridan-to'g'ri
         o'qish/yozish mumkin. Lekin ilovaning O'ZI (barcha UI va action
         chaqiruvlari) hech qachon boshqa orgId'ga tegishli yozuvni
         o'zgartirishga/o'chirishga ruxsat bermaydi — har bir create'da
         orgId majburiy ravishda joriy sessiyadan olinadi (chaqiruvchi
         yuborgan orgId e'tiborga olinmaydi), har bir update/delete'da
         esa mavjud yozuvning orgId'si sessiya orgId'siga teng ekanligi
         tekshiriladi va mos kelmasa "403" xato ko'rsatilib amal bekor
         qilinadi. Real backend qo'shilganda, aynan shu tekshiruv server
         tomonida (request handler ichida) takrorlanishi kerak.
         ============================================================ */
      const sessionOrgId = session?.orgId || null;
      const isSupportSession = session?.role === "support";

      /* ---- auth ----
         MULTI-TENANT LOGIN: "ceo" havolasi endi CEO + Admin + Manager + Teacher
         uchun umumiy — qaysi hisob ekanligi kiritilgan username/password orqali
         avtomatik aniqlanadi (avval "organizations" (CEO), keyin "orgStaff"
         (Admin/Manager/Teacher) ro'yxatidan qidiriladi). Har bir hisobning
         orgId'si session'ga yoziladi — shu orgId keyingi barcha so'rovlarda
         (data ko'rish/yaratish/o'zgartirish) qat'iy tekshiriladi, hech qanday
         forma maydoni orqali boshqa orgId "yuborib" bo'lmaydi. */
      const handleLogin = async (username, password) => {
        setLoginError("");
        if (!username || !password) { setLoginError("Login va parolni kiriting"); return; }
        setLoginLoading(true);
        try {
          const res = await authApi.login(username, password, loginRole);
          if (res.success) {
            /* Login javobi qisqartirilgan (theme/tashkilot tafsilotlari yo'q) —
               shu sabab darhol to'liq profilni so'rab, session.user'ni bir xil
               shaklga keltiramiz (session-restore effekti bilan bir xil). */
            let user = normalizeSessionUser(res.data.user);
            let orgId = res.data.org_id;
            try {
              const profileRes = await authApi.profile();
              if (profileRes.success) {
                user = normalizeSessionUser(profileRes.data);
                orgId = res.data.role === "ceo" ? (profileRes.data.organization?.id || null) : (profileRes.data.organization || null);
              }
            } catch (e) { /* login o'zi muvaffaqiyatli — profil tafsilotlari keyinroq ham yuklanadi */ }
            setSession({ role: res.data.role, user, orgId });
            setTheme(user.theme);
            setView("app");
          } else {
            setLoginError(res.message || "Login yoki parol noto'g'ri");
          }
        } catch (err) {
          setLoginError("Server bilan bog'lanib bo'lmadi. Internetni tekshiring.");
        }
        setLoginLoading(false);
      };

      const handleLogout = () => {
        authApi.logout(); // fire-and-forget: tokenlarni tozalaydi, backend'ga refresh'ni bekor qilishni so'raydi
        setSession(null);
        setLoginError("");
        if (FIXED_ROLE) {
          setLoginRole(FIXED_ROLE);
          setView("login");
        } else {
          setLoginRole(null);
          setView("landing");
        }
      };

      /* Har bir non-support session uchun "data" faqat shu sessiyaning orgId'siga
         tegishli yozuvlar bilan cheklanadi — bu action-darajasidagi tekshiruv
         ustiga qo'shimcha himoya qatlami (UI hech qachon boshqa tashkilotning
         yozuvini hatto render ham qilmaydi). Support operatsion data
         tablarini umuman ko'rmaydi (faqat Tashkilotlar). */
      const scopedData = useMemo(() => {
        if (!session || session.role === "support") return data;
        const oid = session.orgId;
        return {
          groups: data.groups.filter((g) => g.orgId === oid),
          students: data.students.filter((s) => s.orgId === oid),
          exams: data.exams.filter((e) => e.orgId === oid),
          assignments: data.assignments.filter((a) => a.orgId === oid),
          results: data.results.filter((r) => r.orgId === oid),
        };
      }, [data, session]);

      const orgStaffScoped = useMemo(() => {
        if (!session || !session.orgId) return [];
        return orgStaff.filter((s) => s.orgId === session.orgId);
      }, [orgStaff, session]);

      if (!ready) {
        return (
          <div className="min-h-screen flex items-center justify-center" style={{ backgroundColor: C.paper }}>
            {FONTS}
            <div className="flex flex-col items-center gap-3">
              <Icon name="spinner" size={26} className="fa-spin" style={{ color: C.ink }} />
              <div className="text-[13px] f-body" style={{ color: C.muted }}>Yuklanmoqda...</div>
            </div>
          </div>
        );
      }

      return (
        <ThemeContext.Provider value={{ theme, toggleTheme }}>
          <div className="f-body">
            {view === "landing" && !FIXED_ROLE && (
              <RoleLanding onSelect={(role) => { setLoginRole(role); setLoginError(""); setView("login"); }} />
            )}
            {view === "login" && (
              <LoginPage
                role={loginRole}
                onBack={() => setView("landing")}
                hideBack={!!FIXED_ROLE}
                onLogin={handleLogin}
                loading={loginLoading}
                error={loginError}
              />
            )}
            {view === "app" && session?.role === "support" && (
              <SupportApp session={session} organizations={organizations} orgStaff={orgStaff} actions={actions} onLogout={handleLogout} toast={toast} supportTickets={supportTickets} messages={messages} />
            )}
            {view === "app" && session && !["support", "student"].includes(session.role) && (
              <AdminApp
                session={session}
                data={scopedData}
                actions={actions}
                onLogout={handleLogout}
                toast={toast}
                organizations={organizations}
                orgStaff={orgStaffScoped}
                messages={messages}
                unreadMsg={unreadMsg}
              />
            )}
            {view === "app" && session?.role === "student" && (
              <StudentApp session={session} data={scopedData} actions={actions} onLogout={handleLogout} toast={toast} organizations={organizations} unreadMsg={unreadMsg} />
            )}
            <ToastHost toasts={toasts} remove={removeToast} />
          </div>
        </ThemeContext.Provider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);


  </script>
</body>

</html>
