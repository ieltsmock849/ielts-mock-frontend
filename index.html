<!DOCTYPE html>
<html lang="uz" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IELTS Compass — Mock Exam Platform</title>

  <!-- Mavzu (theme) endi foydalanuvchi hisobiga bog'liq holda backend'da
       saqlanadi (localStorage emas) — shuning uchun sahifa birinchi
       chizilganda har doim "light" bilan boshlanadi, so'ng profil
       backend'dan yuklangach kerak bo'lsa "dark"ga almashtiriladi. -->

  <!-- Tailwind (CDN, JIT — utility classes compiled in-browser) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome (icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- React 18 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <!-- Babel standalone (in-browser JSX transform) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <style>
    :root,
    [data-theme="light"] {
      --ink: #16283D;
      --ink-deep: #0E1B29;
      --ink-soft: #27405A;
      --ink-fixed: #0F1B2E;
      --paper: #F4EFE3;
      --paper-dim: #ECE6D6;
      --card: #FFFCF5;
      --border: #E3DCC8;
      --border-soft: #EDE7D8;
      --gold: #C89B3C;
      --gold-deep: #A87F2A;
      --gold-soft: #F5EBD3;
      --teal: #2F7D6B;
      --teal-deep: #215B4F;
      --teal-soft: #E7F0EC;
      --success: #2F8F6B;
      --success-soft: #E4F3EC;
      --danger: #C24A3F;
      --danger-soft: #F7E9E7;
      --text: #16283D;
      --muted: #5B6B76;
      --muted-soft: #8B99A2;
      --accent: #16283D;
      --on-accent: #FFFFFF;
      --highlight-bg: #F5E6B8;
      --highlight-text: #16283D;
      --overlay: rgba(14, 27, 41, 0.55);
      color-scheme: light;
    }

    [data-theme="dark"] {
      --ink: #F3E9D8;
      --ink-deep: #05070C;
      --ink-soft: #1B2333;
      --ink-fixed: #05070C;
      --paper: #0A0D14;
      --paper-dim: #0F1420;
      --card: #12161F;
      --border: #232A38;
      --border-soft: #1B212C;
      --gold: #E8933C;
      --gold-deep: #F2A94F;
      --gold-soft: #2B1D0F;
      --teal: #E8933C;
      --teal-deep: #F2A94F;
      --teal-soft: #2B1D0F;
      --success: #4FA97A;
      --success-soft: #12251C;
      --danger: #E2685C;
      --danger-soft: #2B1512;
      --text: #F3E9D8;
      --muted: #9AA2AF;
      --muted-soft: #656D7A;
      --accent: #E8933C;
      --on-accent: #14100A;
      --highlight-bg: #4A3116;
      --highlight-text: #FFDDA8;

    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--paper);
    }

    body {
      transition: background-color .25s ease;
    }

    #root {
      min-height: 100vh;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <!--
  Role kirish linklari (bitta fayl, query-param orqali):
    ?role=ceo      -> CEO login
    ?role=support  -> Support login
    (param yo'q yoki boshqa qiymat) -> Student login (default)
-->
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useCallback, useRef, useContext } = React;

    /* ============================================================
       DESIGN TOKENS — "IELTS Compass"
       Ink navy + paper grey, gold band-score accent, teal secondary.
       Signature element: the semicircular "Band Dial" gauge.

       DARK MODE: deep navy-black (never pure #000) + single orange
       accent (var(--gold) / var(--accent)) reserved for icons, active
       states, buttons and highlights — never mixed as background fills.
       ============================================================ */
    const C = {
      ink: "var(--ink)",
      inkDeep: "var(--ink-deep)",
      inkSoft: "var(--ink-soft)",
      inkFixed: "var(--ink-fixed)",
      paper: "var(--paper)",
      paperDim: "var(--paper-dim)",
      card: "var(--card)",
      border: "var(--border)",
      borderSoft: "var(--border-soft)",
      gold: "var(--gold)",
      goldDeep: "var(--gold-deep)",
      goldSoft: "var(--gold-soft)",
      teal: "var(--teal)",
      tealDeep: "var(--teal-deep)",
      tealSoft: "var(--teal-soft)",
      success: "var(--success)",
      successSoft: "var(--success-soft)",
      danger: "var(--danger)",
      dangerSoft: "var(--danger-soft)",
      text: "var(--text)",
      muted: "var(--muted)",
      mutedSoft: "var(--muted-soft)",
      accent: "var(--accent)",
      onAccent: "var(--on-accent)",
      highlightBg: "var(--highlight-bg)",
      highlightText: "var(--highlight-text)",
      overlay: "var(--overlay)",
    };

    const FONTS = (
      <style>{`
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
    .f-display { font-family: 'Fraunces', serif; }
    .f-body { font-family: 'Inter', sans-serif; }
    .f-mono { font-family: 'IBM Plex Mono', monospace; }
    ::selection { background: color-mix(in srgb, var(--gold) 35%, transparent); }
    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  `}</style>
    );

    /* ============================================================
       THEME CONTEXT — light / dark toggle
       ============================================================ */
    /* Theme endi localStorage'da emas, backend'dagi foydalanuvchi profilida
       ("theme" maydoni) saqlanadi — pastga qarang: preferencesApi. */
    const ThemeContext = React.createContext({ theme: "light", toggleTheme: () => { } });

    function ThemeToggle({ size = "md", floating = false }) {
      const { theme, toggleTheme } = useContext(ThemeContext);
      const dark = theme === "dark";
      const dims = size === "sm" ? 32 : 36;
      return (
        <button
          onClick={toggleTheme}
          aria-label={dark ? "Light mode ga o'tish" : "Dark mode ga o'tish"}
          title={dark ? "Light mode" : "Dark mode"}
          className={`inline-flex items-center justify-center rounded-full transition-all shrink-0 ${floating ? "shadow-lg" : ""}`}
          style={{
            width: dims, height: dims,
            backgroundColor: dark ? C.paperDim : C.card,
            border: `1px solid ${C.border}`,
            color: dark ? C.gold : C.ink,
          }}
        >
          <Icon name={dark ? "sun" : "moon"} size={15} />
        </button>
      );
    }

    /* ============================================================
       ICON HELPER (Font Awesome free solid set, loaded via CDN)
       ============================================================ */
    function Icon({ name, size = 16, style = {}, className = "", color }) {
      return (
        <i
          className={`fa-solid fa-${name} ${className}`}
          style={{ fontSize: size, lineHeight: 1, width: size, textAlign: "center", color: color || style.color, ...style }}
        />
      );
    }

    function uid(prefix = "id") {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
    }
    /* Guruh (group) uchun unikal ID: 3 ta harf + "-" + 4 ta raqam (masalan: FDK-2343).
       Nomi takrorlansa ham ID hech qachon takrorlanmaydi — mavjud guruhlar ro'yxatiga
       qarshi tekshirib, band bo'lmagan kod topilguncha qayta generatsiya qilinadi. */
    function genGroupId(existingGroups = []) {
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const taken = new Set(existingGroups.map((g) => g.id));
      let code;
      do {
        const l1 = letters[Math.floor(Math.random() * letters.length)];
        const l2 = letters[Math.floor(Math.random() * letters.length)];
        const l3 = letters[Math.floor(Math.random() * letters.length)];
        const digits = String(Math.floor(1000 + Math.random() * 9000));
        code = `${l1}${l2}${l3}-${digits}`;
      } while (taken.has(code));
      return code;
    }
    function randomPassword6() {
      return String(Math.floor(100000 + Math.random() * 900000));
    }
    function usernameFromName(name, existing) {
      const base = name.trim().toLowerCase().replace(/[^a-z0-9]+/g, ".").replace(/^\.|\.$/g, "") || "student";
      let candidate = base;
      let n = 1;
      const taken = new Set(existing.map((s) => s.username));
      while (taken.has(candidate)) {
        n += 1;
        candidate = `${base}${n}`;
      }
      return candidate;
    }
    function pctToBand(pct) {
      if (pct == null || isNaN(pct)) return null;
      const raw = (pct / 100) * 9;
      return Math.max(0, Math.min(9, Math.round(raw * 2) / 2));
    }

    /* ============================================================
       RASMIY IELTS BAND KONVERSIYA JADVALLARI (40 ta savol asosida)
       Har bir juftlik [shu ballga YETISH UCHUN kerakli MINIMAL raw score, band].
       Jadval yuqoridan pastga tekshiriladi — o'quvchining (40 ballga nisbatan
       masshtablangan) raw score'i qaysi chegaradan yuqori/teng bo'lsa, o'sha band beriladi.
       Reading uchun Academic va General Training jadvallari boshqacha (GT'da bir xil
       band olish uchun ko'proq to'g'ri javob kerak) — bu haqiqiy IELTS konversiyasiga mos.
       ============================================================ */
    const LISTENING_BAND_TABLE = [
      [39, 9], [37, 8.5], [35, 8], [32, 7.5], [30, 7], [26, 6.5], [23, 6],
      [18, 5.5], [16, 5], [13, 4.5], [10, 4], [8, 3.5], [6, 3], [4, 2.5],
    ];
    const READING_ACADEMIC_BAND_TABLE = [
      [39, 9], [37, 8.5], [35, 8], [33, 7.5], [30, 7], [27, 6.5], [23, 6],
      [19, 5.5], [15, 5], [13, 4.5], [10, 4], [8, 3.5], [6, 3],
    ];
    const READING_GT_BAND_TABLE = [
      [40, 9], [39, 8.5], [37, 8], [36, 7.5], [34, 7], [32, 6.5], [30, 6],
      [27, 5.5], [23, 5], [19, 4.5], [15, 4], [12, 3.5], [9, 3],
    ];
    /* correct/total'ni 40 ballik shkalaga proportsional o'tkazib, rasmiy jadvaldan bandni topadi. */
    function rawToBandFromTable(correct, total, table) {
      if (total == null || total <= 0 || correct == null) return null;
      const scaled = (correct / total) * 40;
      for (const [minRaw, band] of table) {
        if (scaled >= minRaw) return band;
      }
      return 0;
    }
    function readingBandTable(examType) {
      return examType === "general" ? READING_GT_BAND_TABLE : READING_ACADEMIC_BAND_TABLE;
    }
    /* Writing mezonlari (Task Achievement/Response, Coherence & Cohesion, Lexical Resource,
       Grammatical Range & Accuracy) o'rtachasidan bitta task uchun bandni hisoblaydi. */
    function criteriaToBand(criteria) {
      const vals = Object.values(criteria || {}).map(Number).filter((v) => !isNaN(v));
      if (!vals.length) return null;
      const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
      return Math.max(0, Math.min(9, Math.round(avg * 2) / 2));
    }
    /* Rasmiy IELTS Writing overall band og'irligi: Task 1 x1, Task 2 x2 (Task 2 muhimroq). */
    function writingOverallBand(task1Band, task2Band) {
      if (task1Band == null && task2Band == null) return null;
      const t1 = task1Band ?? task2Band;
      const t2 = task2Band ?? task1Band;
      return Math.round(((t1 * 1 + t2 * 2) / 3) * 2) / 2;
    }
    function fmtDate(d) {
      try {
        return new Date(d).toLocaleDateString("uz-UZ", { day: "2-digit", month: "short", year: "numeric" });
      } catch {
        return "";
      }
    }
    /* Sana + soat:daqiqa — texnik xizmat murojaatlari (support tickets) uchun,
       bildirishnomada foydalanuvchi qachon yozganini aniq ko'rsatish uchun. */
    function fmtDateTime(d) {
      try {
        return new Date(d).toLocaleString("uz-UZ", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
      } catch {
        return "";
      }
    }

    /* ============================================================
       TELEGRAM BOT — Writing ishini CEO'ga yuborish
       ------------------------------------------------------------
       ESLATMA: Bu funksiya endi ishlatilmaydi. Avval bot tokeni shu
       yerda, frontend kodida ochiq saqlangan edi — bu xavfsiz emas edi
       (har kim sahifa manbasidan tokenni ko'rib, botni suiiste'mol
       qilishi mumkin edi). Xabar yuborish endi backend'da
       (apps/notifications/telegram.py) — o'quvchi natijani API orqali
       yuborganda avtomatik ishga tushadi. Token faqat Railway'ning
       server-side environment variable'ida saqlanadi.
       ============================================================ */
    async function sendTelegramMessage(chatId, text) {
      // No-op: xabar yuborish backend orqali amalga oshiriladi.
      console.warn("sendTelegramMessage: endi backend orqali yuboriladi, frontend'dan chaqirish shart emas.");
    }

    /* ============================================================
       API CLIENT — Django backend (Railway) bilan aloqa
       ------------------------------------------------------------
       Barcha backend so'rovlari shu markazlashgan client orqali
       o'tadi: JWT tokenlarni saqlaydi, har bir so'rovga Authorization
       header qo'shadi, 401 kelsa avtomatik refresh qiladi.
       ============================================================ */
    const API_BASE_URL = "https://ielts-mock-backend-production.up.railway.app";

    const TOKEN_KEYS = { access: "ielts_access_token", refresh: "ielts_refresh_token" };

    const tokenStore = {
      getAccess: () => localStorage.getItem(TOKEN_KEYS.access),
      getRefresh: () => localStorage.getItem(TOKEN_KEYS.refresh),
      set: (access, refresh) => {
        localStorage.setItem(TOKEN_KEYS.access, access);
        if (refresh) localStorage.setItem(TOKEN_KEYS.refresh, refresh);
      },
      clear: () => {
        localStorage.removeItem(TOKEN_KEYS.access);
        localStorage.removeItem(TOKEN_KEYS.refresh);
      },
    };

    async function refreshAccessToken() {
      const refresh = tokenStore.getRefresh();
      if (!refresh) throw new Error("No refresh token");
      const res = await fetch(`${API_BASE_URL}/api/auth/refresh/`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ refresh }),
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok || !json.success) throw new Error("Refresh failed");
      tokenStore.set(json.data.access, null);
      return json.data.access;
    }

    /**
     * apiFetch(path, options) — barcha API so'rovlari shu orqali.
     * path masalan: "/api/auth/profile/" (API_BASE_URL avtomatik qo'shiladi)
     * 401 kelsa: bir marta refresh urinib ko'radi, muvaffaqiyatli bo'lsa
     * so'rovni qaytadan yuboradi; bo'lmasa tokenlarni tozalab xato tashlaydi.
     */
    async function apiFetch(path, options = {}, _isRetry = false) {
      const access = tokenStore.getAccess();
      const headers = { ...(options.headers || {}) };
      const isFormData = options.body instanceof FormData;
      if (!isFormData) headers["Content-Type"] = "application/json";
      if (access) headers["Authorization"] = `Bearer ${access}`;

      const res = await fetch(`${API_BASE_URL}${path}`, { ...options, headers });

      if (res.status === 401 && !_isRetry && tokenStore.getRefresh()) {
        try {
          await refreshAccessToken();
          return apiFetch(path, options, true);
        } catch (e) {
          tokenStore.clear();
          throw new Error("SESSION_EXPIRED");
        }
      }

      let json = null;
      try { json = await res.json(); } catch (e) { /* body bo'sh bo'lishi mumkin */ }

      if (!res.ok) {
        const msg = (json && (json.message || JSON.stringify(json.errors))) || `Server xatosi (${res.status})`;
        throw new Error(msg);
      }
      return json;
    }

    const authApi = {
      login: async (username, password, role) => {
        const res = await fetch(`${API_BASE_URL}/api/auth/login/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password, role }),
        });
        const json = await res.json().catch(() => ({}));
        if (res.ok && json.success) {
          tokenStore.set(json.data.access, json.data.refresh);
        }
        return json;
      },
      logout: async () => {
        const refresh = tokenStore.getRefresh();
        tokenStore.clear();
        if (!refresh) return;
        try {
          await apiFetch("/api/auth/logout/", { method: "POST", body: JSON.stringify({ refresh }) });
        } catch (e) { /* logout xatosi kritik emas — tokenlar allaqachon tozalandi */ }
      },
      profile: () => apiFetch("/api/auth/profile/"),
      updateProfile: (patch) => apiFetch("/api/auth/profile/", { method: "PUT", body: JSON.stringify(patch) }),
      changePassword: (currentPassword, newPassword) => apiFetch("/api/auth/change-password/", {
        method: "POST",
        body: JSON.stringify({ current_password: currentPassword, new_password: newPassword }),
      }),
    };

    /* ============================================================
       PREFERENCES API — theme va sidebar holati (avval localStorage'da
       edi) endi shu orqali to'g'ridan-to'g'ri foydalanuvchi profiliga
       (backend/Postgres) saqlanadi.
       ============================================================ */
    const preferencesApi = {
      update: (patch) => authApi.updateProfile(patch),
    };

    /* ============================================================
       ORG API — Tashkilotlar (CEO'lar) endi to'g'ridan-to'g'ri backend
       (Postgres) orqali boshqariladi, localStorage orqali emas. Backend
       snake_case (org_name, ceo_name, telegram_chat_id) ishlatadi,
       frontend esa camelCase (orgName, ceoName, telegramChatId) —
       shu ikkovi orasida shu yerda moslashtiramiz.
       ============================================================ */
    function orgFromApi(o) {
      return {
        id: o.id,
        orgName: o.org_name,
        ceoName: o.ceo_name,
        phone: o.phone || "",
        email: o.email || "",
        username: o.username,
        password: o.password || "",
        telegramChatId: o.telegram_chat_id || "",
        status: o.status,
        createdAt: o.created_at,
      };
    }
    function orgToApi(o) {
      const body = {
        org_name: o.orgName,
        ceo_name: o.ceoName,
        phone: o.phone || "",
        email: o.email || "",
        username: o.username,
        telegram_chat_id: o.telegramChatId || "",
        status: o.status || "active",
      };
      if (o.password) body.password = o.password;
      return body;
    }
    /* Qisman (partial) PATCH uchun — faqat "patch" obyektida haqiqatan ham
       berilgan maydonlar yuboriladi, aks holda (masalan CEO faqat ism/telefon
       o'zgartirganda) email/telegram/status kabi boshqa maydonlar bo'sh
       qiymat bilan tasodifan ustidan yozilib qolar edi. */
    function orgPatchToApi(patch) {
      const body = {};
      if (patch.orgName !== undefined) body.org_name = patch.orgName;
      if (patch.ceoName !== undefined) body.ceo_name = patch.ceoName;
      if (patch.phone !== undefined) body.phone = patch.phone;
      if (patch.email !== undefined) body.email = patch.email;
      if (patch.username !== undefined) body.username = patch.username;
      if (patch.telegramChatId !== undefined) body.telegram_chat_id = patch.telegramChatId;
      if (patch.status !== undefined) body.status = patch.status;
      if (patch.password) body.password = patch.password;
      return body;
    }
    const orgApi = {
      list: async () => {
        const json = await apiFetch("/api/organizations/");
        const results = Array.isArray(json) ? json : (json.results || []);
        return results.map(orgFromApi);
      },
      create: async (org) => {
        const json = await apiFetch("/api/organizations/", { method: "POST", body: JSON.stringify(orgToApi(org)) });
        return orgFromApi(json);
      },
      update: async (id, patch) => {
        const json = await apiFetch(`/api/organizations/${id}/`, { method: "PATCH", body: JSON.stringify(orgPatchToApi(patch)) });
        return orgFromApi(json);
      },
      setStatus: async (id, status) => {
        await apiFetch(`/api/organizations/${id}/status/`, { method: "PATCH", body: JSON.stringify({ status }) });
      },
      remove: async (id) => {
        await apiFetch(`/api/organizations/${id}/`, { method: "DELETE" });
      },
    };
        /* ============================================================
       GROUPS API — guruhlar endi backendga (Postgres) saqlanadi.
       ============================================================ */
    function groupFromApi(g) {
      return { id: g.id, name: g.name, level: g.level, createdAt: g.created_at, orgId: g.organization };
    }
    const groupApi = {
      list: async () => {
        const json = await apiFetch("/api/groups/");
        const results = Array.isArray(json) ? json : (json.results || []);
        return results.map(groupFromApi);
      },
      create: async (g) => {
        const json = await apiFetch("/api/groups/", { method: "POST", body: JSON.stringify({ id: g.id, name: g.name, level: g.level }) });
        return groupFromApi(json);
      },
      update: async (id, patch) => {
        const body = {};
        if (patch.name !== undefined) body.name = patch.name;
        if (patch.level !== undefined) body.level = patch.level;
        const json = await apiFetch(`/api/groups/${id}/`, { method: "PATCH", body: JSON.stringify(body) });
        return groupFromApi(json);
      },
      remove: async (id) => {
        await apiFetch(`/api/groups/${id}/`, { method: "DELETE" });
      },
    };
        /* ============================================================
       SUPPORT TICKETS API — "Texnik xizmat" murojaatlari endi
       to'g'ridan-to'g'ri backendga (Postgres) saqlanadi, localStorage
       orqali emas — shu bilan Support qaysi brauzer/qurilmadan kirsa
       ham barcha murojaatlarni ko'radi.
       ============================================================ */
    function ticketFromApi(t) {
      return {
        id: t.id,
        message: t.message,
        userId: t.user,
        userName: t.user_name,
        userRole: t.user_role,
        orgId: t.organization,
        orgName: t.org_name,
        createdAt: t.created_at,
        seen: t.seen,
      };
    }
    const ticketApi = {
      list: async () => {
        const json = await apiFetch("/api/support-tickets/");
        const results = Array.isArray(json) ? json : (json.results || []);
        return results.map(ticketFromApi);
      },
      create: async (message) => {
        const json = await apiFetch("/api/support-tickets/", { method: "POST", body: JSON.stringify({ message }) });
        return ticketFromApi(json);
      },
      markSeen: async (id) => {
        return apiFetch(`/api/support-tickets/${id}/mark_seen/`, { method: "PUT" });
      },
    };

    /* ============================================================
       MESSAGES API — Support <-> CEO va CEO -> Employee/Student ichki
       xabar tizimi. Backend har bir qabul qiluvchi uchun alohida yozuv

    /* Telegramning 4096 belgi chegarasiga mos, uzun matnni bo'laklarga bo'lib beradi. */
    function splitForTelegram(text, limit = 3500) {
      const parts = [];
      let rest = text;
      while (rest.length > limit) {
        let cut = rest.lastIndexOf("\n", limit);
        if (cut <= 0) cut = limit;
        parts.push(rest.slice(0, cut));
        rest = rest.slice(cut);
      }
      if (rest) parts.push(rest);
      return parts;
    }

    function escapeTelegramHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    /* Writing ishini (Task 1 + Task 2) CEO'ning Telegram Chat ID'siga yuboradi. */
    async function sendWritingToCeo({ org, student, exam, result }) {
      const chatId = org?.telegramChatId;
      if (!chatId) return; // Bu CEO'da Telegram Chat ID kiritilmagan bo'lsa, jim o'tkazib yuboriladi.

      const writing = normalizeWriting(exam?.sections?.writing);
      const countWords = (t) => (t || "").trim().split(/\s+/).filter(Boolean).length;
      const wc1 = countWords(result.writingText?.task1);
      const wc2 = countWords(result.writingText?.task2);

      const header =
        `✍️ <b>Yangi Writing ishi</b>\n` +
        `👤 O'quvchi: <b>${escapeTelegramHtml(student?.name)}</b>\n` +
        `📝 Mock exam: <b>${escapeTelegramHtml(exam?.title || result.examTitle || "")}</b>\n` +
        `🕒 Topshirildi: ${fmtDate(result.submittedAt)}`;

      const task1Msg =
        `<b>📄 Task 1</b>  (${wc1} / ${writing.task1.minWords} so'z)\n\n` +
        escapeTelegramHtml(result.writingText?.task1 || "— yozilmagan —");

      const task2Msg =
        `<b>📄 Task 2</b>  (${wc2} / ${writing.task2.minWords} so'z)\n\n` +
        escapeTelegramHtml(result.writingText?.task2 || "— yozilmagan —");

      /* Barchasi bitta xabarga — header, Task 1, Task 2 ketma-ket, orasida bo'shliq bilan. */
      const fullMsg = [header, task1Msg, task2Msg].join("\n\n" + "─".repeat(20) + "\n\n");

      /* Faqat Telegramning 4096 belgi chegarasidan oshib ketsa bo'linadi. */
      for (const chunk of splitForTelegram(fullMsg)) await sendTelegramMessage(chatId, chunk);
    }

    /* ============================================================
       TELEGRAM BOT — "Texnik xizmat" murojaatlari (support tickets)
       ------------------------------------------------------------
       Foydalanuvchi (support'dan boshqa istalgan rol) footerdagi
       "Texnik xizmat" tugmasi orqali muammo yozib yuborganda, xabar
       Support profilida kiritilgan Telegram Chat ID'ga yuboriladi.
       Agar Support hali Chat ID kiritmagan bo'lsa — jim o'tkazib
       yuboriladi (bildirishnoma baribir CRM panelida ko'rinaveradi).
       ============================================================ */
    async function sendSupportTicketToTelegram(chatId, ticket) {
      if (!chatId) return;
      const text =
        `🆘 <b>Yangi texnik murojaat</b>\n` +
        `👤 Foydalanuvchi: <b>${escapeTelegramHtml(ticket.userName)}</b> (${escapeTelegramHtml(ROLE_LABELS[ticket.userRole] || ticket.userRole)})\n` +
        (ticket.orgName ? `🏢 Tashkilot: ${escapeTelegramHtml(ticket.orgName)}\n` : "") +
        `🕒 Vaqt: ${fmtDateTime(ticket.createdAt)}\n\n` +
        `📝 Muammo:\n${escapeTelegramHtml(ticket.message)}`;
      for (const chunk of splitForTelegram(text)) await sendTelegramMessage(chatId, chunk);
    }

    /* ============================================================
       ROLLAR / YORLIQLAR
       ============================================================ */
    /* YANGI HIYERARXIYA (3 ta asosiy rol): SUPPORT → CEO → ADMIN.
       "Manager" va "Teacher" rollari BUTUNLAY OLIB TASHLANDI — backendda
       mavjud shunday yozuvlar migratsiya orqali "admin"ga o'tkazildi.
       Xodim (CEO ostidagi tashkilot a'zosi) — endi FAQAT "Admin" bo'ladi.
       "Support" esa employee YARATISH oynalarida UMUMAN chiqmaydi — u
       alohida, global, hech kim tomonidan yaratib/tahrirlab/o'chirib
       bo'lmaydigan rol (backendda ham himoyalangan). */
    const STAFF_ROLES = [
      { value: "admin", label: "Admin" },
    ];
    const ROLE_LABELS = {
      support: "Support",
      ceo: "CEO — Bosh direktor",
      admin: "Admin",
      student: "O'quvchi",
    };
    /* YANGILANDI (qaytarildi): "Xodimlar" bo'limi Admin uchun butunlay olib
       tashlandi — xodimlarni ko'rish/tahrirlash/o'chirish/yaratish FAQAT CEO
       (o'z tashkilotiga) va Support (istalgan tashkilotga) uchun. */
    function canManageStaff(role) {
      return role === "ceo" || role === "support";
    }
    /* Yangi xodim YARATISH huquqi — hozircha canManageStaff bilan bir xil. */
    function canCreateStaff(role) {
      return role === "ceo" || role === "support";
    }
    /* Tashkilot PROFILINI (nom/email/Telegram Chat ID) tahrirlash huquqi —
       CEO va Admin, ikkalasi ham (mavjud funksionallik, o'zgarmadi). */
    function canEditOrgProfile(role) {
      return role === "ceo" || role === "admin";
    }
    function genId(prefix) {
      return uid(prefix);
    }

    /* ============================================================
       SMALL UI PRIMITIVES
       ============================================================ */
    function Button({ children, onClick, variant = "primary", size = "md", icon, disabled, loading, type = "button", className = "" }) {
      const sizes = { sm: "px-3 py-1.5 text-[13px]", md: "px-4 py-2.5 text-[14px]", lg: "px-5 py-3 text-[15px]" };
      const base = "inline-flex items-center justify-center gap-2 rounded-lg font-semibold transition-all duration-150 disabled:opacity-50 disabled:cursor-not-allowed active:scale-[0.98] whitespace-nowrap";
      const variants = {
        primary: { backgroundColor: C.accent, color: C.onAccent },
        gold: { backgroundColor: C.gold, color: C.inkDeep },
        teal: { backgroundColor: C.teal, color: "#fff" },
        danger: { backgroundColor: C.danger, color: "#fff" },
        ghost: { backgroundColor: "transparent", color: C.ink, border: `1px solid ${C.border}` },
        subtle: { backgroundColor: C.paperDim, color: C.ink },
      };
      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled || loading}
          style={variants[variant]}
          className={`${base} ${sizes[size]} ${className}`}
        >
          {loading ? <Icon name="spinner" size={15} className="fa-spin" /> : icon ? <Icon name={icon} size={15} /> : null}
          {children}
        </button>
      );
    }

    function Card({ children, className = "", style = {}, padded = true }) {
      return (
        <div
          className={`rounded-2xl ${padded ? "p-5" : ""} ${className}`}
          style={{ backgroundColor: C.card, border: `1px solid ${C.border}`, ...style }}
        >
          {children}
        </div>
      );
    }

    function Badge({ children, tone = "muted" }) {
      const tones = {
        muted: { bg: C.paperDim, fg: C.muted },
        teal: { bg: C.tealSoft, fg: C.tealDeep },
        gold: { bg: C.goldSoft, fg: C.goldDeep },
        danger: { bg: C.dangerSoft, fg: C.danger },
        success: { bg: C.successSoft, fg: C.success },
      };
      const t = tones[tone];
      return (
        <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[12px] font-semibold" style={{ backgroundColor: t.bg, color: t.fg }}>
          {children}
        </span>
      );
    }

    function Input({ label, value, onChange, placeholder, type = "text", icon, hint, required }) {
      return (
        <label className="block">
          {label && <div className="text-[13px] font-semibold mb-1.5" style={{ color: C.text }}>{label}{required && <span style={{ color: C.danger }}> *</span>}</div>}
          <div className="relative">
            {icon && <Icon name={icon} size={16} style={{ color: C.mutedSoft }} className="absolute left-3 top-1/2 -translate-y-1/2" />}
            <input
              type={type}
              value={value}
              onChange={(e) => onChange(e.target.value)}
              placeholder={placeholder}
              className="w-full rounded-lg text-[14px] f-body outline-none transition-all"
              style={{
                padding: icon ? "10px 12px 10px 36px" : "10px 12px",
                border: `1.5px solid ${C.border}`,
                backgroundColor: C.paper,
                color: C.text,
              }}
              onFocus={(e) => (e.target.style.borderColor = C.teal)}
              onBlur={(e) => (e.target.style.borderColor = C.border)}
            />
          </div>
          {hint && <div className="text-[12px] mt-1" style={{ color: C.mutedSoft }}>{hint}</div>}
        </label>
      );
    }

    function TextArea({ label, value, onChange, placeholder, rows = 4, hint }) {

        function ActionMenu({ items }) {
      const [open, setOpen] = useState(false);
      const [coords, setCoords] = useState({ top: 0, left: 0 });
      const btnRef = useRef(null);
      const menuRef = useRef(null);

      const updatePosition = () => {
        if (!btnRef.current) return;
        const rect = btnRef.current.getBoundingClientRect();
        const menuWidth = 180;
        let left = rect.right - menuWidth;
        if (left < 4) left = 4;
        if (left + menuWidth > window.innerWidth - 4) left = window.innerWidth - menuWidth - 4;
        let top = rect.bottom + 4;
        setCoords({ top, left });
      };

      useEffect(() => {
        if (!open) return;
        updatePosition();
        const onDocClick = (e) => {
          if (
            (btnRef.current && btnRef.current.contains(e.target)) ||
            (menuRef.current && menuRef.current.contains(e.target))
          ) return;
          setOpen(false);
        };
        document.addEventListener("mousedown", onDocClick);
        window.addEventListener("scroll", updatePosition, true);
        window.addEventListener("resize", updatePosition);
        return () => {
          document.removeEventListener("mousedown", onDocClick);
          window.removeEventListener("scroll", updatePosition, true);
          window.removeEventListener("resize", updatePosition);
        };
      }, [open]);

      return (
        <div className="relative shrink-0">
          <button
            ref={btnRef}
            onClick={(e) => { e.stopPropagation(); setOpen((o) => !o); }}
            title="Amallar"
            className="p-2 rounded-lg hover:bg-black/5"
          >
            <Icon name="ellipsis-vertical" size={15} style={{ color: C.mutedSoft }} />
          </button>
          {open && ReactDOM.createPortal(
            <div
              ref={menuRef}
              className="fixed rounded-lg overflow-hidden shadow-lg py-1 whitespace-nowrap"
              style={{ backgroundColor: C.card, border: `1px solid ${C.border}`, minWidth: 180, top: coords.top, left: coords.left, zIndex: 9999 }}
            >
              {items.map((it, i) => (
                <button
                  key={i}
                  onClick={(e) => { e.stopPropagation(); setOpen(false); it.onClick(); }}
                  className="w-full flex items-center gap-2.5 px-3.5 py-2.5 text-[13px] font-medium text-left hover:bg-black/5 transition-colors"
                  style={{ color: it.danger ? C.danger : C.text }}
                >
                  <Icon name={it.icon} size={13} style={{ color: it.danger ? C.danger : C.mutedSoft }} />
                  {it.label}
                </button>
              ))}
            </div>,
            document.body
          )}
        </div>
      );
    }

    function CopyField({ label, value, trailing }) {
      const [copied, setCopied] = useState(false);
      const doCopy = async () => {
        try {
          await navigator.clipboard.writeText(value);
        } catch (e) {
          try {
            const ta = document.createElement("textarea");
            ta.value = value;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
          } catch (err) { }
        }
        setCopied(true);
        setTimeout(() => setCopied(false), 1200);
      };
      return (
        <div className="flex justify-between items-center text-[13.5px] gap-2">
          <span style={{ color: C.muted }}>{label}</span>
          <div className="flex items-center gap-1.5">
            <button
              type="button"
              onClick={doCopy}
              title="Nusxalash uchun bosing"
              className="f-mono font-semibold flex items-center gap-1.5 hover:opacity-70 transition-opacity"
              style={{ color: copied ? C.teal : C.ink }}
            >
              {copied ? "Nusxalandi" : value}
              <Icon name={copied ? "check" : "copy"} size={12} style={{ color: copied ? C.teal : C.mutedSoft }} />
            </button>
            {trailing}
          </div>
        </div>
      );
    }

    /* Signature element: semicircular Band Dial gauge, 0–9 IELTS scale */
    function BandDial({ value, size = 120, label = "Band" }) {
      const v = value == null ? 0 : value;
      const pct = Math.max(0, Math.min(1, v / 9));
      const angle = 180 * pct;
      const r = size / 2 - 10;
      const cx = size / 2, cy = size / 2;
      const toXY = (deg) => {
        const rad = (Math.PI * (180 - deg)) / 180;
        return [cx + r * Math.cos(rad), cy - r * Math.sin(rad)];
      };
      const [nx, ny] = toXY(angle);
      const arc = (startDeg, endDeg, color, width) => {
        const [x1, y1] = toXY(startDeg);
        const [x2, y2] = toXY(endDeg);
        const large = endDeg - startDeg > 180 ? 1 : 0;
        return <path d={`M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`} style={{ stroke: color }} strokeWidth={width} fill="none" strokeLinecap="round" />;
      };
      return (
        <div className="flex flex-col items-center">
          <svg width={size} height={size / 2 + 22} viewBox={`0 0 ${size} ${size / 2 + 22}`}>
            {arc(0, 180, C.borderSoft, 10)}
            {arc(0, angle, C.gold, 10)}
            <circle cx={nx} cy={ny} r={5} style={{ fill: C.ink }} />
            <text x={cx} y={size / 2 + 4} textAnchor="middle" className="f-mono" fontSize={size * 0.22} fontWeight="600" style={{ fill: C.ink }}>
              {v ? v.toFixed(1) : "—"}
            </text>
          </svg>
          <div className="text-[11px] font-semibold tracking-wide uppercase mt-1" style={{ color: C.mutedSoft }}>{label}</div>
        </div>
      );
    }

    function StatCard({ icon, label, value, tone = "ink", sub }) {

                boxShadow: "0 10px 18px -8px rgba(14,27,41,0.45)",

    function Top3Podium({ students, results, groups }) {
      const ranked = useMemo(() => {
        const byStudent = {};
        results.forEach((r) => {
          if (r.overallBand == null) return;
          byStudent[r.studentId] = byStudent[r.studentId] || [];
          byStudent[r.studentId].push(r.overallBand);
        });
        return students
          .map((s) => {
            const scores = byStudent[s.id] || [];
            if (!scores.length) return null;
            const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
            const grp = groups.find((g) => g.id === s.groupId);
            return { ...s, avg, attempts: scores.length, groupName: grp?.name || "—" };
          })
          .filter(Boolean)
          .sort((a, b) => b.avg - a.avg)
          .slice(0, 3);
      }, [students, results, groups]);

      if (!ranked.length) {
        return <EmptyState icon="trophy" title="Hali reyting yo'q" sub="Studentlar mock exam topshirganda TOP-3 shu yerda paydo bo'ladi" />;
      }

      const first = ranked[0], second = ranked[1] || null, third = ranked[2] || null;

      return (
        <div>
          <style>{`
        @keyframes podiumRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      `}</style>
          <div className="flex items-end justify-center gap-3 md:gap-5 pt-2 pb-1 overflow-x-auto">
            <PodiumStep rank={2} student={second} groupName={second?.groupName} height={64} delay={80} />
            <PodiumStep rank={1} student={first} groupName={first?.groupName} height={92} delay={0} />
            <PodiumStep rank={3} student={third} groupName={third?.groupName} height={44} delay={160} />
          </div>
        </div>
      );
    }

      const MAX_SLOTS = 5;
      const needsMore = allItems.length > MAX_SLOTS;
      const mainItems = needsMore ? allItems.slice(0, MAX_SLOTS - 1) : allItems;
      const moreItems = needsMore ? allItems.slice(MAX_SLOTS - 1) : [];
      const moreIsActive = moreItems.some((t) => t.key === active);

      const handlePick = (item) => {
        setMoreOpen(false);
        if (item.key === "__support") onSupportClick();
        else onChange(item.key);

      const renderItem = (t, keyPrefix = "") => {
        const isActive = active === t.key;
        const isSupport = t.key === "__support";
        return (
          <button
            key={keyPrefix + t.key}
            onClick={() => (isSupport ? onSupportClick() : onChange(t.key))}
            className="flex-1 flex flex-col items-center justify-center gap-1 py-2.5 min-w-0"
            style={{ color: isActive ? C.gold : "rgba(255,255,255,0.55)" }}
          >
            <span className="relative">

              {t.key === notifTabKey && notifCount > 0 && (

            <span className="text-[10px] font-medium leading-none truncate max-w-full px-0.5">{t.label}</span>
          </button>
        );
      };

      return (
        <>
          {/* Orqa fon (backdrop) — "Ko'proq" varaqchasi ochiq bo'lganda, tashqarisiga
              bosilsa yopiladi. */}

            <div
              className="md:hidden fixed inset-0 z-40"
              style={{ backgroundColor: "rgba(0,0,0,0.45)" }}
              onClick={() => setMoreOpen(false)}
            />
          )}
          <div className="md:hidden fixed bottom-0 left-0 right-0 z-40 flex flex-col">
            {needsMore && moreOpen && (
              <div
                className="overflow-hidden"
                style={{ backgroundColor: C.inkFixed, borderTop: "1px solid rgba(255,255,255,0.08)" }}
              >
                {moreItems.map((t) => {
                  const isActive = active === t.key;
                  return (
                    <button
                      key={t.key}
                      onClick={() => handlePick(t)}
                      className="w-full flex items-center gap-3 px-5 py-3 text-[13.5px] font-medium"
                      style={{ color: isActive ? C.gold : "rgba(255,255,255,0.75)" }}
                    >
                      <span className="relative shrink-0">
                        <Icon name={t.icon} size={16} />
                        {t.key === notifTabKey && notifCount > 0 && (
                          <span className="absolute -top-1.5 -right-1.5 w-3.5 h-3.5 rounded-full" style={{ backgroundColor: C.gold }} />
                        )}
                      </span>
                      <span className="flex-1 text-left">{t.label}</span>
                      {t.key === notifTabKey && notifCount > 0 && (
                        <span className="text-[10.5px] font-bold rounded-full w-5 h-5 flex items-center justify-center shrink-0" style={{ backgroundColor: C.gold, color: C.inkDeep }}>
                          {notifCount}
                        </span>
                      )}
                    </button>
                  );
                })}
              </div>
            )}
            <div
              className="flex items-stretch"
              style={{ backgroundColor: C.inkFixed, borderTop: "1px solid rgba(255,255,255,0.08)", paddingBottom: "env(safe-area-inset-bottom)" }}
            >
              {mainItems.map((t) => renderItem(t))}
              {needsMore && (
                <button
                  onClick={() => setMoreOpen((o) => !o)}
                  className="flex-1 flex flex-col items-center justify-center gap-1 py-2.5 min-w-0"
                  style={{ color: moreOpen || moreIsActive ? C.gold : "rgba(255,255,255,0.55)" }}

    /* ============================================================
       ADMIN (CEO / SUPPORT) — OVERVIEW
       ============================================================ */
    function Leaderboard({ students, results, groups, limit }) {
      const rows = useMemo(() => {
        const byStudent = {};
        results.forEach((r) => {
          if (r.overallBand == null) return;
          byStudent[r.studentId] = byStudent[r.studentId] || [];
          byStudent[r.studentId].push(r.overallBand);
        });
        return students
          .map((s) => {
            const scores = byStudent[s.id] || [];
            const avg = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null;
            const grp = groups.find((g) => g.id === s.groupId);
            return { ...s, avg, attempts: scores.length, groupName: grp?.name || "—" };
          })
          .sort((a, b) => {
            if (a.avg == null && b.avg == null) return 0;
            if (a.avg == null) return 1;
            if (b.avg == null) return -1;
            return b.avg - a.avg;
          })
          .slice(0, limit || students.length);
      }, [students, results, groups, limit]);

      return (
        <div className="divide-y" style={{ borderColor: C.borderSoft }}>
          {rows.map((r, i) => (
            <div key={r.id} className="flex items-center gap-3 py-2.5">
              <div className="w-6 text-center f-mono text-[13px] font-bold shrink-0" style={{ color: i < 3 && r.avg != null ? C.gold : C.mutedSoft }}>{i + 1}</div>
              <div className="w-8 h-8 rounded-full flex items-center justify-center f-mono text-[11px] font-bold shrink-0" style={{ backgroundColor: C.paperDim, color: C.ink }}>
                {r.name[0]}
              </div>
              <div className="min-w-0 flex-1">
                <div className="text-[13.5px] font-semibold truncate" style={{ color: C.text }}>{r.name}</div>
                <div className="text-[11.5px]" style={{ color: C.mutedSoft }}>{r.groupName}</div>
              </div>
              <div className="text-right shrink-0">
                <div className="f-mono text-[15px] font-bold" style={{ color: C.ink }}>{r.avg != null ? r.avg.toFixed(1) : "—"}</div>
                <div className="text-[10.5px]" style={{ color: C.mutedSoft }}>{r.attempts} urinish</div>
              </div>
            </div>
          ))}
          {!rows.length && <EmptyState icon="arrow-trend-up" title="Hali natijalar yo'q" sub="Studentlar mock exam topshirganda reyting shu yerda chiqadi" />}
        </div>
      );
    }

    function AdminOverview({ data }) {
      const { groups, students, exams, assignments, results } = data;
      const avgOverall = useMemo(() => {
        const withBand = results.filter((r) => r.overallBand != null);
        if (!withBand.length) return null;
        return withBand.reduce((a, b) => a + b.overallBand, 0) / withBand.length;
      }, [results]);

      const groupStats = groups.map((g) => {
        const gs = students.filter((s) => s.groupId === g.id);
        const gr = results.filter((r) => gs.some((s) => s.id === r.studentId) && r.overallBand != null);
        const avg = gr.length ? gr.reduce((a, b) => a + b.overallBand, 0) / gr.length : null;
        return { ...g, count: gs.length, avg };
      });
      const maxCount = Math.max(1, ...groupStats.map((g) => g.count));

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <StatCard icon="users" label="Jami o'quvchilar" value={students.length} tone="ink" />
            <StatCard icon="layer-group" label="Guruhlar" value={groups.length} tone="teal" />
            <StatCard icon="book-open" label="Mock examlar" value={exams.length} tone="gold" sub={`${exams.filter((e) => e.status === "on").length} faol`} />
            <StatCard icon="clipboard-list" label="Vazifalar" value={assignments.length} tone="ink" />
          </div>

          <Card>
            <div className="flex items-center justify-between mb-1">
              <div className="font-semibold text-[15px] f-display" style={{ color: C.ink }}>Talabalar reytingi — TOP 3</div>
              <Badge tone="gold"><Icon name="trophy" size={11} className="inline mr-1" />Eng yuqori ketma-ketlik</Badge>
            </div>
            <div className="text-[12px] mb-1" style={{ color: C.mutedSoft }}>O'rtacha band score bo'yicha eng yuqori 3 ta natija</div>
            <Top3Podium students={students} results={results} groups={groups} />
          </Card>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
            <Card className="lg:col-span-1 flex flex-col items-center justify-center">
              <div className="text-[12px] font-semibold uppercase tracking-wide mb-2" style={{ color: C.mutedSoft }}>Umumiy reyting (o'rtacha band)</div>
              <BandDial value={avgOverall} size={150} label="O'rtacha band" />
            </Card>

            <Card className="lg:col-span-2">
              <div className="flex items-center justify-between mb-3">
                <div className="font-semibold text-[15px] f-display" style={{ color: C.ink }}>Top 10 students</div>
                <Icon name="award" size={16} style={{ color: C.gold }} />
              </div>
              <Leaderboard students={students} results={results} groups={groups} limit={10} />
            </Card>
          </div>

    /* ============================================================
       ADMIN — EXAMS (create/manage/toggle) + WRITING REVIEW
       ============================================================ */
    function sectionIcon(key) {
      return { listening: "headphones", reading: "book-open", writing: "pen", vocabulary: "layer-group" }[key];
    }
    function sectionLabel(key) {
      return { listening: "Listening", reading: "Reading", writing: "Writing", vocabulary: "Vocabulary" }[key];
    }

    /* Listening bo'limi Part1/Part2... tuzilmasida saqlanadi. Eski (parts'siz,
       flat questions) mock'lar bilan orqaga moslik uchun fallback. */
    function getListeningParts(listening) {
      if (listening.parts) return listening.parts;
      return [{ id: "legacy", title: "Part 1", questions: listening.questions || [] }];
    }

    /* Writing bo'limi endi Task 1 / Task 2'ga bo'lingan holda saqlanadi. Eski (flat
       prompt/minWords/imageUrl) mock'lar bilan orqaga moslik uchun fallback — eski
       shakldagi ma'lumot avtomatik ravishda Task 2 sifatida ko'chiriladi. */
    function normalizeWriting(writing) {
      if (!writing) return { enabled: true, task1: { prompt: "", imageUrl: "", imageName: "", imageMime: "", minWords: 150 }, task2: { prompt: "", minWords: 250 } };
      if (writing.task1 && writing.task2) return writing;
      return {
        enabled: writing.enabled,
        task1: { prompt: "", imageUrl: "", imageName: "", imageMime: "", minWords: 150 },
        task2: { prompt: writing.prompt || "", minWords: writing.minWords || 250 },
      };
    }

    /* Har qanday bo'lim uchun (listening — part'lar bo'ylab yig'ilgan holda)
       savollarning yagona ro'yxatini qaytaradi — scoring, review, navigator uchun. */
    function flattenSectionQuestions(exam, key) {
      if (key === "listening") return getListeningParts(exam.sections.listening).flatMap((p) => p.questions);
      return exam.sections[key]?.questions || [];
    }

    /* Matnli savol qismlarini (parts) o'quvchiga ko'rinadigan matn shakliga aylantiradi — bo'sh joylar "____" bilan. */
    function partsToPreview(parts) {
      return (parts || []).map((p) => (p.type === "blank" ? "____" : p.value)).join("");
    }

    /* Matnli savolning barcha bo'sh joylariga (blanklariga) berilgan javob to'g'rimi — parts mavjud bo'lsa
       har bir blank alohida tekshiriladi (hammasi to'g'ri bo'lishi kerak), aks holda eski (bitta maydon)
       correctText bilan orqaga moslik saqlanadi. */
    function isTextAnswerCorrect(q, given) {
      const blanks = (q.parts || []).filter((p) => p.type === "blank");
      if (!blanks.length) {
        const expected = (q.correctText || "").toString().trim().toLowerCase();
        const actual = (given || "").toString().trim().toLowerCase();
        return !!expected && actual === expected;
      }
      const g = given && typeof given === "object" ? given : {};
      return blanks.every((b) => {
        const expected = (b.correct || "").toString().trim().toLowerCase();
        const actual = (g[b.id] || "").toString().trim().toLowerCase();
        return !!expected && actual === expected;
      });
    }

    /* Bitta savol to'g'ri javob berilganmi — javob turi (mcq/multi/text) ga qarab tekshiradi.
       "multi" — bir nechta to'g'ri javobli (checkbox) savol: barcha to'g'ri variantlar
       tanlangan va noto'g'ri variant tanlanmagan bo'lishi kerak. */
    function isAnswerCorrect(q, given) {
      if (q.answerType === "text") return isTextAnswerCorrect(q, given);
      if (q.answerType === "multi") {
        const correct = (q.correctIndexes || []).slice().sort();
        const g = (Array.isArray(given) ? given : []).slice().sort();
        return correct.length > 0 && correct.length === g.length && correct.every((v, i) => v === g[i]);
      }
      return given === q.correctIndex;
    }

    /* Savolga umuman javob berilganmi (to'g'ri/noto'g'ri emas — shunchaki urinilganmi).
       Natijalar sahifasida "javob berilmagan" savollarni "noto'g'ri"dan ajratish uchun kerak. */
    function isQuestionAnswered(q, given) {
      if (q.answerType === "text") {
        const blanks = (q.parts || []).filter((p) => p.type === "blank");
        if (!blanks.length) return !!(given && given.toString().trim());
        const g = given && typeof given === "object" ? given : {};
        return blanks.some((b) => (g[b.id] || "").toString().trim());
      }
      if (q.answerType === "multi") return Array.isArray(given) && given.length > 0;
      return given != null;
    }

    /* O'quvchi bergan javobni natijalar sahifasida ko'rsatish uchun matnga aylantiradi.
       MUHIM: bu yerda to'g'ri javob HECH QACHON ko'rsatilmaydi — faqat o'quvchi
       mock vaqtida aynan nima yozgani/tanlagani. Javob bo'lmasa null qaytaradi. */
    function formatGivenAnswer(q, given) {
      if (q.answerType === "multi") {
        if (!Array.isArray(given) || !given.length || !q.options) return null;
        const txt = given.slice().sort((a, b) => a - b).map((i) => q.options[i]).filter((v) => v != null).join(", ");
        return txt || null;
      }
      if (q.answerType === "text") {
        const blanks = (q.parts || []).filter((p) => p.type === "blank");
        if (!blanks.length) return given && given.toString().trim() ? given : null;
        const g = given && typeof given === "object" ? given : {};
        if (!blanks.some((b) => (g[b.id] || "").toString().trim())) return null;
        return (q.parts || []).map((p) => (p.type === "blank" ? ((g[p.id] || "").toString().trim() || "____") : p.value)).join("");
      }
      if (given == null || !q.options) return null;
      return q.options[given] ?? null;
    }

    /* Kutilayotgan to'g'ri javob bitta so'zdanmi (ichida bo'shliq yo'qmi) — shu bo'lsa,
       o'quvchi mock ishlayotganda javob maydoniga bo'shliq kiritib, 2-so'z yoza olmaydi. */
    function isSingleWordExpected(correct) {
      const t = (correct || "").toString().trim();
      return t !== "" && !/\s/.test(t);
    }
    /* Javob maydoniga yozilayotgan qiymatni, agar to'g'ri javob bitta so'z bo'lsa, bitta so'zga cheklaydi. */
    function clampToSingleWord(value, correct) {
      return isSingleWordExpected(correct) ? value.replace(/\s+/g, "") : value;
    }

    /* "_____" belgisi orqali bitta katta textarea'dagi bo'sh joylarni aniqlab, matnni
       parts (text/blank) massiviga aylantiradi. Avvalgi blanklarning id/correct qiymatlari
       tartib (occurrence) bo'yicha saqlanib qoladi, shunda javoblar yo'qolib qolmaydi. */
    function rawTextToParts(raw, prevParts) {
      const prevBlanks = (prevParts || []).filter((p) => p.type === "blank");
      const segments = raw.split("_____");
      const parts = [];
      segments.forEach((seg, i) => {
        parts.push({ type: "text", value: seg });
        if (i < segments.length - 1) {
          const prev = prevBlanks[i];
          parts.push({ type: "blank", id: prev ? prev.id : uid("blk"), correct: prev ? prev.correct : "" });
        }
      });
      return parts;
    }
    /* parts massivini — bitta katta textarea'da ko'rsatish uchun — raw matn stringiga aylantiradi
       (har bir blank "_____" bilan ifodalanadi). */
    function partsToRawText(parts) {
      return (parts || []).map((p) => (p.type === "blank" ? "_____" : p.value)).join("");
    }

    /* Matnli (bo'sh joyli) savol uchun bitta katta textarea + bo'sh joylar ro'yxati muharriri.
       Textarea ustida o'ng tugma bosilgan joyga bo'sh joy qo'yiladi va shu zahoti o'sha bo'sh joyning
       "to'g'ri javob" maydoni faollashadi (fokus tushadi) — javobni darhol kiritish mumkin bo'ladi. */
    function PassageEditor({ question, onChange }) {
      const blankRefs = React.useRef({});
      const [focusBlankId, setFocusBlankId] = React.useState(null);
      const parts = question.parts && question.parts.length ? question.parts : [{ type: "text", value: "" }];
      const rawText = partsToRawText(parts);
      const blanks = parts.filter((p) => p.type === "blank");

      React.useEffect(() => {
        if (focusBlankId && blankRefs.current[focusBlankId]) {
          blankRefs.current[focusBlankId].focus();
          setFocusBlankId(null);
        }
      }, [focusBlankId, blanks.length]);

      const handleContextMenu = (e) => {
        e.preventDefault();
        const pos = e.target.selectionStart ?? rawText.length;
        const newRaw = rawText.slice(0, pos) + "_____" + rawText.slice(pos);
        const newParts = rawTextToParts(newRaw, parts);
        onChange(newParts);
        const insertedIndex = rawText.slice(0, pos).split("_____").length - 1;
        const newBlank = newParts.filter((p) => p.type === "blank")[insertedIndex];
        if (newBlank) setFocusBlankId(newBlank.id);
      };

      const updateBlankCorrect = (id, val) =>
        onChange(parts.map((p) => (p.type === "blank" && p.id === id ? { ...p, correct: val } : p)));

      const removeBlank = (id) => {
        const idx = parts.findIndex((p) => p.type === "blank" && p.id === id);
        if (idx === -1) return;
        const before = parts[idx - 1];
        const after = parts[idx + 1];
        let newParts;
        if (before && before.type === "text" && after && after.type === "text") {
          newParts = [...parts.slice(0, idx - 1), { type: "text", value: before.value + after.value }, ...parts.slice(idx + 2)];
        } else {
          newParts = parts.filter((_, i) => i !== idx);
        }
        onChange(newParts);
      };

      return (
        <div className="space-y-2">
          <textarea
            value={rawText}
            onChange={(e) => onChange(rawTextToParts(e.target.value, parts))}
            onContextMenu={handleContextMenu}
            rows={6}
            placeholder="Matnni shu yerga yozing... Bo'sh joy qo'yish uchun kerakli joyda sichqonchaning o'ng tugmasini bosing"
            className="w-full rounded-lg px-3 py-2 text-[13px] outline-none resize-y"
            style={{ border: `1.5px solid ${C.border}`, backgroundColor: C.card, minHeight: 140 }}
          />
          <div className="text-[11px]" style={{ color: C.mutedSoft }}>
            <Icon name="circle-info" size={10} className="mr-1" />
            Matn ustida sichqonchaning o'ng tugmasini bosib, o'sha joyga bo'sh joy qo'shing
          </div>
          {blanks.length > 0 && (
            <div className="space-y-1.5">
              {blanks.map((b, i) => (
                <div key={b.id} className="flex items-center gap-2">
                  <span className="text-[11.5px] font-semibold w-5 text-right shrink-0" style={{ color: C.tealDeep }}>{i + 1}.</span>
                  <input
                    ref={(el) => (blankRefs.current[b.id] = el)}
                    value={b.correct}
                    onChange={(e) => updateBlankCorrect(b.id, e.target.value)}
                    placeholder="to'g'ri javob (bitta so'z tavsiya etiladi)"
                    className="flex-1 rounded px-2 py-1 text-[12.5px] outline-none"
                    style={{ border: `1px solid ${C.teal}`, backgroundColor: C.tealSoft, color: C.tealDeep }}
                  />
                  <button type="button" onClick={() => removeBlank(b.id)} title="Bo'sh joyni o'chirish">
                    <Icon name="xmark" size={11} style={{ color: C.mutedSoft }} />
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function ExamForm({ groups, initialExam, onCancel, onSave, toast }) {
      const isEdit = !!initialExam;
      const [title, setTitle] = useState(initialExam?.title || "");
      const [examType, setExamType] = useState(initialExam?.examType || "academic");
      const [assignedGroupIds, setAssignedGroupIds] = useState(initialExam?.assignedGroupIds || []);
      const [sections, setSections] = useState(() => {
        const base = initialExam?.sections || {
          listening: { enabled: true, audioUrl: "", instructions: "", parts: [{ id: uid("part"), title: "Part 1", questions: [] }] },
          reading: { enabled: true, instructions: "", passage: "", questions: [] },
          writing: { enabled: true, task1: { prompt: "", imageUrl: "", imageName: "", imageMime: "", minWords: 150 }, task2: { prompt: "", minWords: 250 } },
          vocabulary: { enabled: true, questions: [] },
        };
        return { ...base, listening: { ...base.listening, parts: getListeningParts(base.listening) }, writing: normalizeWriting(base.writing) };
      });
      const [qDraft, setQDraft] = useState({ listening: "", reading: "", vocabulary: "" });
      const [pendingQuestion, setPendingQuestion] = useState(null); // { sectionKey, partId, text }
      const [saving, setSaving] = useState(false);
      const [activeSection, setActiveSection] = useState(null);

      const toggleSection = (key) => setSections((s) => ({ ...s, [key]: { ...s[key], enabled: !s[key].enabled } }));

      /* Listening — Part1/Part2... boshqaruvi */
      const addPart = () => setSections((s) => ({ ...s, listening: { ...s.listening, parts: [...s.listening.parts, { id: uid("part"), title: `Part ${s.listening.parts.length + 1}`, questions: [] }] } }));
      const removePart = (partId) => setSections((s) => ({ ...s, listening: { ...s.listening, parts: s.listening.parts.filter((p) => p.id !== partId) } }));
      const renamePart = (partId, val) => setSections((s) => ({ ...s, listening: { ...s.listening, parts: s.listening.parts.map((p) => (p.id === partId ? { ...p, title: val } : p)) } }));
      /* Partning javob turi — "mcq" (variantli/ABC) yoki "text" (matnli/bo'sh joyli). Bir marta tanlanadi. */
      const setPartMode = (partId, mode) => setSections((s) => ({ ...s, listening: { ...s.listening, parts: s.listening.parts.map((p) => (p.id === partId ? { ...p, mode } : p)) } }));

      /* Savollarni sectionKey (va listening uchun partId) bo'yicha umumiy tarzda yangilash */
      const updateQuestions = (sectionKey, updater, partId) => {
        setSections((s) => {
          if (sectionKey === "listening") {
            return { ...s, listening: { ...s.listening, parts: s.listening.parts.map((p) => (p.id === partId ? { ...p, questions: updater(p.questions) } : p)) } };
          }
          return { ...s, [sectionKey]: { ...s[sectionKey], questions: updater(s[sectionKey].questions) } };
        });
      };

      /* Berilgan turdagi savolni to'g'ridan-to'g'ri qo'shadi (tur tanlash so'ralmaydi — masalan,
         listening part'ining turi allaqachon belgilangan bo'lsa). */
      const addQuestionOfType = (sectionKey, partId, text, answerType) => {
        const newQ = answerType === "text"
          ? { id: uid("q"), q: "", answerType: "text", parts: [{ type: "text", value: text }] }
          : answerType === "multi"
            ? { id: uid("q"), q: text, answerType: "multi", options: ["Variant A", "Variant B", "Variant C", "Variant D"], correctIndexes: [0] }
            : { id: uid("q"), q: text, answerType: "mcq", options: ["Variant A", "Variant B", "Variant C", "Variant D"], correctIndex: 0 };
        updateQuestions(sectionKey, (qs) => [...qs, newQ], partId);
      };
      const startAddQuestion = (sectionKey, partId, forcedType) => {
        const draftKey = partId ? `${sectionKey}:${partId}` : sectionKey;
        const text = (qDraft[draftKey] || "").trim();
        if (!text) return;
        if (forcedType) {
          addQuestionOfType(sectionKey, partId, text, forcedType);
          setQDraft((d) => ({ ...d, [draftKey]: "" }));
          return;
        }
        setPendingQuestion({ sectionKey, partId, text });
      };
      const confirmAddQuestion = (answerType) => {
        if (!pendingQuestion) return;
        const { sectionKey, partId, text } = pendingQuestion;
        addQuestionOfType(sectionKey, partId, text, answerType);
        const draftKey = partId ? `${sectionKey}:${partId}` : sectionKey;
        setQDraft((d) => ({ ...d, [draftKey]: "" }));
        setPendingQuestion(null);
      };

      const removeQuestion = (sectionKey, qid, partId) => updateQuestions(sectionKey, (qs) => qs.filter((q) => q.id !== qid), partId);
      const setOption = (sectionKey, qid, idx, val, partId) => updateQuestions(sectionKey, (qs) => qs.map((q) => (q.id === qid ? { ...q, options: q.options.map((o, i) => (i === idx ? val : o)) } : q)), partId);
      const setCorrect = (sectionKey, qid, idx, partId) => updateQuestions(sectionKey, (qs) => qs.map((q) => (q.id === qid ? { ...q, correctIndex: idx } : q)), partId);
      const toggleCorrectIndex = (sectionKey, qid, idx, partId) => updateQuestions(sectionKey, (qs) => qs.map((q) => {
        if (q.id !== qid) return q;
        const cur = q.correctIndexes || [];
        const next = cur.includes(idx) ? cur.filter((v) => v !== idx) : [...cur, idx].sort();
        return { ...q, correctIndexes: next };
      }), partId);
      const setCorrectText = (sectionKey, qid, val, partId) => updateQuestions(sectionKey, (qs) => qs.map((q) => (q.id === qid ? { ...q, correctText: val } : q)), partId);

      /* Eslatma: matnli (bo'sh joyli) savollarni tahrirlash endi <PassageEditor /> komponenti orqali
         amalga oshiriladi (bitta katta textarea + o'ng tugma bilan bo'sh joy qo'shish). */

      const submit = async () => {
        if (!title.trim()) { toast("error", "Exam nomini kiriting"); return; }
        setSaving(true);
        if (isEdit) {
          await onSave({ ...initialExam, title: title.trim(), examType, assignedGroupIds, sections });
        } else {
          await onSave({
            id: uid("exam"), title: title.trim(), examType, status: "on", assignedGroupIds, createdAt: Date.now(), reopenedAt: null, notifSeenBy: [], sections,
          });
        }
        setSaving(false);
      };

      const questionSection = (key, partId) => {
        const part = key === "listening" ? sections.listening.parts.find((p) => p.id === partId) : null;
        const questions = part ? part.questions : sections[key].questions;
        const draftKey = partId ? `${key}:${partId}` : key;
        const isPending = !!pendingQuestion && pendingQuestion.sectionKey === key && pendingQuestion.partId === partId;

        /* Listening part'lari uchun: javob turi ("mcq" — abc / "multi" — bir nechta to'g'ri
           javobli / "text" — matnli) bir marta tanlanadi va o'sha part uchun saqlanib qoladi. */
        const inferMode = (q) => (q.answerType === "text" ? "text" : q.answerType === "multi" ? "multi" : "mcq");
        const partMode = part ? (part.mode || (part.questions.length ? inferMode(part.questions[0]) : null)) : null;
        if (part) {
          if (!partMode) {
            return (
              <div className="rounded-lg p-4 text-center space-y-2" style={{ backgroundColor: C.tealSoft, border: `1.5px dashed ${C.teal}` }}>
                <div className="text-[12.5px] font-medium" style={{ color: C.tealDeep }}>Bu part uchun javob turini tanlang:</div>
                <div className="flex items-center justify-center gap-2 flex-wrap">
                  <Button size="sm" variant="subtle" icon="list-check" onClick={() => setPartMode(partId, "mcq")}>Variantli (ABC)</Button>
                  <Button size="sm" variant="subtle" icon="square-check" onClick={() => setPartMode(partId, "multi")}>Bir nechta javobli</Button>
                  <Button size="sm" variant="subtle" icon="pen" onClick={() => setPartMode(partId, "text")}>Matnli (bo'sh joylar)</Button>
                </div>
              </div>
            );
          }
          if (partMode === "text") {
            const q = part.questions[0] || null;
            return (
              <PassageEditor
                question={q || { id: uid("q"), answerType: "text", q: "", parts: [] }}
                onChange={(newParts) => {
                  if (q) {
                    updateQuestions(key, (qs) => qs.map((qq) => (qq.id === q.id ? { ...qq, parts: newParts } : qq)), partId);
                  } else {
                    updateQuestions(key, (qs) => [...qs, { id: uid("q"), q: "", answerType: "text", parts: newParts }], partId);
                  }
                }}
              />
            );
          }
          // partMode === "mcq" yoki "multi" bo'lsa, pastdagi umumiy (variantli savollar qo'shish) UI davom etadi.
        }

        return (
          <div className="space-y-2">
            {questions.map((q, i) => (
              <div key={q.id} className="rounded-lg p-3" style={{ backgroundColor: C.paperDim }}>
                <div className="flex items-start justify-between gap-2">
                  <div className="text-[13px] font-medium" style={{ color: C.text }}>{i + 1}.{q.q ? ` ${q.q}` : ""}</div>
                  <button onClick={() => removeQuestion(key, q.id, partId)}><Icon name="trash" size={13} style={{ color: C.mutedSoft }} /></button>
                </div>
                {q.answerType === "text" ? (
                  q.parts ? (
                    <div className="mt-2">
                      <PassageEditor
                        question={q}
                        onChange={(newParts) => updateQuestions(key, (qs) => qs.map((qq) => (qq.id === q.id ? { ...qq, parts: newParts } : qq)), partId)}
                      />
                    </div>
                  ) : (
                    <div className="mt-2">
                      <input
                        value={q.correctText || ""}
                        onChange={(e) => setCorrectText(key, q.id, e.target.value, partId)}
                        placeholder="To'g'ri javob (matn)..."
                        className="w-full rounded px-2 py-1.5 text-[12.5px] outline-none"
                        style={{ border: `1px solid ${C.border}`, backgroundColor: C.card }}
                      />
                    </div>
                  )
                ) : q.answerType === "multi" ? (
                  <div className="grid grid-cols-2 gap-1.5 mt-2">
                    {q.options.map((o, idx) => (
                      <label key={idx} className="flex items-center gap-1.5 text-[12px]">
                        <input type="checkbox" checked={(q.correctIndexes || []).includes(idx)} onChange={() => toggleCorrectIndex(key, q.id, idx, partId)} />
                        <input value={o} onChange={(e) => setOption(key, q.id, idx, e.target.value, partId)} className="flex-1 rounded px-1.5 py-1 text-[12px] outline-none" style={{ border: `1px solid ${C.border}`, backgroundColor: C.card }} />
                      </label>
                    ))}
                  </div>
                ) : (
                  <div className="grid grid-cols-2 gap-1.5 mt-2">
                    {q.options.map((o, idx) => (
                      <label key={idx} className="flex items-center gap-1.5 text-[12px]">
                        <input type="radio" checked={q.correctIndex === idx} onChange={() => setCorrect(key, q.id, idx, partId)} />
                        <input value={o} onChange={(e) => setOption(key, q.id, idx, e.target.value, partId)} className="flex-1 rounded px-1.5 py-1 text-[12px] outline-none" style={{ border: `1px solid ${C.border}`, backgroundColor: C.card }} />
                      </label>
                    ))}
                  </div>
                )}
              </div>
            ))}
            {isPending && (
              <div className="rounded-lg p-3 space-y-2" style={{ backgroundColor: C.tealSoft, border: `1.5px solid ${C.teal}` }}>
                <div className="text-[12.5px] font-medium" style={{ color: C.tealDeep }}>"{pendingQuestion.text}" — javob turini tanlang:</div>
                <div className="flex items-center gap-2 flex-wrap">
                  <Button size="sm" variant="subtle" icon="list-check" onClick={() => confirmAddQuestion("mcq")}>Variantli (MCQ)</Button>
                  <Button size="sm" variant="subtle" icon="square-check" onClick={() => confirmAddQuestion("multi")}>Bir nechta javobli</Button>
                  <Button size="sm" variant="subtle" icon="pen" onClick={() => confirmAddQuestion("text")}>Matn javob</Button>
                  <button type="button" onClick={() => setPendingQuestion(null)} className="text-[12px] font-semibold hover:opacity-70 transition-opacity" style={{ color: C.mutedSoft }}>Bekor qilish</button>
                </div>
              </div>
            )}
            <div className="flex gap-2">
              <input
                value={qDraft[draftKey] || ""}
                onChange={(e) => setQDraft((d) => ({ ...d, [draftKey]: e.target.value }))}
                onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); startAddQuestion(key, partId, part ? partMode : undefined); } }}
                placeholder="Savol matnini kiriting..."
                className="flex-1 rounded-lg text-[13px] outline-none px-3 py-2"
                style={{ border: `1.5px solid ${C.border}`, backgroundColor: C.paper }}
              />
              <Button size="sm" variant="subtle" icon="plus" onClick={() => startAddQuestion(key, partId, part ? partMode : undefined)}>Qo'shish</Button>
            </div>
          </div>
        );
      };

      const sectionSummary = (key) => {
        const s = sections[key];
        if (!s.enabled) return "O'chirilgan";
        if (key === "listening") {
          const total = s.parts.reduce((sum, p) => sum + p.questions.length, 0);
          return total ? `${total} ta savol, ${s.parts.length} ta part${s.audioUrl ? ", audio bor" : ""}` : "Savollar kiritilmagan";
        }
        if (key === "reading") return s.passage.trim() ? `${s.questions.length} ta savol, matn bor` : "Matn kiritilmagan";
        if (key === "writing") {
          const w = normalizeWriting(s);
          const n = [w.task1.prompt.trim() ? 1 : 0, w.task2.prompt.trim() ? 1 : 0].reduce((a, b) => a + b, 0);
          return n ? `${n}/2 task kiritilgan` : "Tasklar kiritilmagan";
        }
        if (key === "vocabulary") return s.questions.length ? `${s.questions.length} ta savol` : "Savollar kiritilmagan";
        return "";
      };

      const sectionFields = (key) => {
        if (key === "listening") {
          return (
            <>
              <AudioDropInput label="Audio fayl (ixtiyoriy)" value={sections.listening.audioUrl} onChange={(v) => setSections((s) => ({ ...s, listening: { ...s.listening, audioUrl: v } }))} />
              <TextArea label="Yo'riqnoma" rows={2} value={sections.listening.instructions} onChange={(v) => setSections((s) => ({ ...s, listening: { ...s.listening, instructions: v } }))} />
              <div className="space-y-4">
                {sections.listening.parts.map((part) => (
                  <div key={part.id} className="rounded-xl p-3" style={{ border: `1px solid ${C.borderSoft}` }}>
                    <div className="flex items-center gap-2 mb-2">
                      <input
                        value={part.title}
                        onChange={(e) => renamePart(part.id, e.target.value)}
                        className="font-semibold text-[13.5px] rounded-lg px-2 py-1.5 outline-none flex-1"
                        style={{ border: `1px solid ${C.border}`, backgroundColor: C.card, color: C.ink }}
                      />
                      {sections.listening.parts.length > 1 && (
                        <button onClick={() => removePart(part.id)} title="Partni o'chirish"><Icon name="trash" size={13} style={{ color: C.mutedSoft }} /></button>
                      )}
                    </div>
                    {questionSection("listening", part.id)}
                  </div>
                ))}
                <Button size="sm" variant="ghost" icon="plus" onClick={addPart}>Part qo'shish</Button>
              </div>
            </>
          );
        }
        if (key === "reading") {
          return (
            <>
              <TextArea label="Matn (passage)" rows={5} value={sections.reading.passage} onChange={(v) => setSections((s) => ({ ...s, reading: { ...s.reading, passage: v } }))} hint="Student bu matnni highlighter bilan belgilay oladi" />
              {questionSection("reading")}
            </>
          );
        }
        if (key === "writing") {
          const w = normalizeWriting(sections.writing);
          const setTask1 = (patch) => setSections((s) => ({ ...s, writing: { ...normalizeWriting(s.writing), task1: { ...normalizeWriting(s.writing).task1, ...patch } } }));
