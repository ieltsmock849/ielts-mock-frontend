    /* Har bir Writing task uchun 4 mezon (0-9, 0.5 qadam bilan): Task Achievement/Response,
       Coherence & Cohesion, Lexical Resource, Grammatical Range & Accuracy. */
    const WRITING_CRITERIA = [
      { key: "ta", label: "Task Achievement / Response" },
      { key: "cc", label: "Coherence & Cohesion" },
      { key: "lr", label: "Lexical Resource" },
      { key: "gra", label: "Grammatical Range & Accuracy" },
    ];
    function CriteriaTaskCard({ title, text, minWords, criteria, onChange }) {
      const wordCount = (text || "").trim().split(/\s+/).filter(Boolean).length;
      const band = criteriaToBand(criteria);
      return (
        <div className="rounded-xl p-4 space-y-3" style={{ border: `1px solid ${C.borderSoft}` }}>
          <div className="flex items-center justify-between">
            <div className="font-bold text-[13px] uppercase tracking-wide" style={{ color: C.tealDeep }}>{title}</div>
            <Badge tone={wordCount >= minWords ? "success" : "danger"}>{wordCount} / {minWords} so'z</Badge>
          </div>
          <div className="rounded-lg p-3 max-h-48 overflow-y-auto text-[13.5px] leading-relaxed whitespace-pre-wrap" style={{ backgroundColor: C.paperDim, color: C.text }}>
            {text || "(Bo'sh — o'quvchi javob yozmagan)"}
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            {WRITING_CRITERIA.map((c) => (
              <Input key={c.key} label={c.label} type="number" value={String(criteria[c.key] ?? "")} onChange={(v) => onChange({ ...criteria, [c.key]: v === "" ? "" : Number(v) })} />
            ))}
          </div>
          <div className="text-[13px] font-semibold text-right" style={{ color: C.ink }}>Task bandi: {band ?? "—"}</div>
        </div>
      );
    }
    function WritingReview({ result, onSave }) {
      const wt = result.writingText && typeof result.writingText === "object" ? result.writingText : { task1: "", task2: result.writingText || "" };
      const [c1, setC1] = useState(result.task1Criteria || { ta: 6, cc: 6, lr: 6, gra: 6 });
      const [c2, setC2] = useState(result.task2Criteria || { ta: 6, cc: 6, lr: 6, gra: 6 });
      const b1 = criteriaToBand(c1);
      const b2 = criteriaToBand(c2);
      const overall = writingOverallBand(b1, b2);
      return (
        <div className="space-y-4">
          <CriteriaTaskCard title="Task 1" text={wt.task1} minWords={150} criteria={c1} onChange={setC1} />
          <CriteriaTaskCard title="Task 2" text={wt.task2} minWords={250} criteria={c2} onChange={setC2} />
          <div className="rounded-xl p-3.5 flex items-center justify-between" style={{ backgroundColor: C.tealSoft, border: `1px solid ${C.teal}` }}>
            <span className="text-[13.5px] font-semibold" style={{ color: C.tealDeep }}>Writing overall band (Task1×1 + Task2×2) / 3</span>
            <span className="text-[18px] font-bold" style={{ color: C.tealDeep }}>{overall ?? "—"}</span>
          </div>
          <div className="flex justify-end">
            <Button icon="check" onClick={() => onSave({ task1Criteria: c1, task2Criteria: c2, task1Band: b1, task2Band: b2, band: overall })}>Bahoni saqlash</Button>
          </div>
        </div>
      );
    }

    /* ============================================================
       ADMIN — ASSIGNMENTS
       ============================================================ */
    function AssignmentForm({ groups, students, initialAssignment, onCancel, onSave, toast }) {
      const isEdit = !!initialAssignment;

      const legacyInit = (() => {
        if (!initialAssignment) return { content: "", fileUrl: "", fileName: "", fileMime: "" };
        const a = initialAssignment;
        if (a.fileMime !== undefined) return { content: a.content || "", fileUrl: a.fileUrl || "", fileName: a.fileName || "", fileMime: a.fileMime || "" };
        if (a.type === "listening" && a.content) {
          const m = /^data:([^;]+);/.exec(a.content);
          return { content: "", fileUrl: a.content, fileName: "audio", fileMime: m ? m[1] : "audio/mpeg" };
        }
        if (a.type === "file" && a.fileUrl) {
          return { content: "", fileUrl: a.fileUrl, fileName: a.fileUrl.split("/").pop() || "fayl", fileMime: "" };
        }
        return { content: a.content || "", fileUrl: "", fileName: "", fileMime: "" };
      })();

      const initialGroupIds = initialAssignment
        ? (initialAssignment.groupIds || (initialAssignment.groupId ? [initialAssignment.groupId] : []))
        : (groups[0] ? [groups[0].id] : []);

      const [title, setTitle] = useState(initialAssignment?.title || "");
      const [content, setContent] = useState(legacyInit.content);
      const [fileUrl, setFileUrl] = useState(legacyInit.fileUrl);
      const [fileName, setFileName] = useState(legacyInit.fileName);
      const [fileMime, setFileMime] = useState(legacyInit.fileMime);
      const [groupIds, setGroupIds] = useState(initialGroupIds);
      const [specificOnly, setSpecificOnly] = useState(initialAssignment ? (initialAssignment.targetStudentIds || []).length > 0 : false);
      const [selected, setSelected] = useState(initialAssignment?.targetStudentIds || []);
      const [saving, setSaving] = useState(false);

      const groupStudents = students.filter((s) => groupIds.includes(s.groupId));
      const toggleStudent = (id) => setSelected((s) => (s.includes(id) ? s.filter((x) => x !== id) : [...s, id]));

      const handleFileChange = (dataUrl, name, mime) => {
        setFileUrl(dataUrl);
        setFileName(name);
        setFileMime(mime);
      };

      const submit = async () => {
        if (!title.trim()) { toast("error", "Sarlavhani kiriting"); return; }
        if (!groupIds.length) { toast("error", "Kamida bitta guruhni tanlang"); return; }
        if (!content.trim() && !fileUrl) { toast("error", "Vazifa matnini kiriting yoki fayl biriktiring"); return; }
        setSaving(true);
        const payload = {
          title: title.trim(), content: content.trim(), fileUrl, fileName, fileMime,
          groupIds, targetStudentIds: specificOnly ? selected : [],
        };
        if (isEdit) {
          await onSave({ ...initialAssignment, ...payload });

          await onSave({ id: uid("asg"), ...payload, createdAt: Date.now(), viewedBy: [] });

          <label className="flex items-center gap-2 text-[13px] font-medium cursor-pointer" style={{ color: C.text }}>

          </div>

    function AvatarUpload({ name, avatar, onChange, size = 64 }) {
      const inputRef = useRef(null);
      const handleFile = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => onChange(reader.result);
        reader.readAsDataURL(file);
        e.target.value = "";
      };
      return (
        <div className="relative shrink-0" style={{ width: size, height: size }}>
          {avatar ? (
            <img src={avatar} alt={name} className="w-full h-full rounded-full object-cover" style={{ border: `2px solid ${C.border}` }} />
          ) : (
            <div className="w-full h-full rounded-full flex items-center justify-center f-mono font-bold" style={{ backgroundColor: C.gold, color: C.inkDeep, fontSize: size * 0.34 }}>
              {name ? name[0].toUpperCase() : "?"}
            </div>
          )}
          <button
            type="button"
            onClick={() => inputRef.current && inputRef.current.click()}
            className="absolute -bottom-0.5 -right-0.5 w-6 h-6 rounded-full flex items-center justify-center"
            style={{ backgroundColor: C.teal, color: "#fff", border: `2px solid ${C.card}` }}
            title="Rasmni o'zgartirish"
          >
            <Icon name="camera" size={11} />
          </button>
          <input ref={inputRef} type="file" accept="image/*" className="hidden" onChange={handleFile} />
        </div>
      );
    }

    // Full CEO / Support profile: editable personal info + avatar, password
    // change, a user-management list (students, always deletable; the other
    // admin account visible only from Support's side), and logout.
    function AdminProfile({ session, user, myOrg, data, actions, toast, onLogout, onGoToStudents }) {
      const role = session.role; // "ceo" | "admin" | "manager" | "teacher"
      const roleLabel = ROLE_LABELS[role] || role;
      const isCeo = role === "ceo";

      /* ---- personal info ----
         CEO'ning shaxsiy/tashkilot ma'lumotlari "organizations" yozuvida,
         Admin/Manager/Teacher'niki esa "orgStaff" yozuvida saqlanadi — endi
         bitta umumiy "adminProfiles.ceo" slotiga emas (u ko'p-CEO holatida
         hammaga bitta profil bo'lib qolar edi). */
      const [name, setName] = useState(user.name || "");
      const [phone, setPhone] = useState(user.phone || "");
      const [infoSaving, setInfoSaving] = useState(false);

      const saveInfo = async () => {
        if (!name.trim()) { toast("error", "Ism kiritilishi shart"); return; }
        setInfoSaving(true);
        if (isCeo) await actions.updateOrganization(session.orgId, { ceoName: name.trim(), phone: phone.trim() });
        else await actions.updateOrgStaff(session.user.id, { name: name.trim(), phone: phone.trim() });
        setInfoSaving(false);
        toast("success", "Ma'lumotlar saqlandi");
      };

      const setAvatar = async (dataUrl) => {
        if (isCeo) await actions.updateOrganization(session.orgId, { avatar: dataUrl });
        else await actions.updateOrgStaff(session.user.id, { avatar: dataUrl });
        toast("success", "Rasm yangilandi");
      };

      /* ---- org (faqat CEO/Admin) — Telegram Chat ID shu yerda ko'rinadi/tahrirlanadi ---- */
      const [orgName, setOrgName] = useState(myOrg?.orgName || "");
      const [orgEmail, setOrgEmail] = useState(myOrg?.email || "");
      const [telegramChatId, setTelegramChatId] = useState(myOrg?.telegramChatId || "");
      const [orgSaving, setOrgSaving] = useState(false);
      const canEditOrg = canEditOrgProfile(role); // ceo | admin
      const saveOrg = async () => {
        setOrgSaving(true);
        await actions.updateOrganization(session.orgId, { orgName: orgName.trim(), email: orgEmail.trim(), telegramChatId: telegramChatId.trim() });
        setOrgSaving(false);
        toast("success", "Tashkilot ma'lumotlari saqlandi");
      };

      /* ---- password ---- */
      const [curPw, setCurPw] = useState("");
      const [newPw, setNewPw] = useState("");
      const [confirmPw, setConfirmPw] = useState("");
      const [pwSaving, setPwSaving] = useState(false);

      const changePassword = async () => {
        if (!curPw) { toast("error", "Joriy parolni kiriting"); return; }
        if (newPw.length < 4) { toast("error", "Yangi parol kamida 4 belgi bo'lishi kerak"); return; }
        if (newPw !== confirmPw) { toast("error", "Parollar mos kelmadi"); return; }
        setPwSaving(true);
        const ok = await actions.changeMyPassword(curPw, newPw);
        setPwSaving(false);
        if (ok) {
          setCurPw(""); setNewPw(""); setConfirmPw("");
          toast("success", "Parol muvaffaqiyatli o'zgartirildi");
        }
      };

      /* ---- foydalanuvchilar (o'quvchilar ro'yxati — tezkor o'chirish) ---- */
      const [confirmDel, setConfirmDel] = useState(null);
      const doDelete = async () => {
        await actions.deleteStudent(confirmDel.id);
        toast("success", "Foydalanuvchi o'chirildi");
        setConfirmDel(null);
      };

      return (
        <div className="max-w-3xl mx-auto space-y-5">
          {/* Shaxsiy ma'lumotlar */}
          <Card>
            <ProfileSectionHeader label="Shaxsiy ma'lumotlar" />
            <div className="flex items-center gap-4 mb-5">
              <AvatarUpload name={user.name} avatar={user.avatar} onChange={setAvatar} />
              <div className="min-w-0">
                <div className="font-semibold text-[16px] f-display truncate" style={{ color: C.ink }}>{user.name}</div>
                <div className="text-[12.5px] truncate" style={{ color: C.mutedSoft }}>@{user.username} · {roleLabel}</div>
              </div>
            </div>
            <div className="grid sm:grid-cols-2 gap-4 mb-4">
              <Input label="Ism familiya" value={name} onChange={setName} placeholder="To'liq ism" icon="user" />
              <Input label="Telefon" value={phone} onChange={setPhone} placeholder="+998 90 000 00 00" icon="phone" />
            </div>
            <Button icon="floppy-disk" onClick={saveInfo} loading={infoSaving}>Saqlash</Button>
          </Card>

          {/* Tashkilot ma'lumotlari — faqat CEO/Admin. Telegram Chat ID shu
          tashkilotning o'ziga bog'langan holda saqlanadi (boshqa CEO'ning
          Chat ID'siga hech qachon aralashmaydi). */}
          {canEditOrg && myOrg && (
            <Card>
              <ProfileSectionHeader label="Tashkilot (o'quv markazi)" />
              <div className="grid sm:grid-cols-2 gap-4 mb-4">
                <Input label="Tashkilot nomi" value={orgName} onChange={setOrgName} icon="building" />
                <Input label="Email" value={orgEmail} onChange={setOrgEmail} icon="envelope" />
              </div>
              <div className="mb-4">
                <Input label="Telegram Chat ID" value={telegramChatId} onChange={setTelegramChatId} icon="paper-plane" hint="Shu tashkilotga oid bildirishnomalar aynan shu Chat ID'ga yuboriladi." />
              </div>
              <div className="mb-4 text-[12.5px] flex items-center gap-2" style={{ color: C.mutedSoft }}>
                <Icon name="circle-info" size={13} /> Holat: <Badge tone={myOrg.status === "active" ? "success" : "danger"}>{myOrg.status === "active" ? "Faol" : "Faol emas"}</Badge> (Support tomonidan boshqariladi)
              </div>
              <Button icon="floppy-disk" onClick={saveOrg} loading={orgSaving}>Saqlash</Button>
            </Card>
          )}

          {/* Parol o'zgartirish */}
          <Card>
            <ProfileSectionHeader label="Parol o'zgartirish" />
            <div className="space-y-4">
              <Input label="Joriy parol" value={curPw} onChange={setCurPw} type="password" icon="lock" />
              <div className="grid sm:grid-cols-2 gap-4">
                <Input label="Yangi parol" value={newPw} onChange={setNewPw} type="password" icon="key" placeholder="Kamida 4 belgi" />
                <Input label="Tasdiqlang" value={confirmPw} onChange={setConfirmPw} type="password" icon="check" placeholder="Qaytaring" />
              </div>
              <Button variant="teal" icon="key" onClick={changePassword} loading={pwSaving}>Parolni o'zgartirish</Button>
            </div>
          </Card>

          {/* Foydalanuvchilar — faqat shu tashkilotning o'quvchilari (org-scoped data). */}
          <Card>
            <ProfileSectionHeader label="O'quvchilar" />
            <div className="space-y-2 mb-3">
              {data.students.map((s) => (
                <UserRow key={s.id} name={s.name} sub={`@${s.username} · O'quvchi`} onDelete={() => setConfirmDel({ id: s.id, name: s.name })} />
              ))}
              {!data.students.length && (
                <div className="text-[13px] text-center py-4" style={{ color: C.mutedSoft }}>Hozircha o'quvchilar yo'q</div>
              )}
            </div>
            <Button variant="teal" icon="user-plus" onClick={onGoToStudents}>Yangi foydalanuvchi</Button>
          </Card>

          {/* Tizimdan chiqish */}
          <Card>
            <ProfileSectionHeader label="Tizimdan chiqish" tone="danger" />
            <div className="text-[13px] mb-4" style={{ color: C.muted }}>Tizimdan chiqsangiz, qayta kirishda login va parol so'raladi.</div>
            <Button variant="danger" icon="right-from-bracket" onClick={onLogout}>Chiqish</Button>
          </Card>

          {confirmDel && (
            <ConfirmDialog
              title="Foydalanuvchini o'chirish"
              message={`"${confirmDel.name}" o'chirilsinmi? Bu amalni ortga qaytarib bo'lmaydi.`}
              onConfirm={doDelete}
              onCancel={() => setConfirmDel(null)}
            />
          )}
        </div>
      );
    }

    function AdminApp({ session, data, actions, onLogout, toast, organizations, orgStaff, messages, unreadMsg }) {
      const [tab, setTab] = useState("overview");
      const [collapsedState, setCollapsedState] = useState(!!session.user?.sidebarCollapsed);
      const setCollapsed = (next) => {
        setCollapsedState((c) => {
          const value = typeof next === "function" ? next(c) : next;
          actions.setSidebarCollapsed(value);
          return value;
        });
      };
      const collapsed = collapsedState;

      /* "Texnik xizmat" — footer tugmasi orqali ochiladigan modal (support
         rolidan tashqari barcha rollarda: CEO/Admin/Manager/Teacher). */
      const [showSupport, setShowSupport] = useState(false);
      const [supportSending, setSupportSending] = useState(false);
      const submitSupportTicket = async (message) => {
        setSupportSending(true);
        const ok = await actions.submitSupportTicket(message);
        setSupportSending(false);
        if (ok !== false) {
          setShowSupport(false);
          toast("success", "Murojaatingiz texnik xizmatga yuborildi");
        }
      };

      /* "organizations" ro'yxati endi faqat Support uchun to'liq keladi (backend
         cheklovi) — CEO/Admin esa o'z tashkiloti haqidagi ochiq
         ma'lumotni to'g'ridan-to'g'ri profilidan (session.user.organizationDetail)
         oladi, alohida ro'yxatni qidirishning hojati yo'q. */
      const myOrg = session.user?.organizationDetail || organizations.find((o) => o.id === session.orgId) || null;
      /* YANGILANDI (qaytarildi): "Xodimlar" bo'limi Admin uchun BUTUNLAY
         OLIB TASHLANDI — bu bo'limni endi FAQAT CEO ko'radi/boshqaradi.
         "Xabarlar" esa Admin uchun saqlanib qoladi (bu talab qaytarilmadi). */
      const canStaff = session.role === "ceo";

      // ROLE-BASED TABS: "Xodimlar" — FAQAT CEO. "Xabarlar" — CEO va Admin.
      const tabs = [
        { key: "overview", label: "Umumiy", icon: "table-cells-large" },
        { key: "groups", label: "Guruhlar", icon: "layer-group" },
        { key: "students", label: "O'quvchilar", icon: "users" },
        { key: "exams", label: "Mock Examlar", icon: "book-open" },
        { key: "assignments", label: "Vazifalar", icon: "clipboard-list" },
        ...(canStaff ? [{ key: "staff", label: "Xodimlar", icon: "user-tie" }] : []),
        // CEO va Admin — ikkalasi ham xodim/o'quvchilarga xabar yubora oladi.
        ...(session.role === "ceo" || session.role === "admin" ? [{ key: "messages", label: "Xabarlar", icon: "envelope" }] : []),
        { key: "profile", label: "Profil", icon: "user" },
      ];
      const titles = { overview: "Umumiy ko'rinish", groups: "Guruhlar", students: "O'quvchilar", exams: "Mock Examlar", assignments: "Vazifalar", staff: "Xodimlar", messages: "Xabarlar", profile: "Profil" };

      // CEO uchun profil ma'lumotlari to'g'ridan-to'g'ri session.user'da (backend
      // ProfileView ceo tarmog'idan keladi: name/username/phone/email/avatar).
      // Admin uchun esa "orgStaff" ro'yxatidagi (yoki uning
      // yo'qligida session.user'dagi) yozuv ishlatiladi.
      const effectiveUser = session.role === "ceo"
        ? session.user
        : (orgStaff.find((s) => s.id === session.user.id) || session.user);

        setSending(true);

    function HighlightablePassage({ text }) {
      const [highlights, setHighlights] = useState([]); // array of {id,start,end}
      const [selBtn, setSelBtn] = useState(null); // {x,y,start,end} floating "Highlight" button
      const containerRef = useRef(null);

      const getOffsets = (range) => {
        const pre = range.cloneRange();
        pre.selectNodeContents(containerRef.current);
        pre.setEnd(range.startContainer, range.startOffset);
        const start = pre.toString().length;
        const end = start + range.toString().length;
        return { start, end };
      };

      const handleMouseUp = () => {
        const sel = window.getSelection();
        if (!sel || sel.isCollapsed || !containerRef.current) { setSelBtn(null); return; }
        const range = sel.getRangeAt(0);
        if (!containerRef.current.contains(range.commonAncestorContainer)) { setSelBtn(null); return; }
        const { start, end } = getOffsets(range);
        if (end <= start) { setSelBtn(null); return; }
        const rect = range.getBoundingClientRect();
        const cRect = containerRef.current.getBoundingClientRect();
        setSelBtn({ x: rect.left - cRect.left + rect.width / 2, y: rect.top - cRect.top, start, end });
      };

      const applyHighlight = () => {
        if (!selBtn) return;
        const { start, end } = selBtn;
        setHighlights((h) => [
          ...h.filter((x) => end <= x.start || start >= x.end),
          { id: uid("hl"), start, end },
        ]);
        setSelBtn(null);
        window.getSelection().removeAllRanges();
      };

      const removeHighlight = (id) => setHighlights((h) => h.filter((x) => x.id !== id));

      const segments = useMemo(() => {
        const points = new Set([0, text.length]);
        highlights.forEach((h) => { points.add(h.start); points.add(h.end); });
        const sorted = [...points].sort((a, b) => a - b);
        const segs = [];
        for (let i = 0; i < sorted.length - 1; i++) {
          const s = sorted[i], e = sorted[i + 1];
          const hi = highlights.find((h) => s >= h.start && e <= h.end);
          segs.push({ text: text.slice(s, e), hiId: hi ? hi.id : null });
        }
        return segs;
      }, [text, highlights]);

      return (
        <div>
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <Icon name="highlighter" size={14} style={{ color: C.gold }} />
            <span className="text-[12px] font-medium" style={{ color: C.mutedSoft }}>Tanlang → "Belgilash" tugmasini bosing. O'chirish uchun belgilangan joyga bosing.</span>
            {highlights.length > 0 && (
              <button onClick={() => setHighlights([])} className="text-[11.5px] font-semibold ml-auto" style={{ color: C.teal }}>Barchasini tozalash</button>
            )}
          </div>
          <div
            ref={containerRef}
            onMouseUp={handleMouseUp}
            onTouchEnd={handleMouseUp}
            className="relative text-[14.5px] leading-[1.8] rounded-xl p-4 select-text"
            style={{ backgroundColor: C.paper, border: `1px solid ${C.borderSoft}`, color: C.text }}
          >
            {segments.map((s, i) => (
              s.hiId ? (
                <span
                  key={i}
                  onClick={() => removeHighlight(s.hiId)}
                  title="O'chirish uchun bosing"
                  className="cursor-pointer"
                  style={{ backgroundColor: C.highlightBg, color: C.highlightText, borderRadius: "2px" }}
                >{s.text}</span>
              ) : (
                <span key={i}>{s.text}</span>
              )
            ))}
            {selBtn && (
              <button
                onMouseDown={(e) => { e.preventDefault(); applyHighlight(); }}
                className="absolute z-10 flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-[12px] font-semibold shadow-lg"
                style={{ left: selBtn.x, top: Math.max(0, selBtn.y - 36), transform: "translateX(-50%)", backgroundColor: C.ink, color: "#fff" }}
              >
                <Icon name="highlighter" size={12} color={C.gold} /> Belgilash
              </button>
            )}
          </div>
        </div>
      );
    }

    /* On-screen scratch pad — like the "Notepad" tool on the real CD IELTS
       exam interface. Content is per-attempt only; it is never scored or
       submitted with the answers. */
    function ExamNotepad({ value, onChange, onClose }) {
      return (
        <div className="fixed bottom-5 right-5 z-40 w-[320px] max-w-[92vw] rounded-2xl shadow-2xl flex flex-col overflow-hidden" style={{ backgroundColor: C.card, border: `1px solid ${C.border}`, height: 300 }}>
          <div className="flex items-center justify-between px-4 py-2.5 shrink-0" style={{ borderBottom: `1px solid ${C.borderSoft}`, backgroundColor: C.paperDim }}>
            <div className="flex items-center gap-2 text-[13px] font-semibold" style={{ color: C.ink }}>
              <Icon name="note-sticky" size={14} style={{ color: C.gold }} /> Qoralama
            </div>
            <button onClick={onClose}><Icon name="xmark" size={15} style={{ color: C.mutedSoft }} /></button>
          </div>
          <textarea
            value={value}
            onChange={(e) => onChange(e.target.value)}
            placeholder="Bu yerga qoralama yozishingiz mumkin — bu javob sifatida topshirilmaydi..."
            className="flex-1 w-full p-3 text-[13.5px] outline-none resize-none"
            style={{ backgroundColor: C.paper, color: C.text }}
          />
        </div>
      );
    }

    /* Real CD IELTS'dagi kabi bo'lim tavsifi — Part 1 info box uchun */
    function sectionInstructionText(key, count) {
      if (key === "writing") return `Ushbu vazifaga taxminan 20 daqiqa sarflang. Kamida ${count} so'z yozing.`;
      const range = count > 1 ? `1 - ${count}` : "1";
      if (key === "listening") return `Audioni tinglang va ${range}-savollarga javob bering.`;
      if (key === "reading") return `Matnni o'qing va ${range}-savollarga javob bering.`;
      if (key === "vocabulary") return `${range}-savollarga javob bering.`;
      return "";
    }

    /* Pastki savol-raqamlari navigatori — haqiqiy CD IELTS interfeysidagi kabi,
       har bir savolga bosib to'g'ridan-to'g'ri o'sha savolga sakrash mumkin. */
    /* Bitta savolga javob berilganmi — text turdagi savollarda bo'sh matn hisobga olinmaydi. */
    function hasAnswer(q, given) {
      if (q.answerType === "text") {
        const blanks = (q.parts || []).filter((p) => p.type === "blank");
        if (blanks.length) {
          const g = given && typeof given === "object" ? given : {};
          return blanks.some((b) => (g[b.id] || "").toString().trim() !== "");
        }
        return typeof given === "string" && given.trim() !== "";
      }
      if (q.answerType === "multi") return Array.isArray(given) && given.length > 0;
      return given != null;
    }

    function QuestionNavigator({ sectionKey, questions, answers, flagged, onJump }) {
      if (!questions || !questions.length) return null;
      return (
        <div className="fixed bottom-0 left-0 right-0 z-20 px-4 md:px-8 py-2.5 flex items-center gap-3" style={{ backgroundColor: C.card, borderTop: `1px solid ${C.border}`, boxShadow: "0 -2px 10px rgba(0,0,0,0.06)" }}>
          <span className="text-[12px] font-semibold shrink-0 hidden sm:inline" style={{ color: C.mutedSoft }}>{sectionLabel(sectionKey)}</span>
          <div className="flex items-center gap-1.5 overflow-x-auto">
            {questions.map((q, i) => {
              const answered = !!(answers && hasAnswer(q, answers[q.id]));
              const isFlagged = !!(flagged && flagged[`${sectionKey}:${q.id}`]);
              return (
                <button
                  key={q.id}
                  onClick={() => onJump(q.id)}
                  title={`${i + 1}-savolga o'tish`}
                  className="relative w-8 h-8 rounded-lg text-[12px] font-bold flex items-center justify-center shrink-0"
                  style={{
                    backgroundColor: answered ? C.tealSoft : C.paperDim,
                    color: answered ? C.tealDeep : C.mutedSoft,
                    border: `1.5px solid ${answered ? C.teal : C.borderSoft}`,
                  }}
                >
                  {i + 1}
                  {isFlagged && <span className="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full" style={{ backgroundColor: C.gold }} />}
                </button>
              );
            })}
          </div>
          <span className="text-[11.5px] shrink-0 ml-auto hidden md:inline" style={{ color: C.mutedSoft }}>
            {questions.filter((q) => answers && hasAnswer(q, answers[q.id])).length}/{questions.length} javob berildi
          </span>
        </div>
      );
    }

    function MCQBlock({ sectionKey, questions, answers, setAnswers, flagged, onToggleFlag }) {
      return (
        <div className="space-y-4">
          {(questions || []).map((q, i) => {
            const flagKey = `${sectionKey}:${q.id}`;
            const isFlagged = !!(flagged && flagged[flagKey]);
            return (
              <div key={q.id} id={`q-${sectionKey}-${q.id}`}>
                <div className="flex items-start justify-between gap-2 mb-2">
                  <div className="text-[13.5px] font-semibold" style={{ color: C.text }}>
                    {i + 1}.{q.q ? ` ${q.q}` : ""}
                    {q.answerType === "multi" && <span className="ml-1.5 text-[11px] font-normal italic" style={{ color: C.mutedSoft }}>(bir nechta javobni tanlang)</span>}
                  </div>
                  {onToggleFlag && (
                    <button onClick={() => onToggleFlag(sectionKey, q.id)} title="Keyinroq qaytish uchun belgilash" className="shrink-0 p-1 -mt-1 -mr-1">
                      <Icon name="flag" size={14} style={{ color: isFlagged ? C.gold : C.borderSoft }} />
                    </button>
                  )}
                </div>
                <div className="space-y-1.5">
                  {q.answerType === "text" ? (
                    q.parts && q.parts.some((p) => p.type === "blank") ? (
                      <div className="flex flex-wrap items-center gap-x-1.5 gap-y-2 text-[14px] leading-loose" style={{ color: C.text }}>
                        {q.parts.map((p, pi) => p.type === "blank" ? (
                          <input
                            key={p.id}
                            value={(answers[q.id] && answers[q.id][p.id]) || ""}
                            onChange={(e) => setAnswers((a) => ({ ...a, [q.id]: { ...(a[q.id] || {}), [p.id]: clampToSingleWord(e.target.value, p.correct) } }))}
                            className="inline-block rounded-md px-2 py-1 text-[13.5px] outline-none text-center"
                            style={{
                              width: 130,
                              border: `1.5px solid ${((answers[q.id] || {})[p.id] || "").trim() ? C.teal : C.border}`,
                              backgroundColor: ((answers[q.id] || {})[p.id] || "").trim() ? C.tealSoft : C.paper,
                              color: C.text,
                            }}
                          />
                        ) : (
                          <span key={pi} style={{ whiteSpace: "pre-wrap" }}>{p.value}</span>
                        ))}
                      </div>
                    ) : (
                      <input
                        value={answers[q.id] || ""}
                        onChange={(e) => setAnswers((a) => ({ ...a, [q.id]: clampToSingleWord(e.target.value, q.correctText) }))}
                        placeholder="Javobingizni shu yerga yozing..."
                        className="w-full rounded-lg text-[13.5px] outline-none px-3 py-2.5 transition-colors"
                        style={{ border: `1.5px solid ${(answers[q.id] || "").trim() ? C.teal : C.border}`, backgroundColor: (answers[q.id] || "").trim() ? C.tealSoft : C.paper, color: C.text }}
                      />
                    )
                  ) : q.answerType === "multi" ? (
                    q.options.map((o, idx) => {
                      const given = Array.isArray(answers[q.id]) ? answers[q.id] : [];
                      const checked = given.includes(idx);
                      const toggle = () => setAnswers((a) => {
                        const cur = Array.isArray(a[q.id]) ? a[q.id] : [];
                        const next = checked ? cur.filter((v) => v !== idx) : [...cur, idx];
                        return { ...a, [q.id]: next };
                      });
                      return (
                        <label key={idx} className="flex items-center gap-2 px-3 py-2 rounded-lg cursor-pointer text-[13.5px]" style={{ backgroundColor: checked ? C.tealSoft : C.paper, border: `1px solid ${checked ? C.teal : C.borderSoft}`, color: C.text }}>
                          <input type="checkbox" checked={checked} onChange={toggle} />
                          {o}
                        </label>
                      );
                    })
                  ) : (
                    q.options.map((o, idx) => (
                      <label key={idx} className="flex items-center gap-2 px-3 py-2 rounded-lg cursor-pointer text-[13.5px]" style={{ backgroundColor: answers[q.id] === idx ? C.tealSoft : C.paper, border: `1px solid ${answers[q.id] === idx ? C.teal : C.borderSoft}`, color: C.text }}>
                        <input type="radio" checked={answers[q.id] === idx} onChange={() => setAnswers((a) => ({ ...a, [q.id]: idx }))} />
                        {o}
                      </label>
                    ))
                  )}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    /* Review screen shown after the last section — mirrors the real CD IELTS
       "Review" page: a question palette per section (answered / unanswered /
       flagged) that the candidate can jump back into before final submit. */
    function ExamReview({ exam, sectionKeys, answers, writingText, flagged, onJump, onSubmit, submitting }) {
      return (
        <div className="space-y-4">
          <div className="flex items-center gap-2 mb-1">
            <Icon name="list-check" size={18} style={{ color: C.teal }} />
            <h2 className="f-display text-[22px] font-semibold" style={{ color: C.ink }}>Qayta ko'rib chiqish</h2>
          </div>
          <p className="text-[13px] mb-2" style={{ color: C.muted }}>Topshirishdan oldin javoblaringizni tekshiring. Oltin nuqta — belgilangan (flag) savol. Raqamga bosib savolga qayting.</p>

          {sectionKeys.map((key) => {
            if (key === "writing") {
              const writing = normalizeWriting(exam.sections.writing);
              const wc1 = (writingText.task1 || "").trim().split(/\s+/).filter(Boolean).length;
              const wc2 = (writingText.task2 || "").trim().split(/\s+/).filter(Boolean).length;
              return (
                <Card key={key}>
                  <div className="flex items-center justify-between mb-2">
                    <div className="flex items-center gap-2 font-semibold text-[14px]" style={{ color: C.ink }}>
                      <Icon name={sectionIcon(key)} size={15} style={{ color: C.teal }} /> {sectionLabel(key)}
                    </div>
                  </div>
                  <div className="flex flex-wrap gap-2">
                    <Badge tone={wc1 >= writing.task1.minWords ? "success" : "danger"}>Task 1: {wc1} / {writing.task1.minWords} so'z</Badge>
                    <Badge tone={wc2 >= writing.task2.minWords ? "success" : "danger"}>Task 2: {wc2} / {writing.task2.minWords} so'z</Badge>
                  </div>
                  <button onClick={() => onJump(key)} className="text-[12.5px] font-semibold mt-2" style={{ color: C.teal }}>O'zgartirish</button>
                </Card>
              );
            }
            const qs = flattenSectionQuestions(exam, key);
            const answeredCount = qs.filter((q) => answers[key] && hasAnswer(q, answers[key][q.id])).length;
            return (
              <Card key={key}>
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center gap-2 font-semibold text-[14px]" style={{ color: C.ink }}>
                    <Icon name={sectionIcon(key)} size={15} style={{ color: C.teal }} /> {sectionLabel(key)}
                  </div>
                  <span className="text-[12px]" style={{ color: C.mutedSoft }}>{answeredCount}/{qs.length} javob berilgan</span>
                </div>
                <div className="flex flex-wrap gap-1.5">
                  {qs.map((q, i) => {
                    const answered = answers[key] && hasAnswer(q, answers[key][q.id]);
                    const isFlagged = !!flagged[`${key}:${q.id}`];
                    return (
                      <button
                        key={q.id}
                        onClick={() => onJump(key)}
                        className="w-8 h-8 rounded-lg text-[12px] font-bold flex items-center justify-center relative"
                        style={{
                          backgroundColor: answered ? C.tealSoft : C.paperDim,
                          color: answered ? C.tealDeep : C.mutedSoft,
                          border: `1.5px solid ${answered ? C.teal : C.borderSoft}`,
                        }}
                      >
                        {i + 1}
                        {isFlagged && <span className="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full" style={{ backgroundColor: C.gold }} />}
                      </button>
                    );
                  })}
                  {!qs.length && <span className="text-[12px]" style={{ color: C.mutedSoft }}>Savollar yo'q</span>}
                </div>
              </Card>
            );
          })}

          <div className="flex justify-end pt-1">
            <Button variant="gold" onClick={onSubmit} loading={submitting} icon="paper-plane">Yakunlash va topshirish</Button>
          </div>
        </div>
      );
    }

    /* Default section durations (minutes) used when an exam doesn't specify
       its own — mirrors the real IELTS CD test's per-section timing. */
    const DEFAULT_SECTION_MINUTES = { listening: 30, reading: 60, writing: 60, vocabulary: 10 };
    const FONT_SCALES = [0.9, 1, 1.1, 1.25];

    function fmtClock(totalSeconds) {
      const s = Math.max(0, totalSeconds);
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
    }

    function ExamRunner({ exam, student, onExit, onSubmit, toast }) {
      const sectionKeys = useMemo(() => Object.entries(exam.sections).filter(([, v]) => v.enabled).map(([k]) => k), [exam]);

      /* Avvalgi (tugallanmagan) urinish bormi — endi backend'dagi ExamAttempt
         orqali tekshiriladi (examApi.start: mavjud bo'lsa qaytaradi, bo'lmasa
         yangisini yaratadi). Shu tufayli sahifa qayta yuklansa (refresh),
         tab yopilib qaytadan ochilsa yoki boshqa qurilmadan kirilsa ham javoblar
         yo'qolmaydi va taymer noldan qayta boshlanmaydi. */
      const [loaded, setLoaded] = useState(false);
      const attemptIdRef = useRef(null);

      const [idx, setIdx] = useState(0); // 0..sectionKeys.length-1 = sections, sectionKeys.length = review
      const [answers, setAnswers] = useState({ listening: {}, reading: {}, vocabulary: {} });
      const [writingText, setWritingText] = useState({ task1: "", task2: "" });
      const [writingTask, setWritingTask] = useState(1); // 1 yoki 2 — Writing bo'limi ichidagi ikki task orasidagi tab
      const [flagged, setFlagged] = useState({});
      const [submitting, setSubmitting] = useState(false);
      const [notepadOpen, setNotepadOpen] = useState(false);
      const [notepadText, setNotepadText] = useState("");
      const [fontLevel, setFontLevel] = useState(1);
      const [confirmExit, setConfirmExit] = useState(false);
      const [sectionDeadlines, setSectionDeadlines] = useState({});

      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            const a = await examApi.start(exam.id);
            if (cancelled) return;
            attemptIdRef.current = a.id;
            setIdx(a.current_section_index || 0);
            setAnswers(a.answers && Object.keys(a.answers).length ? a.answers : { listening: {}, reading: {}, vocabulary: {} });
            setWritingText(a.writing_text && (a.writing_text.task1 !== undefined) ? a.writing_text : { task1: "", task2: "" });
            setWritingTask((a.progress_data && a.progress_data.writingTask) || 1);
            setFlagged(a.flagged || {});
            setNotepadText(a.notepad_text || "");
            setFontLevel(a.font_level != null ? a.font_level : 1);
            setSectionDeadlines(a.section_deadlines || {});
          } catch (e) {
            toast("error", "Imtihon holati yuklanmadi — internetni tekshiring");
          } finally {
            if (!cancelled) setLoaded(true);
          }
        })();
        return () => { cancelled = true; };
      }, [exam.id]); // eslint-disable-line

      /* Har bir bo'lim uchun "tugash vaqti" — absolute Unix timestamp (ms).
         MUHIM: bo'limga birinchi marta kirilganda o'rnatiladi va keyin
         o'sha bo'limga qayta kirilsa (Oldingi/Keyingi tugmalari yoki
         "Qayta ko'rib chiqish" sahifasidan qaytish orqali) QAYTA
         O'RNATILMAYDI — aks holda foydalanuvchi bo'limlar orasida oldinga-orqaga
         yurib, har safar to'liq yangi vaqt olib, taymerni cheksiz uzaytirishi
         mumkin bo'lar edi. */
      const isReview = idx >= sectionKeys.length;
      const currentKey = sectionKeys[idx];

      const toggleFlag = (sectionKey, qid) => {
        const key = `${sectionKey}:${qid}`;
        setFlagged((f) => ({ ...f, [key]: !f[key] }));
      };

      const goNext = useCallback(() => setIdx((i) => Math.min(i + 1, sectionKeys.length)), [sectionKeys.length]);

      const scoreSection = (key) => {
        const qs = flattenSectionQuestions(exam, key);
        if (!qs.length) return null;
        const correct = qs.filter((q) => isAnswerCorrect(q, answers[key][q.id])).length;
        return Math.round((correct / qs.length) * 100);
      };

      /* Bitta bo'lim uchun raw ball (nechta savoldan nechtasi to'g'ri) — natijalar
         sahifasida "Listening: 32/40" kabi ko'rsatish uchun. */
      const rawSection = (key) => {
        const qs = flattenSectionQuestions(exam, key);
        if (!qs.length) return null;
        const correct = qs.filter((q) => isAnswerCorrect(q, answers[key][q.id])).length;
        return { correct, total: qs.length };
      };

      /* Bo'lim savollarining to'liq "review" nusxasi — mock topshirilgan paytdagi
         holatda saqlanadi (savol matni/variantlari), shunda keyinchalik exam
         tahrirlansa ham o'quvchining o'sha vaqtdagi natijasi o'zgarmay qoladi. */
      const reviewSection = (key) => {
        const qs = flattenSectionQuestions(exam, key);
        return qs.map((q, i) => {
          const given = answers[key][q.id];
          return {
            id: q.id,
            index: i + 1,
            text: q.q || "",
            answerType: q.answerType || "mcq",
            options: q.options || null,
            parts: q.parts || null,
            given,
            answered: isQuestionAnswered(q, given),
            isCorrect: isAnswerCorrect(q, given),
          };
        });
      };

      const buildProgressPayload = () => ({
        current_section_index: idx,
        answers,
        writing_text: writingText,
        flagged,
        notepad_text: notepadText,
        font_level: fontLevel,
        section_deadlines: sectionDeadlines,
        progress_data: { writingTask },
      });

      const submit = async () => {
        setSubmitting(true);
        const listeningPct = scoreSection("listening");
        const readingPct = scoreSection("reading");
        const vocabPct = scoreSection("vocabulary");
        /* Listening/Reading — rasmiy IELTS band konversiya jadvali (Reading uchun
           Academic/General Training turiga qarab alohida jadval) asosida hisoblanadi. */
        const listeningBand = listeningPct != null ? rawToBandFromTable(listeningPct, 100, LISTENING_BAND_TABLE) : null;
        const readingBand = readingPct != null ? rawToBandFromTable(readingPct, 100, readingBandTable(exam.examType)) : null;
        const vocabBand = vocabPct != null ? pctToBand(vocabPct) : null;
        const bands = [listeningBand, readingBand, vocabBand].filter((b) => b != null);
        const overallBand = bands.length ? Math.round((bands.reduce((a, b) => a + b, 0) / bands.length) * 2) / 2 : null;
        const hasWriting = exam.sections.writing?.enabled;

        const reviewListening = reviewSection("listening");
        const reviewReading = reviewSection("reading");
        const reviewVocab = reviewSection("vocabulary");
        const allReview = [...reviewListening, ...reviewReading, ...reviewVocab];
        const correctCount = allReview.filter((q) => q.isCorrect).length;
        const unansweredCount = allReview.filter((q) => !q.answered).length;
        const wrongCount = allReview.length - correctCount - unansweredCount;
        const accuracy = allReview.length ? Math.round((correctCount / allReview.length) * 100) : null;

        const result = {
          id: uid("res"), studentId: student.id, examId: exam.id, attemptId: attemptIdRef.current, submittedAt: Date.now(),
          examType: exam.examType || "academic",
          examTitle: exam.title,
          sectionScores: { listening: listeningPct, reading: readingPct, vocabulary: vocabPct },
          sectionBands: { listening: listeningBand, reading: readingBand, vocabulary: vocabBand },
          sectionRaw: { listening: rawSection("listening"), reading: rawSection("reading"), vocabulary: rawSection("vocabulary") },
          review: { listening: reviewListening, reading: reviewReading, vocabulary: reviewVocab },
          stats: { correctCount, wrongCount, unansweredCount, totalQuestions: allReview.length, accuracy },
          writingText: hasWriting ? writingText : { task1: "", task2: "" },
          writingStatus: hasWriting ? "pending_review" : "n/a",
          overallBand,
        };
        try {
          /* Attempt'ni backend'da "submitted" deb belgilaymiz — shu bilan
             keyingi safar shu examga kirilsa yangi urinish boshlanadi. */
          await examApi.submit(exam.id, buildProgressPayload());
        } catch (e) { /* natija baribir saqlanaveradi — kritik emas */ }
        await onSubmit(result);
        setSubmitting(false);
        toast("success", "Mock exam topshirildi!");
        onExit();
      };

      /* Per-section countdown — bo'limga birinchi kirilganda "tugash vaqti"
         (deadline) o'rnatiladi va (debounce bilan) backend'ga saqlanadi; qolgan vaqt shu
         deadline bilan HAQIQIY vaqt (Date.now()) orasidagi farq sifatida
         hisoblanadi. Bu, oldingi setTimeout-tick usulidan farqli o'laroq:
         - brauzer tab fon rejimida sekinlashtirilganda (throttling) yoki
           foydalanuvchi boshqa tabga o'tib qaytganda ham to'g'ri vaqtni ko'rsatadi;
         - sahifa refresh qilinganda ham to'g'ri tiklanadi (deadline o'zgarmaydi);
         - bo'limlar orasida oldinga-orqaga yurib taymerni "resetlab" cheksiz
           vaqt olishning oldini oladi (deadline faqat bo'limga BIRINCHI marta
           kirilganda o'rnatiladi). */
      const sectionMinutes = !isReview ? (exam.sections[currentKey]?.durationMinutes || DEFAULT_SECTION_MINUTES[currentKey] || 15) : 0;
      const expiredRef = useRef(false);
      useEffect(() => {
        if (isReview) return;
        expiredRef.current = false;
        setSectionDeadlines((d) => (d[currentKey] ? d : { ...d, [currentKey]: Date.now() + sectionMinutes * 60000 }));
      }, [idx]); // eslint-disable-line

      const deadline = sectionDeadlines[currentKey];
      const [remaining, setRemaining] = useState(() => (deadline ? Math.max(0, Math.round((deadline - Date.now()) / 1000)) : sectionMinutes * 60));
      useEffect(() => {
        if (isReview || !deadline) return;
        const tick = () => {
          const rem = Math.max(0, Math.round((deadline - Date.now()) / 1000));
          setRemaining(rem);
          if (rem <= 0 && !expiredRef.current) {
            expiredRef.current = true;
            toast("error", `${sectionLabel(currentKey)} vaqti tugadi — keyingi bo'limga o'tildi`);
            goNext();
          }
        };
        tick();
        const t = setInterval(tick, 1000);
        return () => clearInterval(t);
      }, [isReview, deadline, currentKey]); // eslint-disable-line

      /* Autosave: javoblar, joriy bo'lim va bo'lim deadline'lari har o'zgarishda
         backend'ga (ExamAttempt) yoziladi — refresh/tab yopilish yoki boshqa
         qurilmadan kirish holatida ham hech narsa yo'qolmasligi va keyinroq
         "davom ettirish" mumkin bo'lishi uchun. Tez-tez (masalan har harf
         kiritilganda) so'rov yubormaslik uchun 1.2 soniyalik debounce bilan.
         Faqat topshirilganda (submit) yoki komponent almashtirilganda
         (endgame) so'nggi holat darhol yuboriladi. */
      const saveTimerRef = useRef(null);
      const latestStateRef = useRef(null);
      latestStateRef.current = buildProgressPayload();
      useEffect(() => {
        if (!loaded) return;
        if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
        saveTimerRef.current = setTimeout(() => {
          examApi.saveProgress(exam.id, latestStateRef.current).catch(() => { });
        }, 1200);
        return () => clearTimeout(saveTimerRef.current);
      }, [loaded, idx, answers, writingText, writingTask, flagged, notepadText, fontLevel, sectionDeadlines]); // eslint-disable-line

      /* Komponent yo'q qilinganda (chiqishda) so'nggi holatni darhol (debounce'siz)
         yuboramiz — aks holda oxirgi 1.2 soniyadagi o'zgarish yo'qolib qolishi mumkin. */
      useEffect(() => {
        return () => {
          if (loaded && latestStateRef.current) {
            examApi.saveProgress(exam.id, latestStateRef.current).catch(() => { });
          }
        };
      }, []); // eslint-disable-line

      /* Sahifani tasodifan yopish/yangilashdan ogohlantirish — javoblar endi
         saqlanib qolsa-da, taymer shu orada ham ishlashda davom etadi. */
      useEffect(() => {
        const onBeforeUnload = (e) => { e.preventDefault(); e.returnValue = ""; };
        window.addEventListener("beforeunload", onBeforeUnload);
        return () => window.removeEventListener("beforeunload", onBeforeUnload);
      }, []);

      const writing = normalizeWriting(exam.sections.writing);
      const countWords = (t) => (t || "").trim().split(/\s+/).filter(Boolean).length;
      const wordCount1 = countWords(writingText.task1);
      const wordCount2 = countWords(writingText.task2);
      const fontScale = FONT_SCALES[fontLevel];
      const timeLow = !isReview && remaining <= 60;

      if (!loaded) {
        return (
          <div className="min-h-screen flex items-center justify-center" style={{ backgroundColor: C.paper }}>
            {FONTS}
            <div className="flex flex-col items-center gap-3">
              <Icon name="spinner" size={26} className="fa-spin" style={{ color: C.ink }} />
              <div className="text-[13px] f-body" style={{ color: C.muted }}>Imtihon holati yuklanmoqda...</div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen" style={{ backgroundColor: C.paper }}>
          {FONTS}
          <div className="sticky top-0 z-20 px-4 md:px-8 py-3 flex items-center justify-between gap-3" style={{ backgroundColor: C.ink }}>
            <button onClick={() => setConfirmExit(true)} className="flex items-center gap-1.5 text-[13px] font-semibold text-white/80 shrink-0"><Icon name="arrow-left" size={15} /> <span className="hidden sm:inline">Chiqish</span></button>
            <div className="f-display text-[14px] md:text-[15px] font-semibold text-white truncate">{exam.title}</div>
            <div className="flex items-center gap-3 shrink-0">
              {!isReview && (
                <div className="flex items-center gap-1.5 px-2.5 py-1 rounded-lg f-mono text-[13px] font-bold" style={{ backgroundColor: timeLow ? "rgba(194,74,63,0.25)" : "rgba(255,255,255,0.08)", color: timeLow ? "#F2A8A0" : "#fff" }}>
                  <Icon name="clock" size={13} /> {fmtClock(remaining)}
                </div>
              )}
              <div className="hidden sm:flex gap-1">
                {sectionKeys.map((k, i) => (
                  <div key={k} className="w-2 h-2 rounded-full" style={{ backgroundColor: i === idx ? C.gold : i < idx || isReview ? C.teal : "rgba(255,255,255,0.25)" }} />
                ))}
                <div className="w-2 h-2 rounded-full" style={{ backgroundColor: isReview ? C.gold : "rgba(255,255,255,0.25)" }} />
              </div>
            </div>
          </div>

          {/* Toolbar: text size + notepad — mirrors the real CD IELTS on-screen tools */}
          <div className="sticky top-[52px] md:top-[56px] z-10 px-4 md:px-8 py-2 flex items-center justify-end gap-2" style={{ backgroundColor: `${C.paper}F5`, backdropFilter: "blur(6px)", borderBottom: `1px solid ${C.borderSoft}` }}>
            <div className="flex items-center gap-1 rounded-lg overflow-hidden" style={{ border: `1px solid ${C.border}` }}>
              <button onClick={() => setFontLevel((l) => Math.max(0, l - 1))} className="w-8 h-8 flex items-center justify-center text-[12px] font-bold" style={{ color: C.ink, backgroundColor: C.card }}>A-</button>
              <button onClick={() => setFontLevel((l) => Math.min(FONT_SCALES.length - 1, l + 1))} className="w-8 h-8 flex items-center justify-center text-[15px] font-bold" style={{ color: C.ink, backgroundColor: C.card, borderLeft: `1px solid ${C.border}` }}>A+</button>
            </div>
            <Button size="sm" variant={notepadOpen ? "teal" : "ghost"} icon="note-sticky" onClick={() => setNotepadOpen((o) => !o)}>Qoralama</Button>
          </div>

          <div className={(isReview ? "max-w-3xl mx-auto p-5 md:p-8" : "max-w-5xl mx-auto p-5 md:p-8") + (!isReview && currentKey !== "writing" ? " pb-24" : "")} style={{ fontSize: `${fontScale}em` }}>
            {!isReview && (
              <div className="flex items-center gap-2 mb-3">
                <Icon name={sectionIcon(currentKey)} size={18} style={{ color: C.teal }} />
                <h2 className="f-display text-[22px] font-semibold" style={{ color: C.ink }}>{sectionLabel(currentKey)}</h2>
              </div>
            )}
            {!isReview && (
              <div className="rounded-xl p-4 mb-5" style={{ backgroundColor: C.card, border: `1px solid ${C.borderSoft}` }}>
                <div className="font-semibold text-[14px] mb-1" style={{ color: C.ink }}>Part 1</div>
                <div className="text-[13px]" style={{ color: C.muted }}>
                  {sectionInstructionText(currentKey, currentKey === "writing" ? (writingTask === 1 ? writing.task1.minWords : writing.task2.minWords) : flattenSectionQuestions(exam, currentKey).length)}
                </div>
              </div>
            )}

            {isReview ? (
              <ExamReview
                exam={exam}
                sectionKeys={sectionKeys}
                answers={answers}
                writingText={writingText}
                flagged={flagged}
                onJump={(key) => setIdx(sectionKeys.indexOf(key))}
                onSubmit={submit}
                submitting={submitting}
              />
            ) : (
              <Card>
                {currentKey === "listening" && (
                  <div className="space-y-4">
                    {exam.sections.listening.audioUrl ? (
                      <div className="flex items-center gap-2 rounded-lg p-3" style={{ backgroundColor: C.paperDim }}>
                        <Icon name="volume-high" size={16} style={{ color: C.teal }} />
                        <audio controls src={exam.sections.listening.audioUrl} className="w-full" />
                        <a href={exam.sections.listening.audioUrl} download="listening-audio.mp3" title="Audioni yuklab olish" className="shrink-0 p-1.5 rounded-lg" style={{ color: C.teal }}>
                          <Icon name="download" size={15} />
                        </a>
                      </div>
                    ) : (
                      <div className="flex items-center gap-2 text-[13px] rounded-lg p-3" style={{ backgroundColor: C.paperDim, color: C.muted }}>
                        <Icon name="volume-high" size={16} /> Audio biriktirilmagan — matn asosida javob bering
                      </div>
                    )}
                    <p className="text-[13px]" style={{ color: C.muted }}>{exam.sections.listening.instructions}</p>
                    <MCQBlock sectionKey="listening" questions={flattenSectionQuestions(exam, "listening")} answers={answers.listening} setAnswers={(fn) => setAnswers((a) => ({ ...a, listening: fn(a.listening) }))} flagged={flagged} onToggleFlag={toggleFlag} />
                  </div>
                )}
                {currentKey === "reading" && (
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div className="lg:max-h-[65vh] lg:overflow-y-auto lg:pr-1">
                      <HighlightablePassage text={exam.sections.reading.passage} />
                    </div>
                    <div className="lg:max-h-[65vh] lg:overflow-y-auto lg:pl-5" style={{ borderLeft: `1px solid ${C.borderSoft}` }}>
                      <MCQBlock sectionKey="reading" questions={exam.sections.reading.questions} answers={answers.reading} setAnswers={(fn) => setAnswers((a) => ({ ...a, reading: fn(a.reading) }))} flagged={flagged} onToggleFlag={toggleFlag} />
                    </div>
                  </div>
                )}
                {currentKey === "writing" && (
                  <div className="space-y-4">
                    <div className="flex items-center gap-2">
                      {[1, 2].map((t) => (
                        <button
                          key={t}
                          onClick={() => setWritingTask(t)}
                          className="px-4 py-2 rounded-lg text-[13px] font-semibold transition-colors"
                          style={{
                            border: `1.5px solid ${writingTask === t ? C.teal : C.border}`,
                            backgroundColor: writingTask === t ? C.tealSoft : C.card,
                            color: writingTask === t ? C.tealDeep : C.muted,
                          }}
                        >
                          Task {t} {(t === 1 ? wordCount1 >= writing.task1.minWords : wordCount2 >= writing.task2.minWords) && <Icon name="circle-check" size={11} className="ml-1" style={{ color: C.success }} />}
                        </button>
                      ))}
                    </div>
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                      <div className="lg:max-h-[65vh] lg:overflow-y-auto lg:pr-1 space-y-3">
                        <div className="font-bold text-[13.5px] uppercase tracking-wide" style={{ color: C.ink }}>Writing Task {writingTask}</div>
                        <div className="text-[13.5px] whitespace-pre-wrap leading-relaxed" style={{ color: C.text }}>{writingTask === 1 ? writing.task1.prompt : writing.task2.prompt}</div>
                        {writingTask === 1 && writing.task1.imageUrl && (
                          <div className="space-y-1.5">
                            <img src={writing.task1.imageUrl} alt="Writing task" className="w-full rounded-lg" style={{ border: `1px solid ${C.borderSoft}` }} />
                            <a href={writing.task1.imageUrl} download={writing.task1.imageName || "writing-task.png"} className="inline-flex items-center gap-1.5 text-[12.5px] font-semibold" style={{ color: C.teal }}>
                              <Icon name="download" size={12} /> Rasmni yuklab olish
                            </a>
                          </div>
                        )}
                        <div className="text-[13px] font-semibold" style={{ color: C.ink }}>Kamida {writingTask === 1 ? writing.task1.minWords : writing.task2.minWords} so'z yozing.</div>
                      </div>
                      <div className="lg:max-h-[65vh] lg:pl-5 flex flex-col" style={{ borderLeft: `1px solid ${C.borderSoft}` }}>
                        <textarea
                          value={writingTask === 1 ? writingText.task1 : writingText.task2}
                          onChange={(e) => setWritingText((w) => ({ ...w, [writingTask === 1 ? "task1" : "task2"]: e.target.value }))}
                          rows={16}
                          placeholder="Javobingizni shu yerga yozing..."
                          className="w-full flex-1 rounded-lg text-[14px] outline-none resize-none p-3"
                          style={{ border: `1.5px solid ${C.border}`, backgroundColor: C.paper, color: C.text, minHeight: 320 }}
                        />
                        <div className="text-[12px] flex justify-between mt-2" style={{ color: (writingTask === 1 ? wordCount1 < writing.task1.minWords : wordCount2 < writing.task2.minWords) ? C.danger : C.success }}>
                          <span>Qo'lda baholanadi</span>
                          <span>Words: {writingTask === 1 ? wordCount1 : wordCount2}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
                {currentKey === "vocabulary" && (
                  <MCQBlock sectionKey="vocabulary" questions={exam.sections.vocabulary.questions} answers={answers.vocabulary} setAnswers={(fn) => setAnswers((a) => ({ ...a, vocabulary: fn(a.vocabulary) }))} flagged={flagged} onToggleFlag={toggleFlag} />
                )}
              </Card>
            )}

            {!isReview && (
              <div className="flex items-center justify-between mt-5">
                <Button variant="ghost" disabled={idx === 0} onClick={() => setIdx((i) => i - 1)}>Oldingi</Button>
                <Button onClick={goNext} icon="chevron-right">
                  {idx < sectionKeys.length - 1
                    ? (sectionKeys[idx + 1] === "writing" ? "Yozishga o'tish" : "Keyingi bo'lim")
                    : "Yakunlash"}
                </Button>
              </div>
            )}
          </div>

          {!isReview && currentKey !== "writing" && (
            <QuestionNavigator
              sectionKey={currentKey}
              questions={flattenSectionQuestions(exam, currentKey)}
              answers={answers[currentKey]}
              flagged={flagged}
              onJump={(qid) => {
                const el = document.getElementById(`q-${currentKey}-${qid}`);
                if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
              }}
            />
          )}

          {notepadOpen && <ExamNotepad value={notepadText} onChange={setNotepadText} onClose={() => setNotepadOpen(false)} />}

          {confirmExit && (
            <ConfirmDialog
              title="Mock exam'dan chiqish"
              message="Javoblaringiz saqlanadi va keyinroq shu joydan davom ettirishingiz mumkin bo'ladi. Baribir chiqasizmi?"
              danger={false}
              onConfirm={() => { setConfirmExit(false); onExit(); }}
              onCancel={() => setConfirmExit(false)}
            />
          )}
        </div>
      );
    }

    /* ============================================================
       STUDENT DASHBOARD
       ============================================================ */
    function StudentOverview({ student, group, exams, assignments, results, onGoExams, onGoAssignments }) {
      const { theme } = useContext(ThemeContext);
      const dark = theme === "dark";
      const myExams = exams.filter((e) => e.status === "on" && e.assignedGroupIds.includes(student.groupId));
      const myResults = results.filter((r) => r.studentId === student.id);
      const avg = myResults.filter((r) => r.overallBand != null);
      const avgBand = avg.length ? avg.reduce((a, b) => a + b.overallBand, 0) / avg.length : null;
      const myAssignments = assignments.filter((a) => assignmentTargetsStudent(a, student));
      const unseen = myAssignments.filter((a) => !a.viewedBy.includes(student.id));

      return (
        <div className="space-y-6">
          <Card className="flex flex-col md:flex-row items-center gap-6" style={{ backgroundColor: dark ? "#e8933c" : C.ink }}>
            <div>
              <div className={dark ? "text-[13px]" : "text-[13px] text-white/60"} style={dark ? { color: "#12161f", opacity: 0.7 } : {}}>Xush kelibsiz,</div>
              <div className={dark ? "f-display text-[24px] font-semibold" : "f-display text-[24px] font-semibold text-white"} style={dark ? { color: "#12161f" } : {}}>{student.name}</div>
              <div className={dark ? "text-[12.5px] mt-1" : "text-[12.5px] text-white/50 mt-1"} style={dark ? { color: "#12161f", opacity: 0.6 } : {}}>{group?.name}</div>
            </div>
            <div className="md:ml-auto flex gap-6">
              <div className="text-center">
                <div className={dark ? "f-mono text-[26px] font-bold" : "f-mono text-[26px] font-bold text-white"} style={dark ? { color: "#12161f" } : {}}>{myExams.length}</div>
                <div className={dark ? "text-[11px]" : "text-[11px] text-white/50"} style={dark ? { color: "#12161f", opacity: 0.6 } : {}}>Faol exam</div>
              </div>
              <div className="text-center">
                <div className="f-mono text-[26px] font-bold" style={{ color: dark ? "#12161f" : C.gold }}>{unseen.length}</div>
                <div className={dark ? "text-[11px]" : "text-[11px] text-white/50"} style={dark ? { color: "#12161f", opacity: 0.6 } : {}}>Yangi vazifa</div>
              </div>
            </div>
          </Card>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
            <Card className="md:col-span-1 flex flex-col items-center">
              <div className="text-[12px] font-semibold uppercase tracking-wide mb-2" style={{ color: C.mutedSoft }}>Sizning band scoreingiz</div>
              <BandDial value={avgBand} size={140} label="O'rtacha band" />
            </Card>
            <Card className="md:col-span-2">
              <div className="flex items-center justify-between mb-3">
                <div className="font-semibold text-[15px] f-display" style={{ color: C.ink }}>Mock examlar</div>
                <button onClick={onGoExams} className="text-[12.5px] font-semibold" style={{ color: C.teal }}>Barchasini ko'rish</button>
              </div>
              <div className="space-y-2">
                {myExams.slice(0, 3).map((e) => (
                  <div key={e.id} className="flex items-center justify-between py-1.5">
                    <span className="text-[13.5px]" style={{ color: C.text }}>{e.title}</span>
                    <Badge tone="success">Ochiq</Badge>
                  </div>
                ))}
                {!myExams.length && <EmptyState icon="book-open" title="Hozircha faol exam yo'q" />}
              </div>
            </Card>
          </div>

          <Card>
            <div className="flex items-center justify-between mb-3">
              <div className="font-semibold text-[15px] f-display" style={{ color: C.ink }}>Yangi vazifalar</div>
              <button onClick={onGoAssignments} className="text-[12.5px] font-semibold" style={{ color: C.teal }}>Barchasini ko'rish</button>
            </div>
            <div className="space-y-2">
              {unseen.slice(0, 3).map((a) => (
                <div key={a.id} className="flex items-center gap-2 py-1.5">
                  <Icon name="bell" size={13} style={{ color: C.gold }} />
                  <span className="text-[13.5px]" style={{ color: C.text }}>{a.title}</span>
                </div>
              ))}
              {!unseen.length && <EmptyState icon="clipboard-list" title="Yangi vazifalar yo'q" />}
            </div>
          </Card>
        </div>
      );
    }

    function StudentExams({ student, exams, results, onStart }) {
      const myExams = exams.filter((e) => e.assignedGroupIds.includes(student.groupId));
      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          {myExams.map((e) => {
            const attempted = results.find((r) => r.studentId === student.id && r.examId === e.id && (!e.reopenedAt || r.submittedAt > e.reopenedAt));
            const open = e.status === "on";
            return (
              <Card key={e.id}>
                <div className="flex items-center gap-2">
                  <div className="font-semibold text-[15.5px] f-display" style={{ color: C.ink }}>{e.title}</div>
                  <Badge tone={open ? "success" : "muted"}>{open ? "Ochiq" : "Yopiq"}</Badge>
                </div>
                <div className="flex items-center gap-3 mt-3 flex-wrap">
                  {Object.entries(e.sections).filter(([, v]) => v.enabled).map(([k]) => {
                    return <span key={k} className="flex items-center gap-1 text-[12px]" style={{ color: C.muted }}><Icon name={sectionIcon(k)} size={13} /> {sectionLabel(k)}</span>;
                  })}
                </div>
                <div className="mt-4">
                  {attempted ? (
                    <Badge tone="gold">Topshirilgan · Band {attempted.overallBand ?? "—"}</Badge>
                  ) : open ? (
                    <Button size="sm" onClick={() => onStart(e)} icon="chevron-right">Boshlash</Button>
                  ) : (
                    <span className="text-[12.5px]" style={{ color: C.mutedSoft }}>Admin tomonidan yopilgan</span>
                  )}
                </div>
              </Card>
            );
          })}
          {!myExams.length && <div className="col-span-full"><EmptyState icon="book-open" title="Sizga biriktirilgan exam yo'q" /></div>}
        </div>
      );
    }

    function StudentAssignments({ student, assignments, onView }) {
      const [filter, setFilter] = useState("all");
      const mine = assignments.filter((a) => assignmentTargetsStudent(a, student));
      const filtered = mine.filter((a) => (filter === "all" ? true : filter === "seen" ? a.viewedBy.includes(student.id) : !a.viewedBy.includes(student.id)));

      return (
        <div className="space-y-4">
          <div className="flex justify-end">
            <Select value={filter} onChange={setFilter} options={[{ value: "all", label: "Barchasi" }, { value: "seen", label: "Ko'rilgan" }, { value: "unseen", label: "Ko'rilmagan" }]} />
          </div>
          <div className="space-y-3">
            {filtered.map((a) => {
              const seen = a.viewedBy.includes(student.id);
              return (
                <Card key={a.id} className="cursor-pointer" style={!seen ? { borderColor: C.gold } : {}}>
                  <div onClick={() => onView(a)} className="flex items-start gap-3">
                    <div className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style={{ backgroundColor: C.tealSoft }}>
                      <Icon name={assignmentBadge(a).icon} size={16} style={{ color: C.teal }} />
                    </div>
                    <div className="min-w-0 flex-1">
                      <div className="flex items-center gap-2">
                        <div className="font-semibold text-[14.5px]" style={{ color: C.text }}>{a.title}</div>
                        {!seen && <Badge tone="gold">Yangi</Badge>}
                      </div>
                      <div className="text-[12px] mt-0.5" style={{ color: C.mutedSoft }}>{fmtDate(a.createdAt)}</div>
                    </div>
                  </div>
                </Card>
              );
            })}
            {!filtered.length && <EmptyState icon="clipboard-list" title="Vazifalar topilmadi" />}
          </div>
        </div>
      );
    }

    function AssignmentViewModal({ a, onClose }) {
      const legacyAudio = !a.fileUrl && a.type === "listening" && a.content;
      const hasFile = !!a.fileUrl;
      const kind = fileKindMeta(a.fileMime);
      return (
        <Modal title={a.title} onClose={onClose} width="560px">
          {legacyAudio ? (
            <div className="rounded-lg p-4 mb-3 space-y-2" style={{ backgroundColor: C.paperDim }}>
              <div className="flex items-center gap-2 mb-2">
                <Icon name="headphones" size={15} style={{ color: C.teal }} />
                <span className="text-[13px] font-semibold" style={{ color: C.text }}>Audio yozuv</span>
              </div>
              <audio controls src={a.content} className="w-full" />
              <a href={a.content} download={a.title ? `${a.title}.mp3` : "audio.mp3"} className="inline-flex items-center gap-1.5 text-[13px] font-semibold" style={{ color: C.teal }}>
                <Icon name="download" size={12} /> Audioni yuklab olish
              </a>
            </div>
          ) : hasFile ? (
            <div className="rounded-lg p-4 mb-3 space-y-2" style={{ backgroundColor: C.paperDim }}>
              <div className="flex items-center gap-2 min-w-0">
                <Icon name={kind.icon} size={15} style={{ color: C.teal }} />
                <span className="text-[13px] font-semibold truncate" style={{ color: C.text }}>{a.fileName || kind.label}</span>
              </div>
              {a.fileMime && a.fileMime.startsWith("image/") && (
                <img src={a.fileUrl} alt={a.fileName} className="w-full max-h-64 object-contain rounded-md" style={{ backgroundColor: C.card }} />
              )}
              {a.fileMime && a.fileMime.startsWith("audio/") && <audio controls src={a.fileUrl} className="w-full" />}
              <a href={a.fileUrl} download={a.fileName || "fayl"} className="inline-flex items-center gap-1.5 text-[13px] font-semibold" style={{ color: C.teal }}>
                <Icon name="download" size={12} /> {a.fileMime && a.fileMime.startsWith("audio/") ? "Audioni" : a.fileMime && a.fileMime.startsWith("image/") ? "Rasmni" : "Faylni"} yuklab olish
              </a>
            </div>
          ) : null}
          {a.content && a.content.trim() ? (
            <div className="rounded-lg p-4 text-[13.5px] leading-relaxed whitespace-pre-wrap mb-3" style={{ backgroundColor: C.paperDim, color: C.text }}>
              {a.content}
            </div>
          ) : (!hasFile && !legacyAudio ? (
            <div className="rounded-lg p-4 text-[13.5px] mb-3" style={{ backgroundColor: C.paperDim, color: C.text }}>(matn kiritilmagan)</div>
          ) : null)}
          <div className="flex justify-end mt-4"><Button onClick={onClose} icon="check">Tushunarli</Button></div>
        </Modal>
      );
    }

    function StudentResults({ student, results, exams, openResultId, onOpened }) {
      const [selected, setSelected] = useState(null);
      const mine = results.filter((r) => r.studentId === student.id).sort((a, b) => b.submittedAt - a.submittedAt);

      /* Mock endigina tugatilgan bo'lsa (ExamRunner'dan "Natijalar"ga o'tkazilganda),
         o'sha natijani avtomatik ochib beradi. */
      useEffect(() => {
        if (!openResultId) return;
        const r = results.find((x) => x.id === openResultId);
        if (r) setSelected(r);
        if (onOpened) onOpened();
      }, [openResultId]); // eslint-disable-line

      if (selected) {
        const exam = exams.find((e) => e.id === selected.examId);
        return <ResultDetail result={selected} exam={exam} onBack={() => setSelected(null)} />;
      }

      return (
        <div className="space-y-4">
          {mine.map((r) => {
            const exam = exams.find((e) => e.id === r.examId);
            return (
              <Card key={r.id} className="cursor-pointer transition-transform hover:-translate-y-0.5">
                <div onClick={() => setSelected(r)} className="flex flex-col sm:flex-row sm:items-center gap-4">
                  <BandDial value={r.overallBand} size={90} label="Band" />
                  <div className="flex-1 min-w-0">
                    <div className="flex items-start justify-between gap-2">
                      <div className="min-w-0">
                        <div className="font-semibold text-[15px] f-display truncate" style={{ color: C.ink }}>{r.examTitle || exam?.title || "Mock exam"}</div>
                        <div className="text-[12px] mb-2" style={{ color: C.mutedSoft }}>{fmtDate(r.submittedAt)}</div>
                      </div>
                      <Icon name="chevron-right" size={15} style={{ color: C.mutedSoft }} className="shrink-0 mt-1" />
                    </div>
                    <div className="flex gap-3 flex-wrap text-[12.5px]">
                      {r.sectionScores.listening != null && (
                        <Badge tone="teal">
                          Listening: {r.sectionRaw?.listening ? `${r.sectionRaw.listening.correct}/${r.sectionRaw.listening.total}` : `${r.sectionScores.listening}%`}
                          {r.sectionBands?.listening != null ? ` (Band ${r.sectionBands.listening})` : ""}
                        </Badge>
                      )}
                      {r.sectionScores.reading != null && (
                        <Badge tone="teal">
                          Reading: {r.sectionRaw?.reading ? `${r.sectionRaw.reading.correct}/${r.sectionRaw.reading.total}` : `${r.sectionScores.reading}%`}
                          {r.sectionBands?.reading != null ? ` (Band ${r.sectionBands.reading})` : ""}
                        </Badge>
                      )}
                      {r.sectionScores.vocabulary != null && <Badge tone="teal">Vocabulary: {r.sectionScores.vocabulary}%</Badge>}
                      {r.writingStatus === "pending_review" && <Badge tone="gold">Writing: ko'rib chiqilmoqda</Badge>}
                      {r.writingStatus === "graded" && (
                        <Badge tone="success">
                          Writing: {r.writingBand}{r.task1Band != null && r.task2Band != null ? ` (T1: ${r.task1Band}, T2: ${r.task2Band})` : ""}
                        </Badge>
                      )}
                    </div>
                  </div>
                </div>
              </Card>
            );
          })}
          {!mine.length && <EmptyState icon="award" title="Hali natijalar yo'q" sub="Mock exam topshirganingizdan so'ng bu yerda ko'rinadi" />}
        </div>
      );
    }

    /* Bitta savolning natijalar sahifasidagi ko'rinishi — o'quvchi bergan javob
       HECH QACHON to'g'irlanmaydi yoki to'g'ri javob bilan almashtirilmaydi;
       faqat to'g'ri/noto'g'ri/bo'sh holati rang bilan ko'rsatiladi. */
    function ResultQuestionRow({ q }) {
      const given = formatGivenAnswer(q, q.given);
      const state = !q.answered ? "unanswered" : q.isCorrect ? "correct" : "wrong";
      const styles = {
        correct: { border: C.success, bg: C.successSoft, fg: C.success, icon: "circle-check" },
        wrong: { border: C.danger, bg: C.dangerSoft, fg: C.danger, icon: "circle-xmark" },
        unanswered: { border: C.borderSoft, bg: C.paperDim, fg: C.mutedSoft, icon: "circle-question" },
      }[state];
      const questionText = q.text || (q.parts ? partsToPreview(q.parts) : "");
      return (
        <div className="rounded-xl p-3.5" style={{ border: `1.5px solid ${styles.border}`, backgroundColor: styles.bg }}>
          <div className="flex items-start justify-between gap-2 mb-1.5">
            <div className="text-[13.5px] font-semibold" style={{ color: C.text }}>{q.index}. {questionText}</div>
            <Icon name={styles.icon} size={16} style={{ color: styles.fg }} className="shrink-0 mt-0.5" />
          </div>
          <div className="text-[13px]" style={{ color: styles.fg }}>
            <span className="font-semibold">Sizning javobingiz: </span>
